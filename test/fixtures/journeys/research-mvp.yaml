name: research-mvp
description: |
  Journey: ADR-042 MVP-5 — coordinator front-door → research-category
  arc → coordinator return path, end-to-end on mock-LLM against
  configs/e2e-flow-bootstrap.json.

  ROLE-KEYED fixture (responses_by_role). The research pack is a
  for_each fan-out + join (rule 02 fans out gather; rule 03b joins to
  spawn synthesize), so gather and synthesize loops run interleaved /
  out of global order — a flat sequential fixture cannot serve them
  (it desyncs the moment loops spawn out of linear order, and a
  rejected decide cascades into retry storms). Each role gets its own
  response queue, matched on a system-prompt fingerprint; per-bucket
  cursors advance independently and the last entry repeats on
  exhaustion (so a role that runs extra iterations still gets a valid
  terminal action). This is what lets the mock prove the fan-out
  plumbing without real tokens. (The strictly-linear autoresearch /
  dev-via-test journeys still use the flat `responses:` form — they
  never spawn out of order.)

  N=1 for_each: the plan emits a single-subtopic list, so rule 02
  spawns ONE gatherer. Real multi-subtopic fan-out (N>1, truly
  parallel gatherers) is exercised by real-LLM smoke.

  Arc (6 loops): coordinator(dispatch) → researcher-research-plan
  → researcher-research-gather (×1) → researcher-research-synthesize
  → reviewer-research → coordinator(wake-up). Rules: research/01, 02,
  03a (stamp), 03b (join), 04, 07; coordinator/03b-respond-direct.

  Bucket fingerprints (substrings unique to each persona's system
  prompt):
    - "Delegation rules"               → coordinator (dispatch + wake-up)
    - "Emit the typed plan"             → researcher-research-plan
    - "You do NOT emit a research"      → researcher-research-gather
    - "synthesis pass"                  → researcher-research-synthesize
    - "Reviewer — RESEARCH phase"       → reviewer-research

  Paired spec: ui/e2e/agentic/research-mvp.spec.ts.
  Config: configs/e2e-flow-bootstrap.json.

responses_by_role:

  # ---------- coordinator (dispatch → research, then wake-up → respond_direct) ----------
  - match: "Delegation rules"
    responses:
      - tool_call:
          name: decide
          arguments_json: |
            {
              "action": "research",
              "reason": "The user is asking for a comparison of MQTT vs NATS for IoT edge deployments — a comparison-of-named-products question that benefits from evidence gathering rather than a small-talk reply. Routing to the research category so the research-pack arc can scope the synthesis."
            }
      - tool_call:
          name: decide
          arguments_json: |
            {
              "action": "respond_direct",
              "reason": "For IoT edge deployments on constrained ARM devices, MQTT has the edge on raw latency and footprint (Mosquitto runs under 2MB resident; QoS 0 publishes complete in well under a millisecond on Raspberry Pi-class hardware). NATS wins when you need both pub/sub AND request-reply in the same broker — its subject hierarchy is more expressive and JetStream gives you persistence — but it costs ~30MB of resident memory which matters on the tightest devices. Pick MQTT if pub/sub alone is sufficient and memory is tight; pick NATS when the workload needs request-reply or you have >256MB RAM to spare. The full research artifact (actors, integration points, decision criteria) is captured in the chain entity for follow-up."
            }

  # ---------- researcher-research-plan (emit_plan → decide gather, N=1 subtopics) ----------
  - match: "Emit the typed plan"
    responses:
      - tool_call:
          name: emit_plan
          arguments_json: |
            {
              "revision": 1,
              "title": "MQTT vs NATS for IoT edge — research plan",
              "goal": "Compare MQTT and NATS for IoT edge deployments — latency, footprint, and reliability characteristics on constrained ARM devices.",
              "context": "Initial planning pass. N=1: a single gather probe covers the latency + footprint axes the synthesize pass needs to compose an answer the wake-up coordinator can deliver.",
              "scope_in": [
                "MQTT broker family (Mosquitto, EMQ X, HiveMQ) — protocol surface + QoS levels",
                "NATS server family (NATS Core, JetStream) — subject hierarchy + persistence story",
                "ARM-device benchmarks for both"
              ],
              "scope_out": [
                "MQTT/NATS bridge implementations — out of scope for the comparison question",
                "Cloud-only deployment patterns — user asked about edge"
              ],
              "epics": [
                "E1 — Protocol surface: pub/sub vs request/reply, QoS levels, retained messages",
                "E2 — Footprint: memory + binary size on constrained ARM (Raspberry Pi class)",
                "E3 — Latency: round-trip benchmarks on constrained hardware"
              ]
            }
      - tool_call:
          name: decide
          arguments_json: |
            {
              "action": "gather",
              "subtopics": [
                "MQTT vs NATS — latency + memory footprint on constrained ARM (Raspberry Pi class) edge devices"
              ],
              "reason": "Plan emitted. One gather probe covers the comparison's load-bearing axes (latency + footprint on constrained ARM); SYNTHESIZE will compose the answer the wake-up coordinator delivers to the user."
            }

  # ---------- researcher-research-gather (×1 from for_each) → web_search → decide synthesize ----------
  - match: "You do NOT emit a research"
    responses:
      - tool_call:
          id: call_gather_web_1
          name: web_search
          arguments_json: |
            {
              "query": "MQTT vs NATS latency and memory footprint on constrained ARM IoT edge devices"
            }
      - tool_call:
          name: decide
          arguments_json: |
            {
              "action": "synthesize",
              "reason": "Subtopic: MQTT vs NATS — latency + memory footprint on constrained ARM (Raspberry Pi class) edge devices\n\nEvidence gathered (tool_result_ref=call_gather_web_1): [1] https://docs.nats.io/compare ('NATS vs MQTT, Kafka, and other messaging systems for IoT and edge.'), [2] https://mqtt.org/specification ('MQTT v5.0 protocol specification for lightweight pub/sub messaging.'), [3] https://example.com/edge-messaging ('Comparison of messaging protocols for constrained IoT environments.'). Forwarding to SYNTHESIZE to compose the comparison."
            }

  # ---------- researcher-research-synthesize (emit_research_artifact → decide emit) ----------
  - match: "synthesis pass"
    responses:
      - tool_call:
          name: emit_research_artifact
          arguments_json: |
            {
              "revision": 1,
              "title": "MQTT vs NATS for IoT edge",
              "actors": [
                {
                  "name": "MQTT broker",
                  "role": "TCP-based pub/sub broker with three QoS levels (0/1/2); reference implementation Mosquitto runs in <2MB resident on constrained ARM",
                  "evidence": [
                    {
                      "channel": "web",
                      "locator": "https://mqtt.org/specification",
                      "origin_id": "https://mqtt.org/specification",
                      "retrieved_at": "2026-10-16T12:00:00Z",
                      "source_class": "official",
                      "quote": "MQTT v5.0 protocol specification for lightweight pub/sub messaging.",
                      "tool_result_ref": "call_gather_web_1",
                      "revision": 1
                    }
                  ]
                },
                {
                  "name": "NATS server",
                  "role": "Subject-hierarchy pub/sub plus request-reply; JetStream variant adds persistence; binary ~10MB on ARM, runtime memory ~30MB",
                  "evidence": [
                    {
                      "channel": "web",
                      "locator": "https://docs.nats.io/compare",
                      "origin_id": "https://docs.nats.io/compare",
                      "retrieved_at": "2026-10-16T12:00:00Z",
                      "source_class": "official",
                      "quote": "NATS vs MQTT, Kafka, and other messaging systems for IoT and edge.",
                      "tool_result_ref": "call_gather_web_1",
                      "revision": 1
                    }
                  ]
                },
                {
                  "name": "Constrained ARM device",
                  "role": "Raspberry Pi-class hardware (1GHz CPU, 256MB-1GB RAM) hosting the edge agent",
                  "evidence": [
                    {
                      "channel": "web",
                      "locator": "https://example.com/edge-messaging",
                      "origin_id": "https://example.com/edge-messaging",
                      "retrieved_at": "2026-10-16T12:00:00Z",
                      "source_class": "secondary",
                      "quote": "Comparison of messaging protocols for constrained IoT environments.",
                      "tool_result_ref": "call_gather_web_1",
                      "revision": 1
                    }
                  ]
                }
              ],
              "integration_points": [
                {
                  "from": "MQTT broker",
                  "to": "Constrained ARM device",
                  "data": "QoS-tagged pub/sub messages over TCP",
                  "direction": "read",
                  "evidence": [
                    {
                      "channel": "web",
                      "locator": "https://mqtt.org/specification",
                      "origin_id": "https://mqtt.org/specification",
                      "retrieved_at": "2026-10-16T12:00:00Z",
                      "source_class": "official",
                      "quote": "lightweight pub/sub messaging",
                      "tool_result_ref": "call_gather_web_1",
                      "revision": 1
                    }
                  ]
                },
                {
                  "from": "NATS server",
                  "to": "Constrained ARM device",
                  "data": "subject-hierarchy pub/sub + request-reply over TCP",
                  "direction": "read",
                  "evidence": [
                    {
                      "channel": "web",
                      "locator": "https://docs.nats.io/compare",
                      "origin_id": "https://docs.nats.io/compare",
                      "retrieved_at": "2026-10-16T12:00:00Z",
                      "source_class": "official",
                      "quote": "NATS vs MQTT, Kafka, and other messaging systems for IoT and edge.",
                      "tool_result_ref": "call_gather_web_1",
                      "revision": 1
                    }
                  ]
                }
              ],
              "tasks": [
                "Choose MQTT for sub-millisecond latency budgets on minimal-footprint hardware where pub/sub alone is sufficient",
                "Choose NATS when the workload mixes pub/sub + request-reply, and edge hardware has >256MB RAM"
              ],
              "addressed_gaps": [
                "Question scope (latency + footprint on ARM) is answered with concrete published numbers — no further gather pass needed"
              ],
              "open_gaps": [
                "needs_test_harness: not applicable — informational comparison research, no external integration target to verify against"
              ],
              "substrate_mutations": []
            }
      - tool_call:
          name: decide
          arguments_json: |
            {
              "action": "emit",
              "reason": "Artifact rev 1 emitted. Three actors (MQTT broker, NATS server, constrained ARM device); two integration points (broker → edge); two task-shaped recommendations (when to choose which). Reviewer should approve and the wake-up coordinator can deliver the synthesised comparison directly."
            }

  # ---------- reviewer-research (decide approved) ----------
  - match: "Reviewer — RESEARCH phase"
    responses:
      - tool_call:
          name: decide
          arguments_json: |
            {
              "action": "approved",
              "reason": "Checklist satisfied: three actors with role text, two integration points with direction, two decomposable task-shaped recommendations, all artifact fields well-formed. open_gaps carries the test_harness path (not applicable — informational research). Substrate untouched. Research arc terminates here — rule 07 will spawn the wake-up coordinator to deliver the answer."
            }

  # ---------- ops-chain-observer (ADR-027) ----------
  # The ops rule fires on every run reaching a terminal phase, so EVERY
  # journey whose run terminates now spawns one observer loop. Without a
  # bucket the mock falls back to bucket 0's last response (a coordinator
  # decide), whose action is off the observer's ["observed"] allowlist —
  # rejected, re-picked, and ground to max_iterations as truncated.
  # One clean terminal keeps the journey honest and cheap.
  - match: "operations analyst"
    responses:
      - tool_call:
          name: decide
          arguments_json: |
            {
              "action": "observed",
              "reason": "Read the run entity and the coordinator loop result. Run reached its terminal phase with no operator-actionable pattern; emitting no findings."
            }
