name: dev-via-spec
description: |
  Journey: ADR-041 §"Phasing Phase 3" rewrite of the dev-via-spec
  golden-path arc for the MVP role compression. Replaces the legacy
  six-role planner/reviewer/challenger/architect/builder chain with
  the four-phase researcher roster (plan → gather → synthesize →
  architect) feeding a single reviewer-spec → builder → reviewer-qa
  terminal. Every gate approves on first pass; retry paths (reviewer
  insufficient via rule 02, qa needs_clarification via rule 03) are
  exercised by the sibling dev-via-spec-qa.yaml journey.

  Chain (per ADR-041 §"Allowed transitions" + §"Wire shape"):

    researcher-plan (dispatch) → decide(gather)
      → rule 04-phase-transition-to-gather → researcher-gather
    researcher-gather → decide(synthesize)
      → rule 05b-phase-transition-to-synthesize-dev-via-spec
        → researcher-synthesize (chain.mode=dev_via_spec)
    researcher-synthesize → emit_research_artifact (rev 1)
                          + decide(architect)
      → rule 06-phase-transition-to-architect → researcher-architect
    researcher-architect → emit_dev_via_spec_artifact + decide(emit)
      → rule 01b-researcher-architect-to-reviewer-spec → reviewer-spec
    reviewer-spec → decide(approved)
      → phasevalidator.SpecModeGate writes chain.spec_mode_gate.proceed
      → rule 02-reviewer-approved-to-builder → builder
    builder → bootstrap_workspace + bash + builder_decide(tests_passing)
      → phasevalidator.QAModeGate writes chain.qa_mode_gate.proceed
      → rule 04-builder-decide-to-reviewer-qa → reviewer-qa
    reviewer-qa → decide(accept) → terminal

  Seven loops total — three fewer than the pre-ADR-041 ten-loop count
  (which had a curator + planner/reviewer/challenger triangle ahead of
  the architect). The compressed roster compounds two reductions:
  source-curator absorbed into the model floor (ADR-041 §1),
  planner+reviewer+challenger absorbed into researcher-plan and
  reviewer-spec.

  Paired spec: ui/e2e/agentic/dev-via-spec.spec.ts.
  Required compose profile: sandbox (the builder loop calls
  bootstrap_workspace + bash; both route through the sandbox container
  per ADR-032 §R3.6.2.a wiring).

  Sequence (seven loops, nineteen LLM round-trips):

    Loop A — researcher-plan (initial pass, dispatch)
      1. tool_call: emit_plan (rev 1, scoped to OSH Meshtastic driver)
      2. tool_call: decide(action="gather", reason=<plan substance>)
         → phasevalidator: plan→gather allowed, gather count 0→1
         → rule_04 fires → spawn researcher-gather.

    Loop B — researcher-gather (rule_04 spawn)
      3. tool_call: read_loop_result on Loop A (placeholder; errors)
      4. tool_call: query_entity (resolves OSH driver entities)
      5. tool_call: decide(action="synthesize", reason=<evidence
         accumulated>)
         → phasevalidator: gather→synthesize allowed, synthesize count
           0→1
         → rule_05 fires → spawn researcher-synthesize.

    Loop C — researcher-synthesize (rule_05 spawn)
      6. tool_call: read_loop_result on Loop B (placeholder; errors)
      7. tool_call: emit_research_artifact (rev 1, full
         actors/integration_points/tasks composed from GATHER evidence)
      8. tool_call: decide(action="architect", reason=<artifact ready
         for architect phase>)
         → phasevalidator: synthesize→architect allowed, architect count
           0→1
         → rule_06 fires → spawn researcher-architect.

    Loop D — researcher-architect (rule_06 spawn)
      9. tool_call: read_loop_result on Loop C (placeholder; errors)
     10. tool_call: emit_dev_via_spec_artifact (renders docs/specs/
         <slug>.md AND mints dev_via_spec.artifact.{path,slug,...}
         marker triples on the architect loop entity)
     11. tool_call: decide(action="emit", reason=<spec emitted with
         tasks grounded against actors + integration_points>)
         → phasevalidator: architect→emit allowed (terminal forward
           edge, no count increment)
         → rule_01b fires → spawn reviewer-spec.

    Loop E — reviewer-spec (rule_01b spawn)
     12. tool_call: read_loop_result on Loop D (placeholder; errors)
     13. tool_call: bash `cat /artifacts/specs/<slug>.md` — ADR-041 Phase 4
         chain-scoped bash. Reviewer reads the architect's emitted
         markdown directly from the shared /artifacts volume to grade
         against checks[]+actors[]+integration_points[]. Placeholder
         spec_path; the tool surfaces the mismatch — next canned turn
         decides anyway. Same placeholder convention as read_loop_result.
     14. tool_call: decide(action="approved", reason=<all checks pass>)
         → phasevalidator.SpecModeGate validates
           coordinator.evidence_loop_ids non-empty AND forwards
           dev_via_spec.artifact.{path,slug} triples from the
           architect entity (Loop D) onto the reviewer-spec entity,
           then writes chain.spec_mode_gate.proceed="true"
         → rule_02 fires → spawn builder.

    Loop F — builder (rule_02 spawn)
     15. tool_call: bootstrap_workspace (the hardcoded spec_path will
         not match the architect's dynamically-dated emit on most
         days; the tool surfaces "spec file not found" — same
         placeholder-doesn't-resolve convention as the read_loop_result
         calls earlier. The next canned turn handles it.)
     16. tool_call: bash ls SPEC.md
     17. tool_call: bash echo "mvn test passing"
     18. tool_call: builder_decide(action="tests_passing", tests_run=3,
         tests_passed=3, tests_failed=0)
         → phasevalidator.QAModeGate validates tests_run > 0 AND
           tests_failed = 0, then writes chain.qa_mode_gate.proceed
         → rule_04 fires → spawn reviewer-qa.

    Loop G — reviewer-qa (rule_04 spawn — terminal)
     19. tool_call: read_loop_result on Loop F (placeholder; errors)
     20. tool_call: bash `ls -la SPEC.md` — ADR-041 Phase 4 chain-scoped
         bash. Reviewer-qa inspects the chain's shared workspace
         (same task_id as builder, since chain_id == loop_id of the
         dispatch loop and bash + bootstrap_workspace are both chain-
         scoped). Builds intuition that the reviewer can see the
         builder's tree, not just the structured terminal.
     21. tool_call: decide(action="accept", reason=<build accepted>)
         → terminal. No rule fires on action=accept (rule 03 fires
           only on needs_clarification, which is exercised by the
           sibling dev-via-spec-qa journey).

  Mock-llm is sequence-based and role-blind. The fixture aligns to
  the exact order of LLM round-trips across all seven loops. Same
  read_loop_result / bootstrap_workspace / bash placeholder caveat:
  arguments_json passes verbatim, tools return errors, the next canned
  turn handles them. The structural assertion (rule chain firing in
  order + role distribution + gate sentinels + final state) is
  unaffected.

  Builder-loop terminal choice (tests_passing): canned. The
  builder_decide tool emits coordinator.next_action=tests_passing
  unconditionally given the args; mock-LLM does not actually run
  tests in the workspace. The artifact_summary string is decorative
  — reviewer-qa mock-LLM does not read prompt content. This is a
  shape proof, not a substance proof; smoke #21 (Phase 4) is where
  actual `mvn test` runs against a real LLM.

  Per-phase cap budget (ADR-041 §"Per-phase cap"):
  plan=1 (counter doesn't increment on dispatch entry — plan is fresh
  chain root), gather=3 (this fixture consumes 1 of 3),
  synthesize=2 (consumes 1 of 2), architect=2 (consumes 1 of 2). The
  recovery cycle exercised by dev-via-spec-qa.yaml consumes the
  remaining headroom.

responses:
  # ---------- Loop A: researcher-plan (initial pass, dispatch) ----------

  - tool_call:
      name: emit_plan
      arguments_json: |
        {
          "revision": 1,
          "title": "OSH Meshtastic driver plan",
          "goal": "Implement the OSH IDriver interface backed by Meshtastic radio packets, exposing OGC CS observation endpoints.",
          "context": "Initial planning pass — the research arc has not yet enumerated the corpus actors. The driver sits at the boundary between Meshtastic packet ingestion (read) and OGC CS observation publishing (write); the GATHER and SYNTHESIZE phases will produce the corpus-grounded artifact and the ARCHITECT phase will emit the typed spec.",
          "scope_in": [
            "OSH IDriver interface implementation",
            "Meshtastic packet decoder",
            "OGC CS observation publisher"
          ],
          "scope_out": [
            "Meshtastic firmware changes — upstream-owned",
            "OGC CS specification work — standards body owns; we conform"
          ],
          "epics": [
            "E1 — Meshtastic packet ingestion: read-side decoder normalising radio packets into the driver's internal observation envelope",
            "E2 — OGC CS observation publishing: write-side publisher exposing the IDriver interface",
            "E3 — Lifecycle and recovery: IDriver lifecycle hooks plus the radio-disconnect failure-mode handler"
          ]
        }

  - tool_call:
      name: decide
      arguments_json: |
        {
          "action": "gather",
          "reason": "Plan emitted: OSH Meshtastic driver plan rev 1. Goal: Implement the OSH IDriver interface backed by Meshtastic radio packets, exposing OGC CS observation endpoints. Three epics (Meshtastic packet ingestion / OGC CS observation publishing / lifecycle and recovery) decompose the work at interface granularity. The GATHER phase should enumerate the corpus actors — OSH driver framework, OGC CS endpoints, Meshtastic radio — and identify the integration boundaries the synthesize pass will compose into the artifact."
        }

  # ---------- Loop B: researcher-gather (rule_04 spawn) ----------

  - tool_call:
      name: read_loop_result
      arguments_json: |
        {
          "loop_id": "plan-loop-A"
        }

  - tool_call:
      name: query_entity
      arguments_json: |
        {
          "entity_id": "osh.core.api.module.IModule"
        }

  - tool_call:
      name: decide
      arguments_json: |
        {
          "action": "synthesize",
          "reason": "GATHER enumerated three OSH driver entities: osh.core.api.module.IModule (the IDriver-adjacent module interface), osh.core.api.sensor.IDriver (the driver contract itself), osh.core.impl.module.BaseSensorModule (the base implementation). Three concrete integration points emerge: Meshtastic radio → OSH driver (telemetry read-side), OSH driver → OGC CS endpoints (observation write-side), and the lifecycle/disconnect-recovery boundary. SYNTHESIZE can compose a substantive artifact."
        }

  # ---------- Loop C: researcher-synthesize (rule_05 spawn) ----------

  - tool_call:
      name: read_loop_result
      arguments_json: |
        {
          "loop_id": "gather-loop-B"
        }

  - tool_call:
      name: emit_research_artifact
      arguments_json: |
        {
          "revision": 1,
          "test_harness": "meshtasticd-2.x",
          "title": "OSH Meshtastic driver research",
          "actors": [
            {"name": "OSH driver framework", "role": "Hosts the IDriver interface drivers must implement to expose sensor observations"},
            {"name": "OGC CS endpoints", "role": "Standard endpoints for observations, system descriptions, and control streams that the driver exposes"},
            {"name": "Meshtastic radio", "role": "LoRa mesh radio interface that emits packetised telemetry the driver consumes"}
          ],
          "integration_points": [
            {"from": "OSH driver", "to": "OGC CS endpoints", "data": "observation messages and system descriptions", "direction": "write"},
            {"from": "Meshtastic radio", "to": "OSH driver", "data": "packetised radio telemetry", "direction": "read"}
          ],
          "tasks": [
            "Implement OSH `IDriver` interface backed by Meshtastic radio events, exposing OGC CS observation endpoints"
          ],
          "addressed_gaps": [],
          "open_gaps": [],
          "substrate_mutations": []
        }

  - tool_call:
      name: decide
      arguments_json: |
        {
          "action": "architect",
          "reason": "Artifact rev 1 emitted with three actors, two integration points, one decomposable task. Forwarding to ARCHITECT so the typed spec can be composed against the planner's E1/E2/E3 epics — read-side decoder, write-side publisher, lifecycle handler."
        }

  # ---------- Loop D: researcher-architect (rule_06 spawn) ----------

  - tool_call:
      name: read_loop_result
      arguments_json: |
        {
          "loop_id": "synthesize-loop-C"
        }

  - tool_call:
      name: emit_dev_via_spec_artifact
      arguments_json: |
        {
          "title": "OSH Meshtastic Driver",
          "goal": "Implement the OSH IDriver interface backed by Meshtastic radio packets, exposing OGC CS observation endpoints.",
          "context": "The research arc enumerated the OSH driver framework (hosts the IDriver interface), OGC CS endpoints (observation surface), and Meshtastic radio (telemetry source). The driver sits at the boundary between Meshtastic packet ingestion (read) and OGC CS observation publishing (write).",
          "actors": [
            {"name": "OSH driver framework", "role": "Hosts the IDriver interface drivers must implement to expose sensor observations"},
            {"name": "OGC CS endpoints", "role": "Standard endpoints for observations, system descriptions, and control streams that the driver exposes"},
            {"name": "Meshtastic radio", "role": "LoRa mesh radio interface that emits packetised telemetry the driver consumes"}
          ],
          "integration_points": [
            {"from": "Meshtastic radio", "to": "OSH driver framework", "direction": "read", "data": "packetised radio telemetry"},
            {"from": "OSH driver framework", "to": "OGC CS endpoints", "direction": "write", "data": "observation messages and system descriptions"}
          ],
          "tasks": [
            {
              "title": "Meshtastic packet decoder",
              "scope": "backend",
              "grounds_actors": ["Meshtastic radio", "OSH driver framework"],
              "grounds_integration_points": ["Meshtastic radio→OSH driver framework"]
            },
            {
              "title": "OGC CS observation publisher",
              "scope": "backend",
              "grounds_actors": ["OSH driver framework", "OGC CS endpoints"],
              "grounds_integration_points": ["OSH driver framework→OGC CS endpoints"]
            },
            {
              "title": "IDriver lifecycle and failure-mode handler",
              "scope": "backend",
              "grounds_actors": ["OSH driver framework", "Meshtastic radio"]
            }
          ],
          "provenance": {
            "research_artifact_loop": "synthesize-loop-C"
          }
        }

  - tool_call:
      name: decide
      arguments_json: |
        {
          "action": "emit",
          "reason": "Spec emitted at docs/specs/<slug>.md. Three tasks grounded against three actors and two integration points: T1 (Meshtastic decoder, read-side), T2 (OGC CS publisher, write-side), T3 (IDriver lifecycle + failure-mode handler). Reviewer-spec should grade against the completeness checklist + external-actor coverage gate."
        }

  # ---------- Loop E: reviewer-spec (rule_01b spawn) ----------

  - tool_call:
      name: read_loop_result
      arguments_json: |
        {
          "loop_id": "architect-loop-D"
        }

  - tool_call:
      name: bash
      arguments_json: |
        {
          "command": "cat /artifacts/specs/2026-05-13-osh-meshtastic-driver.md"
        }

  - tool_call:
      name: decide
      arguments_json: |
        {
          "action": "approved",
          "reason": "Spec checklist satisfied: three actors with role text, two integration points with direction + data shape, three tasks grounded against actors + integration_points, all external actors (Meshtastic radio, OGC CS endpoints) covered by at least one task. No structural gaps. Approving so the builder can bootstrap a workspace against the emitted spec."
        }

  # ---------- Loop F: builder (rule_02 spawn) ----------

  - tool_call:
      name: bootstrap_workspace
      arguments_json: |
        {
          "spec_path": "/artifacts/specs/2026-05-13-osh-meshtastic-driver.md"
        }

  - tool_call:
      name: bash
      arguments_json: |
        {
          "command": "ls SPEC.md"
        }

  - tool_call:
      name: bash
      arguments_json: |
        {
          "command": "echo 'mvn test passing'"
        }

  - tool_call:
      name: builder_decide
      arguments_json: |
        {
          "action": "tests_passing",
          "reason": "Canned tests_passing terminal for the MVP chain shape proof. Mock-LLM did not actually run tests in the workspace; the builder_decide tool emits coordinator.next_action=tests_passing unconditionally given the args, which is what triggers rule_04 (builder→reviewer-qa) once phasevalidator.QAModeGate validates tests_run > 0 AND tests_failed = 0. Substance lives in smoke #21 (Phase 4) on real LLM.",
          "tests_run": 3,
          "tests_passed": 3,
          "tests_failed": 0,
          "artifact_summary": "Canned summary — three notional unit tests passing for the MVP-chain stub. Real artifact_summary content arrives in smoke #21."
        }

  # ---------- Loop G: reviewer-qa (rule_04 spawn — terminal) ----------

  - tool_call:
      name: read_loop_result
      arguments_json: |
        {
          "loop_id": "builder-loop-F"
        }

  - tool_call:
      name: bash
      arguments_json: |
        {
          "command": "ls -la SPEC.md"
        }

  - tool_call:
      name: decide
      arguments_json: |
        {
          "action": "accept",
          "reason": "Builder delivered tests_passing with tests_run=3, tests_passed=3, tests_failed=0. The qa_mode_gate has already validated structural presence (tests_run > 0 AND tests_failed = 0) before this loop spawned; my job is to grade BUILD QUALITY against the architect's checks. Mock-LLM journey: no real evidence summary, but accept is the canned terminal here — the needs_clarification + recovery cycle is exercised by the sibling dev-via-spec-qa journey."
        }
