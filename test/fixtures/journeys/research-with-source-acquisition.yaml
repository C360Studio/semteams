name: research-with-source-acquisition
description: |
  Journey: R2.5 of ADR-031. Chains R1's iterative researcher with R2's
  add_source_repo. Initial researcher pass flags a corpus gap; reviewer
  rejects with "corpus missing — recommend add_source_repo"; retry
  spawns the researcher-with-source-acquisition role, which calls
  add_source_repo (approval-gated). After human approval, the SAME
  loop iterates against the now-augmented corpus and submits a
  complete artifact. The reviewer approves on pass 2; loop terminates.

  This is the structural test of the ADR-031 invariant — research can
  modify the substrate it is reasoning over.

  Paired spec: ui/e2e/agentic/research-with-source-acquisition.spec.ts.
  Required compose profile: semsource (the SemSource container is
  only spawned for journeys that exercise add_source_repo).

  Sequence (matches the fixture, four loops, ten LLM round-trips):

    Loop A — researcher (initial pass, default_role)
      1. tool_call: query_entity (corpus probe, returns nothing useful)
      2. completion: incomplete artifact with open_gaps naming the
         missing corpus. → outcome=success → rule_01a fires.

    Loop B — research-reviewer (pass 1)
      3. tool_call: read_loop_result (placeholder; tool errors,
         consumed by next canned turn)
      4. tool_call: decide(insufficient, reason includes
         "recommend add_source_repo for osh-core")
         → coordinator.next_action=insufficient → rule_02 fires.

    Loop C — researcher-with-source-acquisition (retry, substrate-
              modifying pass)
      5. tool_call: read_loop_result (placeholder; tool errors)
      6. tool_call: add_source_repo(url=osh-core, namespace=research)
         → agentic-tools approval filter: approval_required.
         agentic-loop pauses on awaiting_approval, emits
         ApprovalPendingEvent. (Test approves via
         /teams-dispatch/loops/{id}/approval. Loop re-dispatches the
         tool with ApprovedBy; SemSource handles AddRequest, replies
         success; tool result returned to LLM.)
      7. tool_call: query_entity (now against the augmented corpus;
         finds OSH driver framework + Meshtastic radio actors)
      8. completion: complete artifact with addressed_gaps including
         the source registration and the substantive findings.
         → outcome=success → rule_01b fires.

    Loop D — research-reviewer (pass 2)
      9. tool_call: read_loop_result (placeholder; tool errors)
     10. tool_call: decide(approved)
         → terminal. No rule fires.

  Mock-llm is sequence-based and role-blind. The fixture aligns to
  the exact order of LLM round-trips across all four loops. Same
  read_loop_result placeholder caveat as R1: arguments_json passes
  verbatim, the placeholder loop_id will not resolve, the tool
  returns an error, the next canned turn handles it. R3 may add
  fixture template substitution upstream; the structural assertion
  (rule chain + approval round-trip) is unaffected.

responses:
  # ---------- Loop A: researcher (initial pass) ----------

  - tool_call:
      name: query_entity
      arguments_json: |
        {
          "id": "osh.driver.framework"
        }

  - completion:
      content: |
        Initial research pass on OSH driver framework actors. The
        corpus does not appear to contain OSH driver framework
        documentation — `query_entity` found no match for
        `osh.driver.framework`. Submitting an empty artifact with
        the corpus gap explicitly named so the reviewer can decide
        whether to extend the corpus.

        ```json
        {
          "actors": [],
          "integration_points": [],
          "seed_requirements": [],
          "addressed_gaps": [],
          "open_gaps": [
            "Corpus missing: OSH driver framework is not indexed in our test SemSource (queried osh.driver.framework, no match). Recommend add_source_repo for the OSH core repo before continuing."
          ]
        }
        ```

  # ---------- Loop B: research-reviewer (pass 1) ----------

  - tool_call:
      name: read_loop_result
      arguments_json: |
        {
          "loop_id": "researcher-loop-placeholder"
        }

  - tool_call:
      name: decide
      arguments_json: |
        {
          "action": "insufficient",
          "reason": "Checklist for OSH-driver-framework prompt not met:\n- Corpus does not contain the OSH driver framework. Researcher's open_gaps confirms `query_entity` found no match. Recommend add_source_repo for https://github.com/sensorhub-tools/osh-core in namespace=research before iterating.\n- Once the corpus is extended, re-run the actor enumeration: OSH driver framework actor, OGC Connected Systems endpoints actor, Meshtastic radio actor."
        }

  # ---------- Loop C: researcher-with-source-acquisition (retry) ----------

  - tool_call:
      name: read_loop_result
      arguments_json: |
        {
          "loop_id": "reviewer-loop-placeholder"
        }

  - tool_call:
      name: add_source_repo
      arguments_json: |
        {
          "url": "https://github.com/sensorhub-tools/osh-core",
          "branch": "main",
          "namespace": "research"
        }

  - tool_call:
      name: query_entity
      arguments_json: |
        {
          "id": "osh.driver.framework"
        }

  - completion:
      content: |
        Retry pass with substrate extension. Registered the OSH core
        repo via add_source_repo (approval granted), then queried the
        now-augmented corpus and located the OSH driver framework,
        OGC Connected Systems endpoints, and Meshtastic radio actors.

        ```json
        {
          "actors": [
            {"name": "OSH driver framework", "role": "Implements the IDriver interface; pluggable component that adapts a sensor protocol to OSH's data model"},
            {"name": "OGC Connected Systems endpoints", "role": "REST/SSE endpoints exposing observations, system descriptions, and control streams"},
            {"name": "Meshtastic radio", "role": "LoRa-based mesh radio with channel-scoped packets; sensors publish observations as MeshPacket payloads on a configured channel"}
          ],
          "integration_points": [
            {"from": "OSH driver framework", "to": "OGC Connected Systems endpoints", "data": "observations, system descriptions", "direction": "write"},
            {"from": "Meshtastic radio", "to": "OSH driver framework", "data": "MeshPacket payloads carrying sensor observations", "direction": "read"}
          ],
          "seed_requirements": [
            "Implement OSH IDriver interface backed by a Meshtastic MQTT/serial bridge so MeshPacket observations surface as OGC CS observation events"
          ],
          "addressed_gaps": [
            "Registered https://github.com/sensorhub-tools/osh-core in namespace=research via add_source_repo, extending the corpus",
            "Queried the augmented corpus and enumerated OSH driver framework, OGC CS endpoints, and Meshtastic radio actors",
            "Added integration point pairs OSH-driver→OGC-CS (write) and Meshtastic→OSH-driver (read)",
            "Refined seed requirement to interface-level granularity citing the Meshtastic backing"
          ],
          "open_gaps": []
        }
        ```

  # ---------- Loop D: research-reviewer (pass 2) ----------

  - tool_call:
      name: read_loop_result
      arguments_json: |
        {
          "loop_id": "researcher-with-source-loop-placeholder"
        }

  - tool_call:
      name: decide
      arguments_json: |
        {
          "action": "approved",
          "reason": "Checklist met after substrate extension. OSH driver framework actor, OGC Connected Systems endpoints actor, Meshtastic radio actor all named with role text. Both required integration point pairs present with direction. Seed requirement at interface granularity citing Meshtastic backing. Approving."
        }
