name: autoresearch-descended-status
description: Mock-only descended clarification status qualification. The propose loop reports
  needs_clarification and the original coordinator returns an honest limitation via respond_direct.
  Existing lifecycle policy leaves the run executing rather than asserting successful completion or
  failure. No further experiment, continuation, or completed-run claim is implied.
responses_by_role:
  - match: You are the SemTeams coordinator
    responses:
      - tool_call:
          name: query_sandbox_attestation
          arguments_json: |
            {}
      - tool_call:
          name: request_sandbox
          arguments_json: >
            {
              "profile": "go-backend",
              "reason": "Optimizing a Go test command's wallclock needs a prepared environment to run the measurement repeatedly."
            }
      - tool_call:
          name: decide
          arguments_json: >
            {
              "action": "autoresearch",
              "reason": "Optimize the wallclock of `go test ./...`. Command: go test ./...; surface: ./...; cap: 2 iterations; metric: real seconds parsed from the test output. Lower is better."
            }
      - tool_call:
          name: decide
          arguments_json: '{"action":"respond_direct","reason":"Autoresearch stopped before an experiment
            because the current surface is too narrow. No improvement or completed optimization is
            claimed; the run requires follow-up under the existing lifecycle policy."}'
  - match: "**BASELINE phase**"
    responses:
      - tool_call:
          name: emit_autoresearch_baseline
          arguments_json: |
            {
              "command": "go test ./...",
              "surface": "./...",
              "cap": 2,
              "metric_parser": "real seconds from the go test summary line",
              "baseline_value": 1.20,
              "baseline_pass": true,
              "baseline_stdout_tail": "ok  example  1.20s"
            }
      - tool_call:
          name: decide
          arguments_json: >
            {
              "action": "propose",
              "reason": "Baseline captured at 1.20s. Beginning the iteration loop (cap 2) — propose single-axis changes and keep the ones that lower the wallclock."
            }
  - match: "**PROPOSE phase**"
    responses:
      - tool_call:
          name: decide
          arguments_json: '{"action":"needs_clarification","reason":"The bounded surface is too narrow; ask
            the user which additional test directories may change."}'
  - match: operations analyst
    responses:
      - tool_call:
          name: decide
          arguments_json: >
            {
              "action": "observed",
              "reason": "Read the run entity and the coordinator loop result. Run reached its terminal phase with no operator-actionable pattern; emitting no findings."
            }
