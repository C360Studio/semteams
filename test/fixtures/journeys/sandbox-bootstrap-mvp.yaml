name: sandbox-bootstrap-mvp
description: |
  Journey: ADR-042 §addendum 2026-05-29 PR 2 — coordinator front-door
  → sandbox-bootstrap category arc → coordinator return path,
  end-to-end on mock-LLM against configs/e2e-flow-bootstrap.json.

  This is the journey that validates the sandbox-bootstrap category
  pack (configs/rules/sandbox-bootstrap/ + the four
  provisioner-bootstrap-* + reviewer-bootstrap persona bundles)
  AGAINST the §A foundation PR's product-shell tools
  (query_sandbox_tenant, emit_bootstrap_{plan,verify,committed}).

    Loop 0 — coordinator (dispatch from user prompt)
      1. tool_call: decide(action="bootstrap_sandbox", reason=...)
         → rule sandbox-bootstrap/01-coordinator-bootstrap-spawn fires
         → spawn provisioner-bootstrap-plan

    Loop A — provisioner-bootstrap-plan (rule 01 spawn)
      2. tool_call: read_loop_result (placeholder)
      3. tool_call: query_sandbox_tenant(signature inputs)
         → returns null (registry miss)
      4. tool_call: emit_bootstrap_plan (provision action,
         full recipe — base_image, clone_command, install_steps,
         volume_mounts, docker_socket_mount, verify_command,
         expected_smoke_signature)
         → registry transitions to provisioning
         → sandbox.tenant.* triples stamped on run entity
      5. tool_call: decide(action="execute", reason=<recipe summary>)
         → rule sandbox-bootstrap/02b-plan-to-execute fires
         → spawn provisioner-bootstrap-execute

    Loop B — provisioner-bootstrap-execute (rule 02b spawn)
      6. tool_call: read_loop_result on plan loop
      7. tool_call: bash (docker run + clone + install
         placeholder — the always-warm sandbox container returns
         simulated success; no real Docker called inside mock-llm
         scope)
      8. tool_call: decide(action="verify", reason=<provisioned>)
         → rule sandbox-bootstrap/03-execute-to-verify fires
         → spawn provisioner-bootstrap-verify

    Loop C — provisioner-bootstrap-verify (rule 03 spawn)
      9. tool_call: read_loop_result on execute loop
      10. tool_call: bash (docker exec smoke — placeholder
          returns "PASS" matching expected_smoke_signature)
      11. tool_call: emit_bootstrap_verify(verify_outcome=ok,
          container_name, workspace_path, smoke_exit_code=0,
          smoke_matches_expected=true)
          → sandbox.verify.* triples stamped on verify loop
      12. tool_call: decide(action="emit", reason=<smoke ok>)
          → rule sandbox-bootstrap/04-verify-to-reviewer fires
          → spawn reviewer-bootstrap

    Loop D — reviewer-bootstrap (rule 04 spawn, approves)
      13. tool_call: read_loop_result on verify loop
      14. tool_call: bash (docker inspect — placeholder returns
          state=running, readiness-probe stdout — defense-in-depth)
      15. tool_call: emit_bootstrap_committed(signature, container,
          image, workspace, plan_hash)
          → sandbox.tenant.* triples stamped on reviewer loop
          → registry transitions to ready_running
      16. tool_call: decide(action="approved", reason=<tenant ready>)
          → rule sandbox-bootstrap/07-reviewer-approved-to-coordinator
            fires (with chained allowlist
            [respond_direct, ask_user, autoresearch, research])
          → spawn wake-up coordinator

    Loop E — coordinator (wake-up, rule 07 spawn)
      17. tool_call: read_loop_result on reviewer loop
      18. tool_call: decide(action="respond_direct",
          reason=<user-facing prose: tenant ready, will reuse on
          future invocations>)
          → rule coordinator/03b-respond-direct fires
          → publishes prose on user.response.<wakeup_coord_id>
          → terminal. No further loops.

  Six loops total, eighteen mock-LLM round-trips. Mock-llm is
  sequence-based and role-blind — the order below is the exact
  order of requests across all six loops.

  Same read_loop_result placeholder caveat as research-mvp.yaml:
  arguments_json passes verbatim, the placeholder loop_id will not
  resolve, the tool returns an error, the next canned turn handles
  it. The structural assertion (rule chain + wake-up coordinator
  → respond_direct publish) is unaffected.

  Bash placeholder caveat: the execute / verify / reviewer
  bash calls run inside the always-warm sandbox container, which
  is a real container. The commands themselves (docker run /
  docker exec / docker inspect) WILL be invoked but the host
  Docker socket may not be mounted in the e2e stack — in that case
  the bash returns non-zero. The structural assertion remains
  unaffected because the mock-llm fixture's NEXT canned response
  is the tool the persona would call AFTER bash anyway.

  Pre-computed signature for this journey's canonical inputs:

    Command:   "task test:integration"
    RepoURL:   "https://github.com/c360studio/semteams"
    RepoRef:   "main"
    Toolchain: {"go": "1.26.0"}
    BaseImage: "ubuntu:24.04"

    Hash: 52a0a6824485d348706bc264b326723b87f1b8966013dd0587a2d56316b08078
    Container: semteams-tenant-52a0a6824485
    Entity ID: c360.semteams-bootstrap-e2e.sandbox.tenant.execution.<hash>

  The reviewer's emit_bootstrap_committed call passes the same
  signature so the registry's ready_running state lands on the
  matching entity ID. Plan_hash is computed server-side by
  emit_bootstrap_plan from the recipe; the reviewer's persona
  reads it back via read_loop_result in real-LLM flows. For the
  mock fixture we hardcode a placeholder (the tool stamps it
  verbatim).

  Paired spec: ui/e2e/agentic/sandbox-bootstrap-mvp.spec.ts.
  Compose profile: none beyond the agentic-e2e baseline.
  Config: configs/e2e-flow-bootstrap.json.

responses:
  # ---------- Loop 0: coordinator (dispatch) ----------

  - tool_call:
      name: decide
      arguments_json: |
        {
          "action": "bootstrap_sandbox",
          "reason": "The user asked to set up a tenant for `task test:integration` on the semteams repo at main, with Go 1.26 and Docker socket access. This is a sandbox-bootstrap ask — route to the bootstrap pack so it can canonicalize, check the registry, and provision the tenant."
        }

  # ---------- Loop A: provisioner-bootstrap-plan (rule 01 spawn) ----------

  - tool_call:
      name: read_loop_result
      arguments_json: |
        {
          "loop_id": "coord-loop-0"
        }

  - tool_call:
      name: query_sandbox_tenant
      arguments_json: |
        {
          "command": "task test:integration",
          "repo_url": "https://github.com/c360studio/semteams",
          "repo_ref": "main",
          "toolchain": {"go": "1.26.0"},
          "base_image": "ubuntu:24.04"
        }

  - tool_call:
      name: emit_bootstrap_plan
      arguments_json: |
        {
          "command": "task test:integration",
          "repo_url": "https://github.com/c360studio/semteams",
          "repo_ref": "main",
          "toolchain": {"go": "1.26.0"},
          "base_image": "ubuntu:24.04",
          "clone_command": "git clone https://github.com/c360studio/semteams /workspace",
          "install_steps": [
            "apt-get update",
            "apt-get install -y curl ca-certificates git",
            "curl -fsSL https://go.dev/dl/go1.26.0.linux-amd64.tar.gz -o /tmp/go.tgz",
            "tar -C /usr/local -xzf /tmp/go.tgz",
            "cd /workspace && go mod download"
          ],
          "volume_mounts": [
            "semteams-tenant-52a0a6824485-workspace:/workspace",
            "semteams-tenant-52a0a6824485-deps:/root/.cache"
          ],
          "docker_socket_mount": true,
          "verify_command": "cd /workspace && go test ./internal/quickcheck/... -count=1",
          "expected_smoke_signature": "exit 0; stdout contains PASS",
          "plan_action": "provision",
          "plan_revision": 1,
          "workspace": "/workspace"
        }

  - tool_call:
      name: decide
      arguments_json: |
        {
          "action": "execute",
          "reason": "Registry miss; planning a full provision. Base ubuntu:24.04 + apt deps + Go 1.26 toolchain + clone semteams@main + go mod download. Docker socket mounted (testcontainers may surface). Verify command: go test ./internal/quickcheck. Forwarding to execute."
        }

  # ---------- Loop B: provisioner-bootstrap-execute (rule 02b spawn) ----------

  - tool_call:
      name: read_loop_result
      arguments_json: |
        {
          "loop_id": "plan-loop-A"
        }

  - tool_call:
      name: bash
      arguments_json: |
        {
          "command": "echo '[mock] docker run -d --name semteams-tenant-52a0a6824485 -v semteams-tenant-52a0a6824485-workspace:/workspace -v /var/run/docker.sock:/var/run/docker.sock ubuntu:24.04 sleep infinity && echo provisioned'"
        }

  - tool_call:
      name: decide
      arguments_json: |
        {
          "action": "verify",
          "reason": "Tenant container semteams-tenant-52a0a6824485 provisioned: docker run + apt + Go toolchain + clone + go mod download completed. Forwarding to verify."
        }

  # ---------- Loop C: provisioner-bootstrap-verify (rule 03 spawn) ----------

  - tool_call:
      name: read_loop_result
      arguments_json: |
        {
          "loop_id": "execute-loop-B"
        }

  - tool_call:
      name: bash
      arguments_json: |
        {
          "command": "echo '[mock] docker exec semteams-tenant-52a0a6824485 sh -c \"cd /workspace && go test ./internal/quickcheck/... -count=1\" && echo PASS'"
        }

  - tool_call:
      name: emit_bootstrap_verify
      arguments_json: |
        {
          "container_name": "semteams-tenant-52a0a6824485",
          "workspace_path": "/workspace",
          "smoke_exit_code": 0,
          "smoke_stdout_tail": "PASS",
          "smoke_matches_expected": true,
          "verify_outcome": "ok"
        }

  - tool_call:
      name: decide
      arguments_json: |
        {
          "action": "emit",
          "reason": "Smoke verified: docker exec returned exit 0 with PASS matching expected_smoke_signature. Container semteams-tenant-52a0a6824485 ready."
        }

  # ---------- Loop D: reviewer-bootstrap (rule 04 spawn, approves) ----------

  - tool_call:
      name: read_loop_result
      arguments_json: |
        {
          "loop_id": "verify-loop-C"
        }

  - tool_call:
      name: bash
      arguments_json: |
        {
          "command": "echo '[mock] docker inspect -f {{.State.Status}} semteams-tenant-52a0a6824485 && docker exec semteams-tenant-52a0a6824485 echo readiness-probe && echo running'"
        }

  - tool_call:
      name: emit_bootstrap_committed
      arguments_json: |
        {
          "signature": "52a0a6824485d348706bc264b326723b87f1b8966013dd0587a2d56316b08078",
          "container_name": "semteams-tenant-52a0a6824485",
          "image": "ubuntu:24.04",
          "workspace": "/workspace",
          "plan_hash": "mock-plan-hash-placeholder"
        }

  - tool_call:
      name: decide
      arguments_json: |
        {
          "action": "approved",
          "reason": "Tenant semteams-tenant-52a0a6824485 verified ready: docker inspect=running + readiness-probe echo passed + verify smoke matched. Registry committed to ready_running. Signature 52a0a6824485 will reuse on future invocations against this target."
        }

  # ---------- Loop E: coordinator (wake-up, rule 07 spawn) ----------

  - tool_call:
      name: read_loop_result
      arguments_json: |
        {
          "loop_id": "reviewer-loop-D"
        }

  - tool_call:
      name: decide
      arguments_json: |
        {
          "action": "respond_direct",
          "reason": "Sandbox tenant for `task test:integration` on semteams@main with Go 1.26 is ready. Container: semteams-tenant-52a0a6824485. Signature: 52a0a6824485d348706bc264b326723b87f1b8966013dd0587a2d56316b08078. Future runs against the same target will reuse this tenant (near-instant skip path) until the plan recipe changes or the freshness TTL expires."
        }
