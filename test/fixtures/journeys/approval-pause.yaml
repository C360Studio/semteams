name: approval-pause
description: |
  Journey: ADR-053 Phase 4c PR-1 — an in-run loop calls a tool gated by
  agentic-tools.approval_required, the loop pauses (LoopStateAwaitingApproval),
  and the RUN it belongs to honestly pauses executing→awaiting_approval, end-to-end
  on mock-LLM against configs/e2e-flow-bootstrap.json. This is the run-phase
  reflection of the existing loop-level approval gate (ADR-030).

  Why the research scaffold (re-pointed from parked dev-via-test per #306): we need
  an IN-RUN loop — one carrying agent.run.entity-id — to call the gated tool. A
  front-door coordinator answering plain chat mints no run, so its gated tool call
  would be a benign no-op (the same run-anchor guard as front-door ask_user). So:

    1. Loop 0 front-door coordinator → decide(research) → rule research/01
       (01-coordinator-research-spawn.json, run_scope=new) spawns
       researcher-research-plan + the handoff marker → run becomes `executing`.
    2. Loop A researcher-research-plan → decide(needs_clarification) → rule
       research/06 (06-needs-clarification-replan.json) spawns the recovery
       coordinator that INHERITS the run anchor (agent.run.entity-id).
    3. Loop R recovery coordinator → tool_call(bash). bash is advertised on
       research/06's publish_agent tools list (["read_loop_result", "bash",
       "decide"]) and added to agentic-tools.approval_required in the derived
       e2e-flow-bootstrap-approval-4c.gen.json (#420), so it passes tool
       admission and the upstream ApprovalFilter parks the loop in
       LoopStateAwaitingApproval, emitting agent.approval_pending.<loopID>.
    4. The product-shell approvalpause subscriber reads loop R's run anchor
       (agent.run.entity-id) and stamps agent.run.approval-pending +
       agent.run.approval-outstanding=1 on the run entity.
    5. agent-run/12 (approval-outstanding > 0 + phase==executing) transitions the
       run executing→awaiting_approval.

  The run is honestly PAUSED on a human approval. PR-1 has no resume yet — the run
  parks in awaiting_approval (strictly more honest than executing-forever-on-gated-
  tool). Resume (awaiting_approval→executing) is PR-2.

  DISAMBIGUATION (4c vs 4b-2): both pauses land in awaiting_approval. The spec
  asserts the run carries agent.run.approval-pending (the 4c marker) and does NOT
  carry agent.run.clarification-pending (the 4b-2 marker) — proving rule 12 drove
  the pause, not rule 09. Also asserts last_transition_from==executing.

  This is an EXECUTING-phase pause, NOT a terminal — the run reaches
  awaiting_approval and does NOT complete or fail (the gated tool never executed; no
  reviewer approved). Mock serves responses in GLOBAL ORDER. No sandbox requested
  (the chain pauses before any gather/synthesize). Paired spec:
  ui/e2e/agentic/approval-pause.spec.ts. Config:
  configs/e2e-flow-bootstrap-approval-4c.gen.json (derived from
  e2e-flow-bootstrap.json with approval_required:[create_rule, bash], agent-run/12,
  and the agent.approval_pending output port on teams-loop).

responses:
  # ---------- Loop 0: front-door coordinator → research ----------
  - tool_call:
      name: decide
      arguments_json: |
        {
          "action": "research",
          "reason": "Research MAVLink v2 HEARTBEAT frame staleness thresholds over UDP and summarize alerting defaults. (4c pause journey: researcher-research-plan escalates needs_clarification, then the recovery coordinator calls a gated tool to exercise executing→awaiting_approval via the approval_required tool-gate.)"
        }

  # ---------- Loop A: researcher-research-plan → needs_clarification ----------
  # research/01 allowlist = [gather, emit, needs_clarification]; planner escalates on turn 1.
  # research/06 spawns the INHERIT recovery coordinator (carries agent.run.entity-id).
  - tool_call:
      name: decide
      arguments_json: |
        {
          "action": "needs_clarification",
          "reason": "The ask does not specify the UDP listen address/port or the MAVLink dialect to decode — I need the user to clarify before a faithful plan is possible."
        }

  # ---------- Loop R: recovery coordinator → bash (GATED → PAUSES) ----------
  # bash is advertised on research/06 and gated in agentic-tools.approval_required
  # via e2e-flow-bootstrap-approval-4c.gen.json (#420), so the ApprovalFilter rejects
  # it (approval_required: prefix) and the loop parks in awaiting_approval, emitting
  # agent.approval_pending.<loopID>. The approvalpause subscriber stamps
  # agent.run.approval-pending on the run entity → agent-run/12 transitions
  # executing→awaiting_approval. No further response is consumed — the loop is paused
  # (PR-1 has no resume).
  - tool_call:
      name: bash
      arguments_json: |
        {
          "command": "echo heartbeat-stale-check"
        }
