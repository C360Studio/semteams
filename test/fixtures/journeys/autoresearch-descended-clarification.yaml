name: autoresearch-descended-clarification
description: Mock-only descended clarification qualification. A valid baseline starts one propose
  loop, which terminates with needs_clarification before any execute loop. The original coordinator
  receives a typed question on its original route and the existing run waits for the user. This does
  not qualify continuation or rich evidence-body rendering.
responses_by_role:
  - match: You are the SemTeams coordinator
    responses:
      - tool_call:
          name: query_sandbox_attestation
          arguments_json: |
            {}
      - tool_call:
          name: request_sandbox
          arguments_json: >
            {
              "profile": "go-backend",
              "reason": "Optimizing a Go test command's wallclock needs a prepared environment to run the measurement repeatedly."
            }
      - tool_call:
          name: decide
          arguments_json: >
            {
              "action": "autoresearch",
              "reason": "Optimize the wallclock of `go test ./...`. Command: go test ./...; surface: ./...; cap: 2 iterations; metric: real seconds parsed from the test output. Lower is better."
            }
      - tool_call:
          name: decide
          arguments_json: '{"action":"ask_user","reason":"Which additional test directories may the optimizer
            change? The current bounded surface cannot support a useful next experiment."}'
  - match: "**BASELINE phase**"
    responses:
      - tool_call:
          name: emit_autoresearch_baseline
          arguments_json: |
            {
              "command": "go test ./...",
              "surface": "./...",
              "cap": 2,
              "metric_parser": "real seconds from the go test summary line",
              "baseline_value": 1.20,
              "baseline_pass": true,
              "baseline_stdout_tail": "ok  example  1.20s"
            }
      - tool_call:
          name: decide
          arguments_json: >
            {
              "action": "propose",
              "reason": "Baseline captured at 1.20s. Beginning the iteration loop (cap 2) — propose single-axis changes and keep the ones that lower the wallclock."
            }
  - match: "**PROPOSE phase**"
    responses:
      - tool_call:
          name: decide
          arguments_json: '{"action":"needs_clarification","reason":"The bounded surface is too narrow; ask
            the user which additional test directories may change."}'
  - match: operations analyst
    responses:
      - tool_call:
          name: decide
          arguments_json: >
            {
              "action": "observed",
              "reason": "Read the run entity and the coordinator loop result. Run reached its terminal phase with no operator-actionable pattern; emitting no findings."
            }
