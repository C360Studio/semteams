            }
      - tool_call:
          name: decide
          arguments_json: >
            {
              "action": "emit",
              "reason": "Program Pulse artifact rev 1 emitted for C360 Platform (semteams + semengine) with primary github_read citations, explicit recommendations, and open_gaps disclosure."
            }
  - match: Reviewer — RESEARCH phase
    responses:
      - tool_call:
          name: decide
          arguments_json: >
            {
              "action": "approved",
              "reason": "Program Pulse artifact verified: both configured portfolio projects (SemTeams, SemEngine) carry primary github_read citations, cross-project durability dependency is documented, recommendations are clearly labeled in tasks, and the missing SemEngine release surface is disclosed in open_gaps."
            }
  - match: operations analyst
    responses:
      - tool_call:
          name: decide
          arguments_json: >
            {
              "action": "observed",
              "reason": "Read the run entity and coordinator loop result. Program Pulse run completed cleanly with verified github_read citations; emitting no findings."
            }
