                      "locator": "github://C360Studio/semengine/commits/a1b2c3d4",
                      "origin_id": "github://c360studio/semengine/commits/a1b2c3d4",
                      "retrieved_at": "2026-10-17T08:00:00Z",
                      "source_class": "primary",
                      "quote": "docs(adr): align substrate durability boundary with SemTeams ADR-061",
                      "tool_result_ref": "call_gather_gh_c360",
