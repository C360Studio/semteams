              ],
              "addressed_gaps": [
                "Program Pulse covers both configured projects (semteams and semengine) with primary GitHub citations and explicit gap disclosure"
              ],
              "open_gaps": [
                "No published GitHub releases found for configured repository C360Studio/semengine (releases surface returned 0 records)",
