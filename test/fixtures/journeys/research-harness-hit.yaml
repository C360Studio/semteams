name: research-harness-hit
description: |
  Journey: R3.7.1.e of ADR-033. User asks the researcher to identify
  actor types in a Meshtastic-backed OSH driver. The researcher emits
  the artifact with `harness: "stub"` (catalog hit — the deployment's
  configs/harnesses-stub.json registers a `stub` entry, swapped in via
  SEMTEAMS_HARNESS_CATALOG_PATH). The reviewer approves on first try.

  Paired spec: ui/e2e/agentic/research-harness-hit.spec.ts.

  This fixture verifies the full harness wire:
    - boot-time harness manager loads configs/harnesses-stub.json
    - persona-fragment auto-render injects "stub" into the researcher
      prompt under fragment ID harness-catalog.rendered
    - emit_research_artifact accepts harness="stub" via tool args
    - the typed payload published on research.artifact.{loop_id}
      carries the harness field
    - the marker triple research.artifact.harness=stub is emitted
    - the chain runs end-to-end without hanging

  Catalog-miss path (test_harness omitted, needs_test_harness in open_gaps) is
  structurally a strict subset of this fixture and is exercised by
  the existing research-iterative journey, which emits artifacts
  without a harness field.

  Sequence (matches the fixture, two loops):

    Loop 1 — researcher (single pass)
      1. tool_call: query_entity (stand-in for indexed-corpus query)
      2. tool_call: emit_research_artifact (with harness="stub")
      3. completion: artifact JSON
         → loop terminates outcome=success → rule 01 fires.

    Loop 2 — research-reviewer (single pass)
      4. tool_call: read_loop_result (placeholder; tool errors —
         same limitation as research-iterative.yaml)
      5. tool_call: decide(action=approved)
         → loop terminates; no rule fires; e2e is green.

responses:
  - tool_call:
      name: query_entity
      arguments_json: |
        {
          "id": "osh.driver.framework"
        }

  - tool_call:
      name: emit_research_artifact
      arguments_json: |
        {
          "revision": 1,
          "title": "OSH Meshtastic driver research (harness-hit smoke)",
          "actors": [
            {"name": "OSH driver framework", "role": "Implements the IDriver interface; pluggable component that adapts a sensor protocol to OSH's data model"},
            {"name": "OGC Connected Systems endpoints", "role": "REST/SSE endpoints exposing observations, system descriptions, and control streams"},
            {"name": "Meshtastic radio", "role": "LoRa-based mesh radio with channel-scoped packets; sensors publish observations as MeshPacket payloads on a configured channel"}
          ],
          "integration_points": [
            {"from": "OSH driver framework", "to": "OGC Connected Systems endpoints", "data": "observations, system descriptions", "direction": "write"},
            {"from": "Meshtastic radio", "to": "OSH driver framework", "data": "MeshPacket payloads carrying sensor observations", "direction": "read"}
          ],
          "tasks": [
            "Implement OSH IDriver interface backed by a Meshtastic MQTT/serial bridge so MeshPacket observations surface as OGC CS observation events"
          ],
          "addressed_gaps": [],
          "open_gaps": [],
          "test_harness": "stub"
        }

  - completion:
      content: |
        Research pass on the OSH-driver-framework actors with
        Meshtastic backing. Three actors enumerated (OSH driver,
        OGC CS endpoints, Meshtastic radio), two integration
        points named with direction, one decomposable seed
        requirement. Selected harness "stub" from the registered
        catalog as the verification target.

        ```json
        {
          "actors": [
            {"name": "OSH driver framework", "role": "Implements the IDriver interface; pluggable component that adapts a sensor protocol to OSH's data model"},
            {"name": "OGC Connected Systems endpoints", "role": "REST/SSE endpoints exposing observations, system descriptions, and control streams"},
            {"name": "Meshtastic radio", "role": "LoRa-based mesh radio with channel-scoped packets; sensors publish observations as MeshPacket payloads on a configured channel"}
          ],
          "integration_points": [
            {"from": "OSH driver framework", "to": "OGC Connected Systems endpoints", "data": "observations, system descriptions", "direction": "write"},
            {"from": "Meshtastic radio", "to": "OSH driver framework", "data": "MeshPacket payloads carrying sensor observations", "direction": "read"}
          ],
          "tasks": [
            "Implement OSH IDriver interface backed by a Meshtastic MQTT/serial bridge so MeshPacket observations surface as OGC CS observation events"
          ],
          "addressed_gaps": [],
          "open_gaps": [],
          "test_harness": "stub"
        }
        ```

  - tool_call:
      name: read_loop_result
      arguments_json: |
        {
          "loop_id": "researcher-loop-placeholder"
        }

  - tool_call:
      name: decide
      arguments_json: |
        {
          "action": "approved",
          "reason": "Checklist met: three actors named with role text; two integration points with direction (write to OGC CS, read from Meshtastic). Harness selection verified — \"stub\" appears in this deployment's registered harness catalog. Approving."
        }
