name: research-mode-transition
description: |
  Journey: ADR-040 reshape of R3.2.2 (formerly R2.5+R3.2.2 chained
  research+source-acquisition). Validates the new source-curator role
  end-to-end on mock-LLM:

    research → reviewer rejects (corpus gap)
            → source-curator (add+wait+verify+emit_curator_artifact+decide indexed)
            → researcher re-queries augmented corpus (recovery=curator_indexed)
            → reviewer approves (no stabilisation gate needed — researcher
              never mutated substrate, the curator did)
            → dev-via-spec-planner stub (mode-transition rule 03 fires)

  Six loops total — one fewer than the pre-ADR-040 count (which had
  2× researcher-with-source-acquisition for substrate-mod + settling
  passes). The curator owns substrate-mutation as a single dedicated
  loop; the post-curator researcher is a pure re-query pass that does
  not mutate, so the reviewer's stabilisation gate doesn't fire.

  Paired spec: ui/e2e/agentic/research-mode-transition.spec.ts.
  Required compose profile: semsource (the SemSource container is
  required for the curator's substrate-modifying add_source_repo call).

  Sequence (matches the fixture, six loops, eighteen LLM round-trips):

    Loop A — researcher (initial pass, revision=1, default_role)
      1. tool_call: query_entity (corpus probe, returns nothing useful)
      2. tool_call: emit_research_artifact (revision=1, empty actors/
         integration_points, open_gaps names the corpus gap)
      3. completion: same artifact JSON for the reviewer to read.
         → outcome=success → rule_01a fires → spawn reviewer.

    Loop B — research-reviewer (pass 1, decides corpus gap)
      4. tool_call: read_loop_result (placeholder; tool errors,
         consumed by next canned turn)
      5. tool_call: decide(insufficient, reason includes "recommend
         add_source_repo for osh-core")
         → coordinator.next_action=insufficient → rule_02 fires →
         spawn source-curator.

    Loop C — source-curator (substrate-mutating pass)
      6. tool_call: read_loop_result (placeholder; consumes reviewer
         reason classification)
      7. tool_call: add_source_repo(url=osh-core, namespace=research)
         → agentic-tools approval filter: approval_required.
         Test approves via /teams-dispatch/loops/{id}/approval. Loop
         re-dispatches with ApprovedBy; SemSource handles AddRequest,
         replies success.
      8. tool_call: query_entity (verifies indexing finished by
         resolving an entity SemSource just exposed)
      9. tool_call: emit_curator_artifact (added_sources + verified_
         entity_ids; source_dirs OMITTED per ADR-040 §"Field rules" —
         this deployment doesn't wire the SemSource shared mount)
     10. tool_call: decide(action="indexed", reason="...")
         → coordinator.next_action=indexed → rule_02b fires → spawn
         researcher (with curator_loop_id in properties).

    Loop D — researcher (recovery=curator_indexed, re-query pass)
     11. tool_call: read_loop_result (placeholder; consumes curator
         artifact)
     12. tool_call: query_entity (against the augmented corpus; finds
         OSH driver framework + Meshtastic radio actors via the
         curator's verified_entity_ids)
     13. tool_call: emit_research_artifact (revision=2, full actors/
         integration_points/tasks; addressed_gaps cites the curator's
         add; substrate_mutations stays empty — researcher does NOT
         mutate substrate under ADR-040)
     14. completion: artifact JSON for the reviewer.
         → outcome=success → rule_01a fires → spawn reviewer.

    Loop E — research-reviewer (pass 2, approves on the re-queried
              artifact — no stabilisation gate needed since the
              researcher made no substrate mutations)
     15. tool_call: read_loop_result (placeholder; tool errors)
     16. tool_call: decide(approved)
         → coordinator.next_action=approved → rule_03 fires → spawn
         dev-via-spec-planner.

    Loop F — dev-via-spec-planner (R3.3 stub)
     17. tool_call: read_loop_result (placeholder; tool errors)
     18. completion: ack message confirming the artifact handoff.
         → terminal. No rule fires.

  Mock-llm is sequence-based and role-blind. The fixture aligns to
  the exact order of LLM round-trips across all six loops. Same
  read_loop_result placeholder caveat as before: arguments_json passes
  verbatim, the placeholder loop_id will not resolve, the tool
  returns an error, the next canned turn handles it. The structural
  assertion (rule chain + approval round-trip + persona-swap) is
  unaffected.

  Why six loops and not seven (the pre-ADR-040 count): under ADR-040
  the curator owns substrate-mutation as a dedicated role, so the
  researcher never mutates substrate during its passes. The
  reviewer's stabilisation gate ("if substrate mutated this revision,
  awaiting stabilisation") therefore doesn't fire on the post-curator
  researcher's artifact, eliminating the settling-pass loop the OLD
  flow needed.

responses:
  # ---------- Loop A: researcher (initial pass, revision=1) ----------

  - tool_call:
      name: query_entity
      arguments_json: |
        {
          "entity_id": "osh.driver.framework"
        }

  - tool_call:
      name: emit_research_artifact
      arguments_json: |
        {
          "revision": 1,
          "test_harness": "meshtasticd-2.x",
          "title": "OSH Meshtastic driver research",
          "actors": [],
          "integration_points": [],
          "tasks": [],
          "addressed_gaps": [],
          "open_gaps": [
            "OSH driver framework documentation not indexed — query_entity for osh.driver.framework returned nothing. Recommend add_source_repo for the osh-core repository."
          ],
          "substrate_mutations": []
        }

  - completion:
      content: |
        Initial research pass on OSH driver framework actors. The
        corpus does not appear to contain OSH driver framework
        documentation — `query_entity` found no match for
        `osh.driver.framework`. Submitting an empty artifact with
        the corpus gap explicitly named so the reviewer can decide
        whether to extend the corpus.

        ```json
        {
          "revision": 1,
          "actors": [],
          "integration_points": [],
          "tasks": [],
          "addressed_gaps": [],
          "open_gaps": [
            "OSH driver framework documentation not indexed — query_entity for osh.driver.framework returned nothing. Recommend add_source_repo for the osh-core repository."
          ],
          "substrate_mutations": []
        }
        ```

  # ---------- Loop B: research-reviewer (pass 1) ----------

  - tool_call:
      name: read_loop_result
      arguments_json: |
        {
          "loop_id": "researcher-loop-A"
        }

  - tool_call:
      name: decide
      arguments_json: |
        {
          "action": "insufficient",
          "reason": "Corpus gap: OSH driver framework documentation is not indexed. Recommend add_source_repo for https://github.com/sensorhub-tools/osh-core in namespace research. The source-curator should register this source before the next researcher pass."
        }

  # ---------- Loop C: source-curator (substrate-mutating pass) ----------

  - tool_call:
      name: read_loop_result
      arguments_json: |
        {
          "loop_id": "reviewer-loop-B"
        }

  - tool_call:
      name: add_source_repo
      arguments_json: |
        {
          "url": "https://github.com/sensorhub-tools/osh-core",
          "namespace": "research",
          "branch": "main"
        }

  - tool_call:
      name: query_entity
      arguments_json: |
        {
          "entity_id": "osh.core.api.module.IModule"
        }

  # source_dirs OMITTED — no SemSource shared mount in this deployment.
  # Per ADR-040 §"Field rules" "omit when unsure" rule, the curator
  # only includes source_dirs when it can verify the mount path is
  # accessible. The curator.artifact.source_dirs_count triple lands
  # as "0" (verified end-to-end in mock-LLM).
  - tool_call:
      name: emit_curator_artifact
      arguments_json: |
        {
          "added_sources": [
            {
              "url": "https://github.com/sensorhub-tools/osh-core",
              "namespace": "research",
              "covers": "OSH IDriver / IModule / IPersistentDriver interfaces, BaseSensorModule, OGC CS endpoint helpers"
            }
          ],
          "verified_entity_ids": [
            "osh.core.api.module.IModule",
            "osh.core.api.module.IModuleProvider",
            "osh.core.api.sensor.IDriver",
            "osh.core.impl.module.BaseSensorModule"
          ]
        }

  - tool_call:
      name: decide
      arguments_json: |
        {
          "action": "indexed",
          "reason": "Added osh-core for OSH driver/module entities; 4 IDs verified to resolve via query_entity post-indexing. The next researcher loop can build on these without re-validating."
        }

  # ---------- Loop D: researcher (recovery=curator_indexed, re-query) ----------

  - tool_call:
      name: read_loop_result
      arguments_json: |
        {
          "loop_id": "curator-loop-C"
        }

  - tool_call:
      name: query_entity
      arguments_json: |
        {
          "entity_id": "osh.core.api.module.IModule"
        }

  - tool_call:
      name: emit_research_artifact
      arguments_json: |
        {
          "revision": 2,
          "test_harness": "meshtasticd-2.x",
          "title": "OSH Meshtastic driver research",
          "actors": [
            {"name": "OSH driver framework", "role": "Hosts the IDriver interface drivers must implement to expose sensor observations"},
            {"name": "OGC CS endpoints", "role": "Standard endpoints for observations, system descriptions, and control streams that the driver exposes"},
            {"name": "Meshtastic radio", "role": "LoRa mesh radio interface that emits packetised telemetry the driver consumes"}
          ],
          "integration_points": [
            {"from": "OSH driver", "to": "OGC CS endpoints", "data": "observation messages and system descriptions", "direction": "write"},
            {"from": "Meshtastic radio", "to": "OSH driver", "data": "packetised radio telemetry", "direction": "read"}
          ],
          "tasks": [
            "Implement OSH `IDriver` interface backed by Meshtastic radio events, exposing OGC CS observation endpoints"
          ],
          "addressed_gaps": [
            "Corpus gap closed by curator's add_source_repo for https://github.com/sensorhub-tools/osh-core; queried curator's verified_entity_ids (IModule, IDriver, BaseSensorModule) and enumerated actors from the resolved entities."
          ],
          "open_gaps": [],
          "substrate_mutations": []
        }

  - completion:
      content: |
        Re-queried the curator-augmented corpus and enumerated three
        actors (OSH driver framework, OGC CS endpoints, Meshtastic
        radio) and two integration points. Built directly on the
        curator's verified_entity_ids — no re-validation needed.
        Substrate untouched this pass; the curator owns mutation
        under ADR-040.

        ```json
        {
          "revision": 2,
          "actors": [
            {"name": "OSH driver framework", "role": "Hosts the IDriver interface drivers must implement to expose sensor observations"},
            {"name": "OGC CS endpoints", "role": "Standard endpoints for observations, system descriptions, and control streams that the driver exposes"},
            {"name": "Meshtastic radio", "role": "LoRa mesh radio interface that emits packetised telemetry the driver consumes"}
          ],
          "integration_points": [
            {"from": "OSH driver", "to": "OGC CS endpoints", "data": "observation messages and system descriptions", "direction": "write"},
            {"from": "Meshtastic radio", "to": "OSH driver", "data": "packetised radio telemetry", "direction": "read"}
          ],
          "tasks": [
            "Implement OSH `IDriver` interface backed by Meshtastic radio events, exposing OGC CS observation endpoints"
          ],
          "addressed_gaps": [
            "Corpus gap closed by curator's add_source_repo for https://github.com/sensorhub-tools/osh-core; queried curator's verified_entity_ids (IModule, IDriver, BaseSensorModule) and enumerated actors from the resolved entities."
          ],
          "open_gaps": [],
          "substrate_mutations": []
        }
        ```

  # ---------- Loop E: research-reviewer (pass 2 — approves on re-queried artifact) ----------

  - tool_call:
      name: read_loop_result
      arguments_json: |
        {
          "loop_id": "researcher-loop-D"
        }

  - tool_call:
      name: decide
      arguments_json: |
        {
          "action": "approved",
          "reason": "Checklist satisfied: three actors with role text, two integration points with direction, one decomposable seed requirement. Substrate untouched this revision (researcher does not mutate under ADR-040; the curator's add was logged at revision 1's reviewer terminal as a recommendation, executed in Loop C). No stabilisation gate to apply — the post-curator researcher pass is a pure re-query."
        }

  # ---------- Loop F: dev-via-spec-planner (R3.3 stub) ----------

  - tool_call:
      name: read_loop_result
      arguments_json: |
        {
          "loop_id": "reviewer-loop-E"
        }

  - completion:
      content: |
        Stabilised research artifact received from reviewer loop
        reviewer-loop-E. ADR-040 mode-transition smoke check
        complete. Full dev-via-spec planning contract lands in R3.3.
