name: dev-via-spec-qa
description: |
  Journey: ADR-041 §"Phasing Phase 3" rewrite of the dev-via-spec
  needs_clarification recovery arc for the MVP role compression.
  Extends dev-via-spec.yaml with a complete ADR-039 Phase 1 Shape A
  supersession cycle: the reviewer-qa terminates with
  decide(needs_clarification), rule 03 spawns a fresh researcher-plan,
  and the full plan → gather → synthesize → architect → reviewer-spec
  → builder → reviewer-qa chain re-runs with the qa-reviewer's gap
  addressed. Recovery reviewer-qa accepts; chain settles at 14 loops.

  Chain (ADR-041 §"Allowed transitions" + ADR-039 Phase 1 Shape A):

    Baseline (Loops A–G): plan → gather → synthesize → architect →
    reviewer-spec → builder → reviewer-qa
      Same shape as dev-via-spec.yaml, except Loop G's reviewer-qa
      terminates with decide(needs_clarification) instead of accept.
      → rule 03-needs-clarification-to-researcher fires → spawn
        researcher-plan (recovery).

    Recovery (Loops H–N): plan → gather → synthesize → architect →
    reviewer-spec → builder → reviewer-qa
      Same six-role MVP chain re-runs against the qa-reviewer's
      flagged gap. The recovery architect emits the spec with the
      additional checks[] the original missed. Recovery reviewer-qa
      decides(accept) → terminal.

  Fourteen loops total — one fewer than the pre-ADR-041 fifteen-loop
  count (which had a separate source-curator + dev-via-spec-planner
  pair ahead of the architect). The compressed roster + an extra
  back-edge to plan trades the curator + planner triangle for a
  symmetric plan→architect chain that recovers in seven loops, not
  three. The longer recovery is the cost of admission for the
  cognitively-cheap MVP roster.

  Paired spec: ui/e2e/agentic/dev-via-spec-qa.spec.ts.
  Required compose profile: sandbox (the builder loop calls
  bootstrap_workspace + bash; both route through the sandbox container
  per ADR-032 §R3.6.2.a wiring).

  Sequence (fourteen loops, thirty-eight LLM round-trips):

    Loops A–F — identical to dev-via-spec.yaml (steps 1–17):
      A researcher-plan (emit_plan + decide(gather))
      B researcher-gather (query_entity + decide(synthesize))
      C researcher-synthesize (emit_research_artifact rev 1 +
        decide(architect))
      D researcher-architect (emit_dev_via_spec_artifact +
        decide(emit))
      E reviewer-spec (decide(approved) → spec_mode_gate proceed)
      F builder (bootstrap_workspace + bash + builder_decide
        (tests_passing) → qa_mode_gate proceed)

    Loop G — reviewer-qa (rule 04 spawn, needs_clarification verdict)
     18. tool_call: read_loop_result on Loop F (placeholder; errors)
     19. tool_call: decide(action="needs_clarification",
         reason="evidence summary is (no checks) — architect emitted
         no checks[] in rev 1 spec; cannot grade build quality
         without evidence rules",
         retry_hint="architect should re-emit with at least one check")
         → rule 03-needs-clarification-to-researcher fires → spawn
           researcher-plan (recovery).

    Loop H — researcher-plan (rule 03 spawn, recovery)
     20. tool_call: read_loop_result on Loop G (placeholder; errors)
     21. tool_call: decide(action="gather", reason=<recovery plan;
         carry-forward scope + flag evidence-rule gap for architect>)
         → phasevalidator: plan→gather allowed, gather count 1→2
         → rule_04 fires → spawn researcher-gather.

    Loop I — researcher-gather (recovery)
     22. tool_call: read_loop_result on Loop H (placeholder; errors)
     23. tool_call: query_entity (same OSH entities; corpus stable)
     24. tool_call: decide(action="synthesize", reason=<evidence
         carried forward + check candidate identified>)
         → phasevalidator: gather→synthesize allowed, synthesize count
           1→2 (at cap)
         → rule_05 fires → spawn researcher-synthesize.

    Loop J — researcher-synthesize (recovery)
     25. tool_call: read_loop_result on Loop I (placeholder; errors)
     26. tool_call: emit_research_artifact (rev 2, addresses qa-
         reviewer's flagged check requirement)
     27. tool_call: decide(action="architect", reason=<artifact rev 2
         ready for architect; check candidate scoped>)
         → phasevalidator: synthesize→architect allowed, architect
           count 1→2 (at cap)
         → rule_06 fires → spawn researcher-architect.

    Loop K — researcher-architect (recovery)
     28. tool_call: read_loop_result on Loop J (placeholder; errors)
     29. tool_call: emit_dev_via_spec_artifact (rev 2, with checks[]
         containing one evidence rule on the packet decoder)
     30. tool_call: decide(action="emit", reason=<recovery spec
         emitted with checks per qa-reviewer's blocking_question>)
         → phasevalidator: architect→emit allowed (no count
           increment)
         → rule_01b fires → spawn reviewer-spec.

    Loop L — reviewer-spec (recovery)
     31. tool_call: read_loop_result on Loop K (placeholder; errors)
     32. tool_call: decide(action="approved", reason=<recovery spec
         passes checklist + external-actor coverage; check binds to
         packet decoder>)
         → phasevalidator.SpecModeGate forwards
           dev_via_spec.artifact.{path,slug} from architect Loop K
           onto reviewer-spec Loop L, writes
           chain.spec_mode_gate.proceed
         → rule_02 fires → spawn builder.

    Loop M — builder (recovery)
     33. tool_call: bootstrap_workspace (recovery spec_path)
     34. tool_call: bash ls SPEC.md
     35. tool_call: bash echo "mvn test passing on recovery spec"
     36. tool_call: builder_decide(action="tests_passing",
         tests_run=1, tests_passed=1, tests_failed=0)
         → phasevalidator.QAModeGate writes
           chain.qa_mode_gate.proceed
         → rule_04 fires → spawn reviewer-qa.

    Loop N — reviewer-qa (recovery — terminal)
     37. tool_call: read_loop_result on Loop M (placeholder; errors)
     38. tool_call: decide(action="accept", reason=<recovery build
         accepted; check binds packet decoder; tests_passing aligns
         with evidence rule>)
         → terminal. No rule fires on action=accept; the ADR-039
           Phase 1 Shape A supersession cycle is complete (prior
           loops remain immutable; this loop's verdict is the chain's
           effective terminal).

  Mock-llm is sequence-based and role-blind. The fixture aligns to
  the exact order of LLM round-trips across all fourteen loops. Same
  read_loop_result / bootstrap_workspace / bash placeholder caveat:
  arguments_json passes verbatim, tools return errors, the next canned
  turn handles them. The structural assertion (full chain + recovery
  cycle + gate sentinels + final state) is unaffected.

  QA-reviewer-loop terminal choice (Loop G needs_clarification):
  matches ADR-041's reviewer-qa contract — the gate has already
  validated tests_run > 0 AND tests_failed = 0, so the LLM's job is
  to grade BUILD QUALITY. Empty checks[] in the rev 1 spec means
  there's nothing to grade against; needs_clarification routes the
  chain back to plan so the architect can re-emit with evidence
  rules. The mock-LLM does not actually read the prompt's evidence
  summary (sequence-based); the canned verdict aligns with the
  expected persona behaviour.

  Per-phase cap budget (ADR-041 §"Per-phase cap"):
  plan=1 (counter doesn't increment on dispatch or rule_03 entry —
  plan is fresh chain root or recovery), gather=3 (this fixture
  consumes 2 of 3), synthesize=2 (consumes 2 of 2 — at cap on the
  recovery pass), architect=2 (consumes 2 of 2 — at cap on the
  recovery pass). Any additional needs_clarification → researcher-
  plan loop after this fixture would land at the synthesize/
  architect cap and the chain would stall fail-safe.

responses:
  # ===================================================================
  # Loops A–F: identical to dev-via-spec.yaml baseline (Loops A–F)
  # ===================================================================

  # ---------- Loop A: researcher-plan (initial pass, dispatch) ----------

  - tool_call:
      name: emit_plan
      arguments_json: |
        {
          "revision": 1,
          "title": "OSH Meshtastic driver plan",
          "goal": "Implement the OSH IDriver interface backed by Meshtastic radio packets, exposing OGC CS observation endpoints.",
          "context": "Initial planning pass — the research arc has not yet enumerated the corpus actors. The driver sits at the boundary between Meshtastic packet ingestion (read) and OGC CS observation publishing (write).",
          "scope_in": [
            "OSH IDriver interface implementation",
            "Meshtastic packet decoder",
            "OGC CS observation publisher"
          ],
          "scope_out": [
            "Meshtastic firmware changes — upstream-owned",
            "OGC CS specification work — standards body owns; we conform"
          ],
          "epics": [
            "E1 — Meshtastic packet ingestion: read-side decoder normalising radio packets into the driver's internal observation envelope",
            "E2 — OGC CS observation publishing: write-side publisher exposing the IDriver interface",
            "E3 — Lifecycle and recovery: IDriver lifecycle hooks plus the radio-disconnect failure-mode handler"
          ]
        }

  - tool_call:
      name: decide
      arguments_json: |
        {
          "action": "gather",
          "reason": "Plan emitted: OSH Meshtastic driver plan rev 1. Goal: Implement the OSH IDriver interface backed by Meshtastic radio packets, exposing OGC CS observation endpoints. Three epics (Meshtastic packet ingestion / OGC CS observation publishing / lifecycle and recovery) decompose the work at interface granularity. The GATHER phase should enumerate the corpus actors — OSH driver framework, OGC CS endpoints, Meshtastic radio — and identify the integration boundaries."
        }

  # ---------- Loop B: researcher-gather (rule_04 spawn) ----------

  - tool_call:
      name: read_loop_result
      arguments_json: |
        {
          "loop_id": "plan-loop-A"
        }

  - tool_call:
      name: query_entity
      arguments_json: |
        {
          "entity_id": "osh.core.api.module.IModule"
        }

  - tool_call:
      name: decide
      arguments_json: |
        {
          "action": "synthesize",
          "reason": "GATHER enumerated three OSH driver entities: osh.core.api.module.IModule, osh.core.api.sensor.IDriver, osh.core.impl.module.BaseSensorModule. Three integration points emerge: Meshtastic radio → OSH driver, OSH driver → OGC CS endpoints, lifecycle/disconnect-recovery boundary."
        }

  # ---------- Loop C: researcher-synthesize (rule_05 spawn) ----------

  - tool_call:
      name: read_loop_result
      arguments_json: |
        {
          "loop_id": "gather-loop-B"
        }

  - tool_call:
      name: emit_research_artifact
      arguments_json: |
        {
          "revision": 1,
          "test_harness": "meshtasticd-2.x",
          "title": "OSH Meshtastic driver research",
          "actors": [
            {"name": "OSH driver framework", "role": "Hosts the IDriver interface drivers must implement to expose sensor observations"},
            {"name": "OGC CS endpoints", "role": "Standard endpoints for observations, system descriptions, and control streams that the driver exposes"},
            {"name": "Meshtastic radio", "role": "LoRa mesh radio interface that emits packetised telemetry the driver consumes"}
          ],
          "integration_points": [
            {"from": "OSH driver", "to": "OGC CS endpoints", "data": "observation messages and system descriptions", "direction": "write"},
            {"from": "Meshtastic radio", "to": "OSH driver", "data": "packetised radio telemetry", "direction": "read"}
          ],
          "tasks": [
            "Implement OSH `IDriver` interface backed by Meshtastic radio events, exposing OGC CS observation endpoints"
          ],
          "addressed_gaps": [],
          "open_gaps": [],
          "substrate_mutations": []
        }

  - tool_call:
      name: decide
      arguments_json: |
        {
          "action": "architect",
          "reason": "Artifact rev 1 emitted. Forwarding to ARCHITECT so the typed spec can be composed against the planner's E1/E2/E3 epics — read-side decoder, write-side publisher, lifecycle handler."
        }

  # ---------- Loop D: researcher-architect (rule_06 spawn) ----------

  - tool_call:
      name: read_loop_result
      arguments_json: |
        {
          "loop_id": "synthesize-loop-C"
        }

  - tool_call:
      name: emit_dev_via_spec_artifact
      arguments_json: |
        {
          "title": "OSH Meshtastic Driver",
          "goal": "Implement the OSH IDriver interface backed by Meshtastic radio packets, exposing OGC CS observation endpoints.",
          "context": "The research arc enumerated the OSH driver framework, OGC CS endpoints, and Meshtastic radio. The driver sits at the boundary between Meshtastic packet ingestion (read) and OGC CS observation publishing (write).",
          "actors": [
            {"name": "OSH driver framework", "role": "Hosts the IDriver interface drivers must implement to expose sensor observations"},
            {"name": "OGC CS endpoints", "role": "Standard endpoints for observations, system descriptions, and control streams that the driver exposes"},
            {"name": "Meshtastic radio", "role": "LoRa mesh radio interface that emits packetised telemetry the driver consumes"}
          ],
          "integration_points": [
            {"from": "Meshtastic radio", "to": "OSH driver framework", "direction": "read", "data": "packetised radio telemetry"},
            {"from": "OSH driver framework", "to": "OGC CS endpoints", "direction": "write", "data": "observation messages and system descriptions"}
          ],
          "tasks": [
            {
              "title": "Meshtastic packet decoder",
              "scope": "backend",
              "grounds_actors": ["Meshtastic radio", "OSH driver framework"],
              "grounds_integration_points": ["Meshtastic radio→OSH driver framework"]
            },
            {
              "title": "OGC CS observation publisher",
              "scope": "backend",
              "grounds_actors": ["OSH driver framework", "OGC CS endpoints"],
              "grounds_integration_points": ["OSH driver framework→OGC CS endpoints"]
            },
            {
              "title": "IDriver lifecycle and failure-mode handler",
              "scope": "backend",
              "grounds_actors": ["OSH driver framework", "Meshtastic radio"]
            }
          ],
          "provenance": {
            "research_artifact_loop": "synthesize-loop-C"
          }
        }

  - tool_call:
      name: decide
      arguments_json: |
        {
          "action": "emit",
          "reason": "Spec rev 1 emitted at docs/specs/<slug>.md. Three tasks grounded against three actors and two integration points. Reviewer-spec should grade against the completeness checklist."
        }

  # ---------- Loop E: reviewer-spec (rule_01b spawn) ----------

  - tool_call:
      name: read_loop_result
      arguments_json: |
        {
          "loop_id": "architect-loop-D"
        }

  - tool_call:
      name: decide
      arguments_json: |
        {
          "action": "approved",
          "reason": "Spec checklist satisfied: three actors with role text, two integration points with direction + data shape, three tasks grounded against actors + integration_points, all external actors covered. Approving so the builder can bootstrap a workspace."
        }

  # ---------- Loop F: builder (rule_02 spawn) ----------

  - tool_call:
      name: bootstrap_workspace
      arguments_json: |
        {
          "spec_path": "docs/specs/2026-05-13-osh-meshtastic-driver.md"
        }

  - tool_call:
      name: bash
      arguments_json: |
        {
          "command": "ls SPEC.md"
        }

  - tool_call:
      name: bash
      arguments_json: |
        {
          "command": "echo 'mvn test passing'"
        }

  - tool_call:
      name: builder_decide
      arguments_json: |
        {
          "action": "tests_passing",
          "reason": "Canned tests_passing for the recovery-cycle proof. Mock-LLM did not actually run tests; the builder_decide tool emits coordinator.next_action=tests_passing unconditionally given the args, which triggers rule_04 once phasevalidator.QAModeGate validates tests_run > 0 AND tests_failed = 0.",
          "tests_run": 3,
          "tests_passed": 3,
          "tests_failed": 0,
          "artifact_summary": "Canned summary — three notional unit tests passing for the rev 1 spec."
        }

  # ===================================================================
  # Loop G: reviewer-qa rejects rev 1 → ADR-039 Phase 1 recovery cycle
  # ===================================================================

  # ---------- Loop G: reviewer-qa (rule_04 spawn — needs_clarification) ----------

  - tool_call:
      name: read_loop_result
      arguments_json: |
        {
          "loop_id": "builder-loop-F"
        }

  - tool_call:
      name: decide
      arguments_json: |
        {
          "action": "needs_clarification",
          "reason": "Evidence summary is (no checks) — the architect emitted no checks[] in the rev 1 spec. Per the reviewer-qa evaluation contract, build quality cannot be graded without evidence rules to bind. This is a chain-coverage gap, not a builder failure; routing needs_clarification so the chain re-runs through architect with at least one check binding the packet decoder.",
          "retry_hint": "Architect must re-emit the spec with at least one check containing evidence rules. The mock-LLM journey: smoke #21 (Phase 4) on real LLM will exercise substantive evidence grading."
        }

  # ===================================================================
  # Recovery cycle: rule 03 spawn → researcher-plan → ... → reviewer-qa accept
  # ===================================================================

  # ---------- Loop H: researcher-plan RECOVERY (rule_03 spawn) ----------

  - tool_call:
      name: read_loop_result
      arguments_json: |
        {
          "loop_id": "qa-reviewer-loop-G"
        }

  - tool_call:
      name: decide
      arguments_json: |
        {
          "action": "gather",
          "reason": "Recovery plan: reviewer-qa rejected rev 1 with needs_clarification — the architect's spec carried no checks[] so build quality couldn't be graded. Carrying forward goal/scope/epics from rev 1 unchanged; tightening the GATHER pass to identify one candidate check (file_exists on the packet decoder test file) the SYNTHESIZE pass will record and the ARCHITECT phase will emit into checks[]."
        }

  # ---------- Loop I: researcher-gather RECOVERY ----------

  - tool_call:
      name: read_loop_result
      arguments_json: |
        {
          "loop_id": "plan-loop-H"
        }

  - tool_call:
      name: query_entity
      arguments_json: |
        {
          "entity_id": "osh.core.api.module.IModule"
        }

  - tool_call:
      name: decide
      arguments_json: |
        {
          "action": "synthesize",
          "reason": "GATHER recovery pass: corpus actors stable (same OSH driver entities resolved as rev 1); the new evidence is a check candidate — file_exists on src/test/java/com/example/decoder/PacketDecoderTest.java binds the packet decoder task to a verifiable post-build artifact. SYNTHESIZE can compose rev 2 with that check carried as an addressed_gap."
        }

  # ---------- Loop J: researcher-synthesize RECOVERY ----------

  - tool_call:
      name: read_loop_result
      arguments_json: |
        {
          "loop_id": "gather-loop-I"
        }

  - tool_call:
      name: emit_research_artifact
      arguments_json: |
        {
          "revision": 2,
          "test_harness": "meshtasticd-2.x",
          "title": "OSH Meshtastic driver research",
          "actors": [
            {"name": "OSH driver framework", "role": "Hosts the IDriver interface drivers must implement to expose sensor observations"},
            {"name": "OGC CS endpoints", "role": "Standard endpoints for observations, system descriptions, and control streams that the driver exposes"},
            {"name": "Meshtastic radio", "role": "LoRa mesh radio interface that emits packetised telemetry the driver consumes"}
          ],
          "integration_points": [
            {"from": "OSH driver", "to": "OGC CS endpoints", "data": "observation messages and system descriptions", "direction": "write"},
            {"from": "Meshtastic radio", "to": "OSH driver", "data": "packetised radio telemetry", "direction": "read"}
          ],
          "tasks": [
            "Implement OSH `IDriver` interface backed by Meshtastic radio events, exposing OGC CS observation endpoints"
          ],
          "addressed_gaps": [
            "QA-reviewer rev 1 needs_clarification verdict (no checks[]) closed by carrying a check candidate forward to ARCHITECT: file_exists on src/test/java/com/example/decoder/PacketDecoderTest.java binds the packet decoder task to a verifiable post-build artifact."
          ],
          "open_gaps": [],
          "substrate_mutations": []
        }

  - tool_call:
      name: decide
      arguments_json: |
        {
          "action": "architect",
          "reason": "Artifact rev 2 emitted. Same actors + integration_points as rev 1; addressed_gaps records the check candidate the ARCHITECT must include in checks[]. Forwarding so the recovery spec carries an evidence rule."
        }

  # ---------- Loop K: researcher-architect RECOVERY ----------

  - tool_call:
      name: read_loop_result
      arguments_json: |
        {
          "loop_id": "synthesize-loop-J"
        }

  - tool_call:
      name: emit_dev_via_spec_artifact
      arguments_json: |
        {
          "title": "OSH Meshtastic Driver (recovery v2)",
          "goal": "Implement the OSH IDriver interface backed by Meshtastic radio packets, exposing OGC CS observation endpoints.",
          "context": "Recovery pass after qa-reviewer rejected rev 1 for missing evidence rules. v2 adds checks[] with one evidence rule binding the packet decoder task. Goal/context/actors/integration_points carried forward verbatim from rev 1.",
          "actors": [
            {"name": "OSH driver framework", "role": "Hosts the IDriver interface drivers must implement to expose sensor observations"},
            {"name": "OGC CS endpoints", "role": "Standard endpoints for observations, system descriptions, and control streams that the driver exposes"},
            {"name": "Meshtastic radio", "role": "LoRa mesh radio interface that emits packetised telemetry the driver consumes"}
          ],
          "integration_points": [
            {"from": "Meshtastic radio", "to": "OSH driver framework", "direction": "read", "data": "packetised radio telemetry"},
            {"from": "OSH driver framework", "to": "OGC CS endpoints", "direction": "write", "data": "observation messages and system descriptions"}
          ],
          "tasks": [
            {
              "title": "Meshtastic packet decoder",
              "scope": "backend",
              "grounds_actors": ["Meshtastic radio", "OSH driver framework"],
              "grounds_integration_points": ["Meshtastic radio→OSH driver framework"]
            },
            {
              "title": "OGC CS observation publisher",
              "scope": "backend",
              "grounds_actors": ["OSH driver framework", "OGC CS endpoints"],
              "grounds_integration_points": ["OSH driver framework→OGC CS endpoints"]
            },
            {
              "title": "IDriver lifecycle and failure-mode handler",
              "scope": "backend",
              "grounds_actors": ["OSH driver framework", "Meshtastic radio"]
            }
          ],
          "checks": [
            {
              "target": "Meshtastic packet decoder produces structured POSITION_APP message from raw protobuf",
              "runtime": "in-process-unit",
              "ref": {"type": "filepath", "path": "src/test/java/com/example/decoder/PacketDecoderTest.java"},
              "evidence": [
                {"kind": "test_file_exists", "args": {"path": "src/test/java/com/example/decoder/PacketDecoderTest.java"}}
              ]
            }
          ],
          "provenance": {
            "research_artifact_loop": "synthesize-loop-J"
          }
        }

  - tool_call:
      name: decide
      arguments_json: |
        {
          "action": "emit",
          "reason": "Recovery spec rev 2 emitted with one in-process-unit check binding the packet decoder. Goal/context/actors/integration_points/tasks identical to rev 1; only checks[] is new — addresses the qa-reviewer's blocking_question directly. Reviewer-spec should approve; the build can then run and the qa-reviewer's evidence summary will reflect the check this time."
        }

  # ---------- Loop L: reviewer-spec RECOVERY ----------

  - tool_call:
      name: read_loop_result
      arguments_json: |
        {
          "loop_id": "architect-loop-K"
        }

  - tool_call:
      name: decide
      arguments_json: |
        {
          "action": "approved",
          "reason": "Recovery spec passes the checklist + external-actor coverage gate; the new check binds the Meshtastic packet decoder task to a verifiable post-build artifact. Approving so the recovery builder can run against the spec."
        }

  # ---------- Loop M: builder RECOVERY ----------

  - tool_call:
      name: bootstrap_workspace
      arguments_json: |
        {
          "spec_path": "docs/specs/2026-05-13-osh-meshtastic-driver-recovery-v2.md"
        }

  - tool_call:
      name: bash
      arguments_json: |
        {
          "command": "ls SPEC.md"
        }

  - tool_call:
      name: bash
      arguments_json: |
        {
          "command": "echo 'mvn test passing on recovery spec'"
        }

  - tool_call:
      name: builder_decide
      arguments_json: |
        {
          "action": "tests_passing",
          "reason": "Recovery builder ran against rev 2 spec's PacketDecoderTest check. Canned tests_passing — mock-LLM does not actually run tests; the builder_decide tool stamps coordinator.next_action=tests_passing unconditionally given the args. Rule_04 fires → recovery reviewer-qa.",
          "tests_run": 1,
          "tests_passed": 1,
          "tests_failed": 0,
          "artifact_summary": "Canned recovery summary — one notional unit test passing on the PacketDecoderTest check."
        }

  # ---------- Loop N: reviewer-qa RECOVERY (terminal — accept) ----------

  - tool_call:
      name: read_loop_result
      arguments_json: |
        {
          "loop_id": "recovery-builder-loop-M"
        }

  - tool_call:
      name: decide
      arguments_json: |
        {
          "action": "accept",
          "reason": "Recovery spec rev 2 carries one in-process-unit check (test_file_exists on PacketDecoderTest.java). Recovery builder reports tests_run=1, tests_passed=1, tests_failed=0 — aligns with the evidence rule. Build quality acceptable; the qa_mode_gate has already validated structural presence (tests_run > 0 AND tests_failed = 0). ADR-039 Phase 1 Shape A supersession cycle complete: rev 1 loops remain immutable; this recovery loop's verdict is the chain's effective terminal."
        }
