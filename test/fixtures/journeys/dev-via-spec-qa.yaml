name: dev-via-spec-qa
description: |
  Journey: R3.7.2.k′-bis of ADR-036 + ADR-039 Phase 1 rule 09 (qa-reviewer
  needs_clarification → architect recovery, Shape A supersession). Full
  architect → builder → qa-reviewer chain on mock-LLM, then a complete
  recovery cycle: recovery architect → recovery builder → recovery
  qa-reviewer accept. Extends dev-via-spec.yaml (R3.3 + R3.4b + R3.6.2
  of ADR-031/ADR-032) with two changes at the tail:

    1. Loop J (builder) terminates with builder_decide(tests_passing)
       instead of needs_clarification. The mock-LLM is sequence-based
       and role-blind; the builder_decide tool emits the
       coordinator.next_action=tests_passing triple unconditionally
       given the args, so the rule chain fires regardless of whether
       the preceding bash calls actually ran tests. The artifact_summary
       field is canned text; the qa-reviewer mock-LLM does not read
       prompt content (sequence-based).

    2. Loop K (NEW) is the dev-via-spec-qa-reviewer (R3.7.2.j′ persona),
       spawned by configs/rules/dev-via-spec/07-builder-decide-to-
       qa-reviewer.json once the evidence preprocessor has stamped
       evidence.summary_ready=true (ADR-036 §Phase 2). It reads the
       builder's terminal via read_loop_result and emits
       decide(needs_clarification) — the correct verdict when the
       evidence summary contains "(no checks)" (empty checks.json,
       because mock-LLM bootstrap_workspace doesn't seed a real sidecar).
       The mock-LLM is sequence-based and does NOT read prompt content,
       so the verdict is canned regardless of what the preprocessor
       stamped.

  This fixture proves the chain SHAPE end-to-end on mock-LLM:
  rule 07's two-AND condition fires (tests_passing + evidence.summary_ready),
  qa-reviewer spawns + reads + emits decide(needs_clarification),
  ADR-039 Phase 1 rule 09 fires + spawns a recovery architect, the
  recovery cycle (architect → builder → qa-reviewer) completes
  cleanly with the recovery qa-reviewer's decide(accept), and the
  chain settles at fourteen loops. Substantive evidence grading (smoke
  #8 on real LLM with Testcontainers) is slice 5.

  Paired spec: ui/e2e/agentic/dev-via-spec-qa.spec.ts.
  Required compose profiles: semsource (substrate-modifying retry
  pass, same as R2.5/R3.2.2) **and** sandbox (the dev-via-spec-builder
  loop calls bootstrap_workspace + bash; both route through the
  sandbox container per ADR-032 §R3.6.2.a wiring). The sandbox
  profile also brings up the workspace volume that the evidence
  preprocessor reads via its :ro bind mount.

  Sequence (fourteen loops, ~44 LLM round-trips, ADR-040 reshape):

    Loop A — researcher (initial pass, revision=1, default_role)
      1. tool_call: query_entity (corpus probe, returns nothing)
      2. tool_call: emit_research_artifact (revision=1, empty)
      3. completion: artifact JSON with corpus-gap message.
         → outcome=success → rule_01a fires.

    Loop B — research-reviewer (pass 1, decides corpus gap)
      4. tool_call: read_loop_result (placeholder; tool errors)
      5. tool_call: decide(insufficient, names missing repo)
         → coordinator.next_action=insufficient → rule_02 fires
         (spawn-curator).

    Loop C — source-curator (substrate-mutating pass, ADR-040)
      6. tool_call: read_loop_result (placeholder; tool errors)
      7. tool_call: add_source_repo (approval-gated; test approves)
      8. tool_call: query_entity (verifies indexing finished)
      9. tool_call: emit_curator_artifact (added_sources +
         verified_entity_ids; source_dirs OMITTED — no SemSource
         shared mount in this deployment)
     10. tool_call: decide(action="indexed")
         → coordinator.next_action=indexed → rule_02b fires
         (spawn researcher with curator_loop_id).

    Loop D — researcher (recovery=curator_indexed, re-query pass)
     11. tool_call: read_loop_result (placeholder; tool errors)
     12. tool_call: query_entity (against augmented corpus)
     13. tool_call: emit_research_artifact (revision=2, full;
         substrate_mutations=[] — researcher does NOT mutate
         under ADR-040)
     14. completion: artifact JSON.
         → outcome=success → rule_01a fires.

    Loop E — research-reviewer (pass 2, approves on re-queried artifact)
     15. tool_call: read_loop_result (placeholder; tool errors)
     16. tool_call: decide(approved)
         → coordinator.next_action=approved → rule_03 fires
         (research-mode-transition rule, spawns dev-via-spec-planner).

    Loop F — dev-via-spec-planner (R3.3 first pass, real persona)
     17. tool_call: read_loop_result (placeholder; tool errors)
     18. tool_call: emit_plan (PR C C5: renders docs/plans/<slug>.md +
         publishes dev_via_spec.plan.{loop_id} payload + stamps marker
         triples; chain milestone subscriber writes chain.plan_loop +
         chain.plan.path on reviewer-approval)
     19. tool_call: decide(planned, reason=<plan content>)
         → coordinator.next_action=planned → dev-via-spec rule_01 fires
         (planner → reviewer handoff).

    Loop G — dev-via-spec-reviewer (first pass, approves on golden path)
     20. tool_call: read_loop_result (placeholder; tool errors)
     21. tool_call: decide(approved, reason=<all checklist items met>)
         → coordinator.next_action=approved → dev-via-spec rule_03 fires
         (reviewer → challenger handoff).

    Loop H — dev-via-spec-challenger (first pass, accepts on golden path)
     22. tool_call: read_loop_result (placeholder; tool errors)
     23. tool_call: emit_consensus (PR C C5: accept-branch only;
         renders docs/consensus/<slug>.md + publishes
         dev_via_spec.consensus.{loop_id} payload + stamps marker
         triples; chain milestone subscriber writes chain.consensus_loop
         + chain.consensus.path on accept)
     24. tool_call: decide(accept, reason=<no concerns>)
         → coordinator.next_action=accept → dev-via-spec rule_05 fires
         (challenger → architect handoff).

    Loop I — dev-via-spec-architect (R3.4b, emits typed artifact)
     25. tool_call: read_loop_result (placeholder; tool errors —
         architect's three reads are placeholders that all error,
         consumed by the next canned turn)
     26. tool_call: read_loop_result (placeholder; tool errors)
     27. tool_call: read_loop_result (placeholder; tool errors)
     28. tool_call: emit_dev_via_spec_artifact (renders markdown to
         docs/specs/<slug>.md AND mints dev_via_spec.artifact.{path,
         slug,...} marker triples on this loop entity)
     29. tool_call: decide(tasks_emitted, reason=<final task list>)
         → coordinator.next_action=tasks_emitted →
         dev-via-spec rule_06 fires (R3.6.2.d: architect→builder).

    Loop J — dev-via-spec-builder (R3.6.2.e + R3.7.2.k′)
     30. tool_call: bootstrap_workspace (iteration 1; the
         hardcoded spec_path will not match the architect's
         dynamically-dated emit on most days, so the tool surfaces
         a "spec file not found" error — same placeholder-doesn't-
         resolve convention as the read_loop_result calls earlier;
         the next canned turn handles it).
     31. tool_call: bash ls SPEC.md (placeholder; the next canned
         turn handles whatever bash returns).
     32. tool_call: bash echo "mvn test passing" (placeholder; the
         next canned turn handles the result).
     33. tool_call: builder_decide(tests_passing, tests_run=3,
         tests_passed=3, tests_failed=0, artifact_summary=<canned>)
         → coordinator.next_action=tests_passing →
         dev-via-spec rule_07 fires (R3.7.2.k′:
         builder→qa-reviewer).

    Loop K — dev-via-spec-qa-reviewer (R3.7.2.k′-bis terminal)
     34. tool_call: read_loop_result (placeholder against the
         builder loop_id; tool errors — same convention as the
         placeholder reads in Loops B/D/E/F/G/H/I above).
     35. tool_call: decide(needs_clarification,
         reason="evidence summary is (no checks) — architect emitted
         no checks in this mock-LLM journey; the qa-reviewer cannot
         accept without evidence rules per 10-evaluation-contract.md
         Rule 3",
         blocking_question=<architect must re-emit with evidence rules>)
         → coordinator.next_action=needs_clarification → ADR-039
         Phase 1 rule 09 fires (qa-reviewer needs_clarification →
         architect recovery, Shape A supersession).

    Loop L — dev-via-spec-architect RECOVERY (rule 09 spawn)
     36. tool_call: read_loop_result on qa-reviewer-loop-K
         (placeholder; tool errors)
     37. tool_call: read_loop_result on researcher-loop-D
         (placeholder; tool errors)
     38. tool_call: emit_dev_via_spec_artifact (recovery v2 — same
         actors/integration_points/tasks as v1 PLUS checks[] with
         one evidence rule, the gap qa-reviewer flagged)
     39. tool_call: decide(tasks_emitted, reason=<recovery summary>)
         → coordinator.next_action=tasks_emitted →
         dev-via-spec rule_06 fires (recovery builder spawn).

    Loop M — dev-via-spec-builder RECOVERY (rule 06 spawn)
     40. tool_call: bootstrap_workspace
     41. tool_call: bash ls SPEC.md (placeholder; next turn handles)
     42. tool_call: bash echo (placeholder; next turn handles)
     43. tool_call: builder_decide(tests_passing, ...)
         → coordinator.next_action=tests_passing →
         dev-via-spec rule_07 fires (recovery qa-reviewer spawn).

    Loop N — dev-via-spec-qa-reviewer RECOVERY (clean terminal)
     44. tool_call: read_loop_result on recovery-builder-loop-M
         (placeholder; tool errors)
     45. tool_call: decide(accept, reason=<recovery cycle complete>)
         → terminal. coordinator.next_action=accept fires no rule
         (rule 09 only fires on needs_clarification). Chain settles
         at fourteen loops; ADR-039 Phase 1 Shape A supersession
         cycle complete end-to-end.

  Mock-llm is sequence-based and role-blind. The fixture aligns to
  the exact order of LLM round-trips across all fourteen loops. Same
  read_loop_result / bootstrap_workspace / bash placeholder caveat
  as R1/R2.5/R3.2.2: arguments_json passes verbatim, the tool
  returns an error, the next canned turn handles it. The structural
  assertion (rule chain firing in order + role distribution + final
  state) is unaffected.

  Builder-loop terminal choice: tests_passing is canned. The
  builder_decide tool emits coordinator.next_action=tests_passing
  unconditionally given the args; mock-LLM does not actually run
  tests in the workspace. The artifact_summary string is decorative
  — qa-reviewer mock-LLM does not read prompt content. This is a
  shape proof, not a substance proof; smoke #8 (slice 5) is where
  actual mvn test runs. The needs_clarification variant of this
  fixture is preserved at dev-via-spec.yaml.

  Evidence preprocessor (ADR-036 §Phase 2): the preprocessor
  subscribes to agent.complete.> and stamps evidence.summary +
  evidence.summary_ready on the builder entity when the loop
  completes. In this mock-LLM journey, bootstrap_workspace uses a
  hardcoded spec_path that won't match a real artifact, so the sidecar
  projection (and therefore .evidence/checks.json) may be absent.
  The preprocessor stamps a plumbing-failure summary in that case
  and still stamps evidence.summary_ready=true so rule_07's two-AND
  condition fires. The qa-reviewer sees "(no checks file …)" or
  "(no checks)" in its prompt and routes needs_clarification per Rule 3.

  QA-reviewer-loop terminal choice: needs_clarification is correct
  for a journey where no architect checks reached the workspace
  (mock-LLM doesn't seed a real sidecar). The j′ persona's
  10-evaluation-contract.md Rule 3 handles both "(no checks)" and
  chain-plumbing-failure summaries by routing needs_clarification.
  The mock-LLM does not read the summary (sequence-based); the canned
  decide aligns with the expected persona behaviour.

  This spec covers only the golden path. The retry paths (reviewer
  rejection → planner retry via rule 02, challenger concerns → planner
  retry via rule 04, builder iteration-budget exhaustion → tests_failing)
  are exercised by the rules' max_iterations metadata and persona-content
  discipline; a follow-up retry-path fixture can exercise them under
  e2e if smoke #8 reveals real-LLM retry behaviour worth pinning.

responses:
  # ---------- Loop A: researcher (initial pass, revision=1) ----------

  - tool_call:
      name: query_entity
      arguments_json: |
        {
          "id": "osh.driver.framework"
        }

  - tool_call:
      name: emit_research_artifact
      arguments_json: |
        {
          "revision": 1,
          "test_harness": "meshtasticd-2.x",
          "title": "OSH Meshtastic driver research",
          "actors": [],
          "integration_points": [],
          "tasks": [],
          "addressed_gaps": [],
          "open_gaps": [
            "OSH driver framework documentation not indexed — query_entity for osh.driver.framework returned nothing. Recommend add_source_repo for the osh-core repository."
          ],
          "substrate_mutations": []
        }

  - completion:
      content: |
        Initial research pass on OSH driver framework actors. The
        corpus does not appear to contain OSH driver framework
        documentation — `query_entity` found no match for
        `osh.driver.framework`. Submitting an empty artifact with
        the corpus gap explicitly named so the reviewer can decide
        whether to extend the corpus.

        ```json
        {
          "revision": 1,
          "actors": [],
          "integration_points": [],
          "tasks": [],
          "addressed_gaps": [],
          "open_gaps": [
            "OSH driver framework documentation not indexed — query_entity for osh.driver.framework returned nothing. Recommend add_source_repo for the osh-core repository."
          ],
          "substrate_mutations": []
        }
        ```

  # ---------- Loop B: research-reviewer (pass 1) ----------

  - tool_call:
      name: read_loop_result
      arguments_json: |
        {
          "loop_id": "researcher-loop-A"
        }

  - tool_call:
      name: decide
      arguments_json: |
        {
          "action": "insufficient",
          "reason": "Corpus gap: OSH driver framework documentation is not indexed. Recommend add_source_repo for https://github.com/sensorhub-tools/osh-core in namespace research. The retry researcher should register this source before re-querying."
        }

  # ---------- Loop C: source-curator (substrate-mutating pass, ADR-040) ----------

  - tool_call:
      name: read_loop_result
      arguments_json: |
        {
          "loop_id": "reviewer-loop-B"
        }

  - tool_call:
      name: add_source_repo
      arguments_json: |
        {
          "url": "https://github.com/sensorhub-tools/osh-core",
          "namespace": "research",
          "branch": "main"
        }

  - tool_call:
      name: query_entity
      arguments_json: |
        {
          "entity_id": "osh.core.api.module.IModule"
        }

  - tool_call:
      name: emit_curator_artifact
      arguments_json: |
        {
          "added_sources": [
            {
              "url": "https://github.com/sensorhub-tools/osh-core",
              "namespace": "research",
              "covers": "OSH IDriver / IModule / IPersistentDriver interfaces, BaseSensorModule, OGC CS endpoint helpers"
            }
          ],
          "verified_entity_ids": [
            "osh.core.api.module.IModule",
            "osh.core.api.module.IModuleProvider",
            "osh.core.api.sensor.IDriver",
            "osh.core.impl.module.BaseSensorModule"
          ]
        }

  - tool_call:
      name: decide
      arguments_json: |
        {
          "action": "indexed",
          "reason": "Added osh-core for OSH driver/module entities; 4 IDs verified to resolve via query_entity post-indexing. The next researcher loop can build on these without re-validating."
        }

  # ---------- Loop D: researcher (recovery=curator_indexed, re-query) ----------

  - tool_call:
      name: read_loop_result
      arguments_json: |
        {
          "loop_id": "curator-loop-C"
        }

  - tool_call:
      name: query_entity
      arguments_json: |
        {
          "entity_id": "osh.core.api.module.IModule"
        }

  - tool_call:
      name: emit_research_artifact
      arguments_json: |
        {
          "revision": 2,
          "test_harness": "meshtasticd-2.x",
          "title": "OSH Meshtastic driver research",
          "actors": [
            {"name": "OSH driver framework", "role": "Hosts the IDriver interface drivers must implement to expose sensor observations"},
            {"name": "OGC CS endpoints", "role": "Standard endpoints for observations, system descriptions, and control streams that the driver exposes"},
            {"name": "Meshtastic radio", "role": "LoRa mesh radio interface that emits packetised telemetry the driver consumes"}
          ],
          "integration_points": [
            {"from": "OSH driver", "to": "OGC CS endpoints", "data": "observation messages and system descriptions", "direction": "write"},
            {"from": "Meshtastic radio", "to": "OSH driver", "data": "packetised radio telemetry", "direction": "read"}
          ],
          "tasks": [
            "Implement OSH `IDriver` interface backed by Meshtastic radio events, exposing OGC CS observation endpoints"
          ],
          "addressed_gaps": [
            "Corpus gap closed by curator's add_source_repo for https://github.com/sensorhub-tools/osh-core; queried curator's verified_entity_ids (IModule, IDriver, BaseSensorModule) and enumerated actors from the resolved entities."
          ],
          "open_gaps": [],
          "substrate_mutations": []
        }

  - completion:
      content: |
        Re-queried the curator-augmented corpus and enumerated three
        actors (OSH driver framework, OGC CS endpoints, Meshtastic
        radio) and two integration points. Built directly on the
        curator's verified_entity_ids — no re-validation needed.
        Substrate untouched this pass; the curator owns mutation
        under ADR-040.

        ```json
        {
          "revision": 2,
          "actors": [
            {"name": "OSH driver framework", "role": "Hosts the IDriver interface drivers must implement to expose sensor observations"},
            {"name": "OGC CS endpoints", "role": "Standard endpoints for observations, system descriptions, and control streams that the driver exposes"},
            {"name": "Meshtastic radio", "role": "LoRa mesh radio interface that emits packetised telemetry the driver consumes"}
          ],
          "integration_points": [
            {"from": "OSH driver", "to": "OGC CS endpoints", "data": "observation messages and system descriptions", "direction": "write"},
            {"from": "Meshtastic radio", "to": "OSH driver", "data": "packetised radio telemetry", "direction": "read"}
          ],
          "tasks": [
            "Implement OSH `IDriver` interface backed by Meshtastic radio events, exposing OGC CS observation endpoints"
          ],
          "addressed_gaps": [
            "Corpus gap closed by curator's add_source_repo for https://github.com/sensorhub-tools/osh-core; queried curator's verified_entity_ids (IModule, IDriver, BaseSensorModule) and enumerated actors from the resolved entities."
          ],
          "open_gaps": [],
          "substrate_mutations": []
        }
        ```

  # ---------- Loop E: research-reviewer (pass 2 — approves on re-queried artifact) ----------

  - tool_call:
      name: read_loop_result
      arguments_json: |
        {
          "loop_id": "researcher-loop-D"
        }

  - tool_call:
      name: decide
      arguments_json: |
        {
          "action": "approved",
          "reason": "Checklist satisfied: three actors with role text, two integration points with direction, one decomposable seed requirement. Substrate untouched this revision (researcher does not mutate under ADR-040; the curator's add was executed in Loop C). No stabilisation gate to apply — the post-curator researcher pass is a pure re-query."
        }

  # ---------- Loop F: dev-via-spec-planner (R3.3 first pass) ----------

  - tool_call:
      name: read_loop_result
      arguments_json: |
        {
          "loop_id": "reviewer-loop-E"
        }

  # PR C Phase C5: planner calls emit_plan before terminating with
  # decide(planned). Tool renders docs/plans/<slug>.md, mints marker
  # triples on the loop entity, and lets the chain milestone subscriber
  # propagate chain.plan.path on reviewer-approval. decide.reason still
  # carries the substance for the in-chain reviewer to read via
  # read_loop_result.
  - tool_call:
      name: emit_plan
      arguments_json: |
        {
          "revision": 1,
          "title": "OSH Meshtastic driver plan",
          "goal": "Implement the OSH IDriver interface backed by Meshtastic radio packets, exposing OGC CS observation endpoints.",
          "context": "The research arc enumerated three actors — OSH driver framework (hosts IDriver), OGC CS endpoints (observation surface), and Meshtastic radio (telemetry source). The boundary spans a read-side (Meshtastic packets → driver) and a write-side (driver → OGC CS observations).",
          "scope_in": [
            "pkg/driver/meshtastic_driver.go — IDriver implementation",
            "pkg/driver/ogc_publisher.go — OGC CS write-side publisher",
            "pkg/driver/meshtastic_decoder.go — Meshtastic packet decoder",
            "test/driver/integration_test.go — read+write integration coverage"
          ],
          "scope_out": [
            "Meshtastic firmware changes — out of repo scope, upstream-owned",
            "OGC CS specification work — standards body owns; we conform, not extend"
          ],
          "epics": [
            "E1 — Meshtastic packet ingestion: implement the read-side decoder, normalising radio packets into the driver's internal observation envelope",
            "E2 — OGC CS observation publishing: implement the write-side publisher exposing the IDriver interface, mapping internal observations to OGC CS observation messages and system descriptions",
            "E3 — Lifecycle and recovery: implement IDriver lifecycle hooks (start/stop) plus the radio-disconnect failure mode handler"
          ],
          "depends_on": {
            "research_artifact_loop": "researcher-loop-D"
          }
        }

  - tool_call:
      name: decide
      arguments_json: |
        {
          "action": "planned",
          "reason": "Goal: Implement the OSH IDriver interface backed by Meshtastic radio packets, exposing OGC CS observation endpoints. Context: The research arc enumerated three actors — OSH driver framework (hosts IDriver), OGC CS endpoints (observation surface), and Meshtastic radio (telemetry source). The boundary spans a read-side (Meshtastic packets → driver) and a write-side (driver → OGC CS observations). Scope: include = [pkg/driver/meshtastic_driver.go, pkg/driver/ogc_publisher.go, pkg/driver/meshtastic_decoder.go, test/driver/integration_test.go]; exclude = [Meshtastic firmware changes, OGC CS specification work]; do_not_touch = [README.md, LICENSE]. Epics: E1 — Meshtastic packet ingestion: implement the read-side decoder, normalising radio packets into the driver's internal observation envelope; E2 — OGC CS observation publishing: implement the write-side publisher exposing the IDriver interface, mapping internal observations to OGC CS observation messages and system descriptions; E3 — Lifecycle and recovery: implement IDriver lifecycle hooks (start/stop) plus the radio-disconnect failure mode handler. Three epics decompose the single seed requirement at interface granularity per the dev-via-spec planner contract.\n\n## Verifiable Outcomes\n\n- E1 — When meshtasticd publishes a protobuf POSITION_APP packet on TCP/4403 from node 0xABCD, the MeshtasticSensorModule emits within 500ms a CS API observation with non-null SensorML schema and matching node_id.\n- E2 — When the driver's internal observation envelope contains a populated payload, the OGC CS publisher issues a POST /observations with body matching the OGC CS observation JSON schema and a 2xx response is recorded.\n- E3 — When the Meshtastic TCP connection drops mid-stream, the driver transitions to a degraded state within 1s, emits a status observation describing the disconnect, and resumes ingestion within 5s of the radio reconnecting (no observations dropped after reconnect)."
        }

  # ---------- Loop G: dev-via-spec-reviewer (first pass — approves) ----------

  - tool_call:
      name: read_loop_result
      arguments_json: |
        {
          "loop_id": "planner-loop-F"
        }

  - tool_call:
      name: decide
      arguments_json: |
        {
          "action": "approved",
          "reason": "All completeness checklist items met. Goal is one concrete sentence naming the IDriver interface and the OGC CS endpoint target. Context cites two of three artifact actors (OSH driver framework + Meshtastic radio) and references the read/write integration boundary. Scope.include grounds against artifact integration_points (Meshtastic packet ingestion file + OGC CS publisher file); scope.exclude rationalises Meshtastic firmware changes; scope.do_not_touch is concrete. All three artifact integration_points are covered by epic scope. Epic decomposition E1/E2/E3 splits cleanly on the read-side / write-side / lifecycle boundary at interface granularity. No revision-respect concerns — first pass."
        }

  # ---------- Loop H: dev-via-spec-challenger (first pass — accepts) ----------

  - tool_call:
      name: read_loop_result
      arguments_json: |
        {
          "loop_id": "reviewer-loop-G"
        }

  # PR C Phase C5: challenger calls emit_consensus on the accept branch
  # only. Tool renders docs/consensus/<slug>.md, mints marker triples,
  # chain milestone subscriber writes chain.consensus.path on accept.
  - tool_call:
      name: emit_consensus
      arguments_json: |
        {
          "title": "OSH Meshtastic driver consensus",
          "summary": "Plan accepted: read-side Meshtastic decoder + write-side OGC CS publisher + lifecycle/recovery handler decompose the IDriver implementation cleanly across the two integration points named in the research artifact.",
          "chain_consensus": [
            "Meshtastic radio → OSH driver framework: read-side decoder normalises packetised telemetry into the driver's internal observation envelope (E1)",
            "OSH driver framework → OGC CS endpoints: write-side publisher maps internal observations to OGC CS observation messages and system descriptions (E2)",
            "Lifecycle + radio-disconnect failure mode owned by E3 — covers asynchronous Meshtastic→driver hazards"
          ],
          "considered_concerns": [],
          "depends_on": {
            "plan_loop": "planner-loop-F",
            "reviewer_loop": "reviewer-loop-G"
          }
        }

  - tool_call:
      name: decide
      arguments_json: |
        {
          "action": "accept",
          "reason": "Probed for six failure classes; no actionable concerns raised. (1) Decomposition coarseness: E1/E2/E3 each touch a single integration boundary (Meshtastic-read / OGC-write / lifecycle); no epic spans both directions. (2) Scope creep: every scope.include item maps to an artifact actor + integration point; no unmotivated additions. (3) Missing failure mode: E3 explicitly owns the radio-disconnect case for the asynchronous Meshtastic→driver flow. (4) Unaccounted integration: both artifact integration_points are owned by an epic. (5) Goal/scope coherence: scope items deliver the goal; goal motivates context's actor citations. (6) Revision-respect: not applicable — first pass. The plan is well-formed and ready for the architect to ratify."
        }

