name: run-failed-coordinator-inherit
description: |
  Journey: ADR-053 Phase 4b-1a — an INHERIT-anchor recovery coordinator that
  fails while executing drives the run executing→failed via rule 05 (the
  agent.run.entity-id branch). End-to-end on mock-LLM against
  configs/e2e-flow-bootstrap.json.

  The anchor_inherit sibling of run-failed-coordinator.yaml (which exercises the
  THREADED branch → rule 06). Here a FIRST-PASS Lisa escalates with
  decide(needs_clarification) on her first turn (rule 01 allowlist =
  [planned, needs_clarification]); rule 02f spawns a recovery coordinator with
  DEFAULT run_scope and does NOT thread run-loop-entity-id. Because first-pass
  Lisa carries a bare agent.run (rule 01 run_scope=new), the recovery coordinator
  INHERITS agent.run.entity-id but carries NO agent.lineage.run-loop-entity-id. So when
  it is wedged to a max_iterations failure, ONLY agent-run/05 can fire (rule 06
  requires agent.lineage.run-loop-entity-id length_gt 0, which is absent) → the inherit
  branch drives executing→failed.

  Substrate behavior this proves:
    1. Loop 0 coordinator(dispatch) → decide(dev_via_test) → rule 01 spawns
       first-pass Lisa with run_scope=new → rule.task.spawned → agent-run/01
       handoff marker → agent-run/02 dispatched→executing. Run is `executing`.
    2. Loop A first-pass Lisa → decide(needs_clarification) (no plan emitted) →
       rule 02f (fenced length_eq 0, first-pass) spawns the recovery coordinator.
       It does NOT thread run-loop-entity-id; the coordinator inherits
       agent.run.entity-id off Lisa's bare agent.run.
    3. Loop R recovery coordinator → WEDGED: tools [read_loop_result, decide]
       (no scratchpad); a single non-terminal read_loop_result repeats every
       iteration, so it never decides and hits max_iterations → OutcomeFailed.
    4. agent-run/05 (role==coordinator + outcome in [failed,truncated] +
       agent.run.entity-id != "" + agent.lineage.run-loop-entity-id length_eq 0) stamps
       agent.run.outcome=failed on the RUN entity via the agent.run.entity-id
       anchor. agent-run/06 (length_gt 0) is mutually exclusive and does NOT fire.
    5. agent-run/04-executing-to-failed fires → executing→failed.

  Like its threaded sibling, this is the EXECUTING-phase coordinator failure the
  upstream D3 zombie guard CANNOT reach. The spec asserts
  agent.run.last-transition-from==executing (rule 04 via rule 05), NOT D3's
  dispatched→failed.

  Mock serves responses in GLOBAL ORDER (last repeats once exhausted). The chain
  is linear (Lisa escalates immediately, no plan, no CBG), so the order below ==
  the order of LLM requests. No sandbox is requested.

  Paired spec: ui/e2e/agentic/run-failed-coordinator-inherit.spec.ts.
  Config: configs/e2e-flow-bootstrap.json (incl. rule 02f + agent-run/05).
  Required env: SEMTEAMS_SANDBOX_RUNNER=mock on the backend.

responses:
  # ---------- Loop 0: front-door coordinator → dev_via_test ----------
  - tool_call:
      name: decide
      arguments_json: |
        {
          "action": "dev_via_test",
          "reason": "Add a Go HTTP service that decodes MAVLink v2 HEARTBEAT frames over UDP and serves the latest at GET /heartbeat as JSON. (4b-1a inherit-anchor coordinator-failure journey: first-pass Lisa escalates needs_clarification, then the inherit recovery coordinator is wedged to a max-iterations failure to exercise executing→failed via rule 05.)"
        }

  # ---------- Loop A: first-pass Lisa → needs_clarification (no plan) ----------
  # rule 01 allowlist = [planned, needs_clarification]; Lisa escalates on turn 1.
  # rule 02f (first-pass, lineage length_eq 0) spawns the INHERIT recovery
  # coordinator (no run-loop-entity-id thread).
  - tool_call:
      name: decide
      arguments_json: |
        {
          "action": "needs_clarification",
          "reason": "The ask does not specify the UDP listen address/port or which MAVLink dialect to decode — I cannot turn this into a faithful plan without the user clarifying. Escalating rather than guessing."
        }

  # ---------- Loop R: inherit recovery coordinator (WEDGED) ----------
  # The 02f recovery coordinator has tools [read_loop_result, decide] (no
  # scratchpad). This single non-terminal read_loop_result repeats every
  # iteration (GLOBAL ORDER: last response repeats on exhaustion), so the
  # coordinator never decides and trips max_iterations → OutcomeFailed. Because
  # 02f does NOT thread run-loop-entity-id, the coordinator carries only the
  # INHERITED agent.run.entity-id → agent-run/05 (not 06) → executing→failed.
  # The loop_id is a deliberate placeholder (the read result is never consumed;
  # a tool error feeds back as a tool result and does not terminate the loop).
  - tool_call:
      name: read_loop_result
      arguments_json: |
        {"loop_id": "wedge-no-decide"}
