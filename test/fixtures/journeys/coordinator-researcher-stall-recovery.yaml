name: coordinator-researcher-stall-recovery
description: |
  Journey: Coordinator → research_only chain → synthesize drifts toward
  architect → chainstall (Slice 2 Piece 1) routes to coordinator → fresh
  coordinator re-frames → second arc converges → reviewer approves →
  wake-up coordinator delivers user reply.

  Mirrors `coordinator-researcher.yaml`'s shape but injects a deliberate
  synthesize→architect drift on the first arc so the
  `cmd/semteams/chainstall` subscriber observes a mode_mismatch
  rejection and routes the recovery to the coordinator wake-up path
  (rule 05 — `configs/rules/coordinator/05-chain-stall-to-coordinator.json`).

    Loop 0 — coordinator (dispatch from user prompt)
      1. tool_call: decide(action="delegate_research", reason=...)
         → rule 01 fires → spawn researcher-plan-1
         → chainmode.Stamper writes chain.mode.classification="research_only"
           on Chain 1 (rooted at Loop 0)

    Loop A — researcher-plan-1 (rule 01 spawn)
      2. tool_call: emit_plan (revision=1)
      3. tool_call: decide(action="gather", reason=<plan substance>)
         → phasevalidator: plan→gather allowed, gather count 0→1
         → rule_04 fires → spawn researcher-gather-1

    Loop B — researcher-gather-1 (rule 04 spawn)
      4. tool_call: read_loop_result (placeholder)
      5. tool_call: query_entity (placeholder probe)
      6. tool_call: decide(action="synthesize", reason=<ready to compose>)
         → phasevalidator: gather→synthesize allowed, synthesize count 0→1
         → rule_05 (phase-transition) fires → spawn researcher-synthesize-1

    Loop C — researcher-synthesize-1 (rule 05 spawn — THE DRIFT)
      7. tool_call: read_loop_result (placeholder)
      8. tool_call: emit_research_artifact (revision=1, FULL)
      9. tool_call: decide(action="architect", reason=<drifted toward dev>)
         → phasevalidator.modeGateRejects: chain.mode=research_only +
           action=architect → writes chain.phase_transition.rejected="true"
           + chain.phase_transition.reject_reason="mode_mismatch" on Chain 1.
         → NO chain.phase_transition.proceed.architect → rule_01a does
           NOT fire (no reviewer-research spawn from this arc).
         → chainstall.HandleLoopCompleted observes:
             producer role = researcher-synthesize ✓
             producer action = architect ✓ (read from loop entity's
               coordinator.next_action triple)
             chain.mode.classification = research_only ✓
           → detectRejection returns ReasonModeMismatch
           → RouteForReason(mode_mismatch) returns RouteCoordinator
           → stamps audit cluster on Chain 1's chain entity:
               chain.rejection.recovery_count = "1"
               chain.stall.routed_to = "coordinator"
               chain.stall.reason = "mode_mismatch"
               chain.stall.producer_loop_id = <Loop C loop_id>
               chain.stall.producer_role = "researcher-synthesize"
               chain.stall.observed_at = <RFC3339 ts>
           → stamps per-loop sentinels on Loop C entity:
               chain.stall.reason = "mode_mismatch"
               chain.stall.proceed = "true"
         → rule 05 (chain-stall) fires on Loop C's chain.stall.proceed
           → publish_agent role=coordinator with
             properties.wakeup_mode="chain_stall" + related_loops.producer
           → spawn Loop D coord-2 (wake-up).

    Loop D — coordinator-2 (rule 05/chain-stall spawn)
      10. tool_call: read_loop_result on Loop C (placeholder loop_id —
          arguments_json passed verbatim; the placeholder doesn't resolve;
          tool errors; next response handles it. Same caveat as
          coordinator-researcher.yaml).
      11. tool_call: decide(action="delegate_research", reason=<stall-aware
          re-framing: explicitly forbids architect/spec routing>)
          → rule 01 fires → spawn researcher-plan-2 with parent_loop_id=Loop D
          → chainmode.Stamper writes chain.mode.classification="research_only"
            on Chain 2 (rooted at Loop D coord-2)

    Loop A' — researcher-plan-2 (rule 01 spawn from coord-2)
      12. tool_call: emit_plan (revision=1, refined for the retry)
      13. tool_call: decide(action="gather", reason=<plan substance>)
          → phasevalidator: plan→gather allowed on Chain 2
          → rule_04 fires → spawn researcher-gather-2

    Loop B' — researcher-gather-2 (rule 04 spawn)
      14. tool_call: read_loop_result (placeholder)
      15. tool_call: query_entity (placeholder probe)
      16. tool_call: decide(action="synthesize", reason=<ready to compose>)
          → phasevalidator: gather→synthesize allowed on Chain 2
          → rule_05 (phase-transition) fires → spawn researcher-synthesize-2

    Loop C' — researcher-synthesize-2 (rule 05 spawn — CORRECT)
      17. tool_call: read_loop_result (placeholder)
      18. tool_call: emit_research_artifact (revision=1, FULL — same shape
          as Loop C; the artifact substance was fine, only the terminal
          action drifted on the first arc)
      19. tool_call: decide(action="emit", reason=<artifact ready>)
          → phasevalidator: synthesize→emit allowed (terminal forward edge)
          → rule_01a fires → spawn reviewer-research

    Loop D' — reviewer-research (rule 01a spawn, approves)
      20. tool_call: read_loop_result (placeholder)
      21. tool_call: decide(action="approved", reason=<checklist met>)
          → chain.TerminalStamper writes chain.terminal.* on Chain 2
          → rule 04a fires → spawn Loop E coord-3 (wake-up coordinator)

    Loop E — coordinator-3 (rule 04a spawn — Slice 1c return path)
      22. tool_call: read_loop_result on Loop D' (placeholder)
      23. tool_call: decide(action="respond_direct", reason=<user-facing
          synthesized comparison>)
          → rule 03b fires → publishes coordinator.user_reply audit
            triple AND publishes prose on user.response.<Loop E loop_id>
          → terminal. No further loops.

  Ten loops total, twenty-three LLM round-trips. Mock-llm is sequence-
  based and role-blind — the order below is the exact order of requests
  across all ten loops.

  read_loop_result placeholder caveat as in
  research-mode-transition.yaml + coordinator-researcher.yaml:
  arguments_json passes verbatim, the placeholder loop_id will not
  resolve, the tool returns an error, the next canned turn handles it.
  Structural assertions (chainstall audit cluster, per-loop proceed
  sentinel, rule 05 fire, chain.terminal on Chain 2, coordinator.user_reply
  on Loop E) are unaffected.

  Paired spec: ui/e2e/agentic/coordinator-researcher-stall-recovery.spec.ts.
  Compose profile: none beyond the agentic-e2e baseline. Config:
  configs/e2e-coordinator.json (Slice 2 Piece 1 already wires rule 05
  into rules_files; no config change needed for this journey).

responses:
  # ---------- Loop 0: coordinator (dispatch) ----------

  - tool_call:
      name: decide
      arguments_json: |
        {
          "action": "delegate_research",
          "reason": "The user is asking for a comparison of MQTT vs NATS for IoT edge deployments — a comparison-of-named-products question that benefits from evidence gathering rather than a small-talk reply. Routing to the research_only chain so researcher-plan can scope the synthesis. NOTE: research_only chain — synthesize must terminate at emit, NOT architect."
        }

  # ---------- Loop A: researcher-plan-1 (rule 01 spawn) ----------

  - tool_call:
      name: emit_plan
      arguments_json: |
        {
          "revision": 1,
          "title": "MQTT vs NATS for IoT edge — research plan",
          "goal": "Compare MQTT and NATS for IoT edge deployments — latency, footprint, and reliability characteristics on constrained ARM devices.",
          "context": "Initial planning pass — the user asked for a head-to-head comparison. The plan scopes the gather phase to two complementary probes (protocol family, broker footprint) so the synthesize pass can compose an answer the wake-up coordinator can deliver.",
          "scope_in": [
            "MQTT broker family (Mosquitto, EMQ X, HiveMQ) — protocol surface + QoS levels",
            "NATS server family (NATS Core, JetStream) — subject hierarchy + persistence story",
            "ARM-device benchmarks for both"
          ],
          "scope_out": [
            "MQTT/NATS bridge implementations — out of scope for the comparison question",
            "Cloud-only deployment patterns — user asked about edge"
          ],
          "epics": [
            "E1 — Protocol surface: pub/sub vs request/reply, QoS levels, retained messages",
            "E2 — Footprint: memory + binary size on constrained ARM (Raspberry Pi class)",
            "E3 — Latency: round-trip benchmarks on constrained hardware"
          ]
        }

  - tool_call:
      name: decide
      arguments_json: |
        {
          "action": "gather",
          "reason": "Plan emitted: three epics scope the comparison cleanly (protocol surface / footprint / latency). The GATHER phase should probe published benchmarks and protocol docs; SYNTHESIZE will compose the answer the wake-up coordinator delivers to the user."
        }

  # ---------- Loop B: researcher-gather-1 (rule 04 spawn) ----------

  - tool_call:
      name: read_loop_result
      arguments_json: |
        {
          "loop_id": "plan-loop-A"
        }

  - tool_call:
      name: query_entity
      arguments_json: |
        {
          "entity_id": "mqtt.protocol.spec"
        }

  - tool_call:
      name: decide
      arguments_json: |
        {
          "action": "synthesize",
          "reason": "Corpus probes returned what we need to compose the comparison. Forwarding to SYNTHESIZE — the artifact will enumerate actors and integration points, letting the wake-up coordinator deliver a substantive answer."
        }

  # ---------- Loop C: researcher-synthesize-1 (rule 05/phase-transition spawn) — DRIFT ----------

  - tool_call:
      name: read_loop_result
      arguments_json: |
        {
          "loop_id": "gather-loop-B"
        }

  - tool_call:
      name: emit_research_artifact
      arguments_json: |
        {
          "revision": 1,
          "test_harness": "mqtt-vs-nats-bench",
          "title": "MQTT vs NATS for IoT edge",
          "actors": [
            {"name": "MQTT broker", "role": "TCP-based pub/sub broker with three QoS levels (0/1/2); reference implementation Mosquitto runs in <2MB resident on constrained ARM"},
            {"name": "NATS server", "role": "Subject-hierarchy pub/sub plus request-reply; JetStream variant adds persistence; binary ~10MB on ARM, runtime memory ~30MB"},
            {"name": "Constrained ARM device", "role": "Raspberry Pi-class hardware (1GHz CPU, 256MB-1GB RAM) hosting the edge agent"}
          ],
          "integration_points": [
            {"from": "MQTT broker", "to": "Constrained ARM device", "data": "QoS-tagged pub/sub messages over TCP", "direction": "read"},
            {"from": "NATS server", "to": "Constrained ARM device", "data": "subject-hierarchy pub/sub + request-reply over TCP", "direction": "read"}
          ],
          "tasks": [
            "Choose MQTT for sub-millisecond latency budgets on minimal-footprint hardware where pub/sub alone is sufficient",
            "Choose NATS when the workload mixes pub/sub + request-reply, and edge hardware has >256MB RAM"
          ],
          "addressed_gaps": [
            "Question scope (latency + footprint on ARM) is answered with concrete published numbers — no further gather pass needed"
          ],
          "open_gaps": [],
          "substrate_mutations": []
        }

  - tool_call:
      name: decide
      arguments_json: |
        {
          "action": "architect",
          "reason": "Artifact rev 1 emitted with the comparison data the user asked for. Forwarding to ARCHITECT for spec-mode dev because the comparison conclusion implies we should also build a thin edge-agent prototype that picks the better broker by default. DRIFT NOTE: this is a research_only chain (no build artifact required); decide(architect) is the wrong terminal — chainstall will reject this with mode_mismatch and the coordinator will re-frame with a sharper research_only directive."
        }

  # ---------- Loop D: coordinator-2 (rule 05/chain-stall spawn) ----------

  - tool_call:
      name: read_loop_result
      arguments_json: |
        {
          "loop_id": "synthesize-loop-C"
        }

  - tool_call:
      name: decide
      arguments_json: |
        {
          "action": "delegate_research",
          "reason": "Re-dispatching as research_only. The prior researcher-synthesize drifted to decide(architect) under a research_only chain — chainstall rejected with mode_mismatch. This retry MUST stay research_only: emit the research artifact and terminate at reviewer-research(approved). No architect / spec / build phases. The comparison answer is the goal; if build follow-up is warranted the user can ask separately."
        }

  # ---------- Loop A': researcher-plan-2 (rule 01 spawn from coord-2) ----------

  - tool_call:
      name: emit_plan
      arguments_json: |
        {
          "revision": 1,
          "title": "MQTT vs NATS for IoT edge — research plan (retry)",
          "goal": "Compare MQTT and NATS for IoT edge deployments — synthesize a research artifact suitable for direct user reply.",
          "context": "Retry pass after a stall-recovery cycle. The coordinator's reason field is explicit that this chain is research_only — synthesize must terminate at emit. Plan scoped accordingly.",
          "scope_in": [
            "MQTT broker family and NATS server family — feature surfaces relevant to edge",
            "Footprint + latency on constrained ARM (Raspberry Pi class)"
          ],
          "scope_out": [
            "Build artifacts (no architect / spec / build phases — research_only chain)",
            "Cloud-only deployment patterns"
          ],
          "epics": [
            "E1 — Protocol surface (pub/sub + request/reply, QoS levels)",
            "E2 — Footprint + latency on ARM",
            "E3 — Synthesis: actors + integration points + decision criteria"
          ]
        }

  - tool_call:
      name: decide
      arguments_json: |
        {
          "action": "gather",
          "reason": "Plan emitted (retry pass). Forwarding to GATHER for the corpus probes. Synthesize will compose the artifact and terminate at emit — no architect."
        }

  # ---------- Loop B': researcher-gather-2 (rule 04 spawn) ----------

  - tool_call:
      name: read_loop_result
      arguments_json: |
        {
          "loop_id": "plan-loop-A-retry"
        }

  - tool_call:
      name: query_entity
      arguments_json: |
        {
          "entity_id": "mqtt.protocol.spec"
        }

  - tool_call:
      name: decide
      arguments_json: |
        {
          "action": "synthesize",
          "reason": "Corpus probes complete. Forwarding to SYNTHESIZE — the artifact will be composed and decide(emit) will terminate the chain at reviewer-research."
        }

  # ---------- Loop C': researcher-synthesize-2 (rule 05/phase-transition spawn) — CORRECT ----------

  - tool_call:
      name: read_loop_result
      arguments_json: |
        {
          "loop_id": "gather-loop-B-retry"
        }

  - tool_call:
      name: emit_research_artifact
      arguments_json: |
        {
          "revision": 1,
          "test_harness": "mqtt-vs-nats-bench",
          "title": "MQTT vs NATS for IoT edge",
          "actors": [
            {"name": "MQTT broker", "role": "TCP-based pub/sub broker with three QoS levels (0/1/2); reference implementation Mosquitto runs in <2MB resident on constrained ARM"},
            {"name": "NATS server", "role": "Subject-hierarchy pub/sub plus request-reply; JetStream variant adds persistence; binary ~10MB on ARM, runtime memory ~30MB"},
            {"name": "Constrained ARM device", "role": "Raspberry Pi-class hardware (1GHz CPU, 256MB-1GB RAM) hosting the edge agent"}
          ],
          "integration_points": [
            {"from": "MQTT broker", "to": "Constrained ARM device", "data": "QoS-tagged pub/sub messages over TCP", "direction": "read"},
            {"from": "NATS server", "to": "Constrained ARM device", "data": "subject-hierarchy pub/sub + request-reply over TCP", "direction": "read"}
          ],
          "tasks": [
            "Choose MQTT for sub-millisecond latency budgets on minimal-footprint hardware where pub/sub alone is sufficient",
            "Choose NATS when the workload mixes pub/sub + request-reply, and edge hardware has >256MB RAM"
          ],
          "addressed_gaps": [
            "Question scope (latency + footprint on ARM) is answered with concrete published numbers — no further gather pass needed"
          ],
          "open_gaps": [],
          "substrate_mutations": []
        }

  - tool_call:
      name: decide
      arguments_json: |
        {
          "action": "emit",
          "reason": "Artifact rev 1 emitted (retry pass). Three actors, two integration points, two task-shaped recommendations. open_gaps empty. Forwarding to reviewer-research via decide(emit) — the research_only terminal. NO architect phase, per the coordinator's stall-recovery directive."
        }

  # ---------- Loop D': reviewer-research (rule 01a spawn, approves) ----------

  - tool_call:
      name: read_loop_result
      arguments_json: |
        {
          "loop_id": "synthesize-loop-C-retry"
        }

  - tool_call:
      name: decide
      arguments_json: |
        {
          "action": "approved",
          "reason": "Checklist satisfied on the retry: three actors with role text, two integration points with direction, two decomposable task-shaped recommendations, all artifact fields well-formed. open_gaps empty. addressed_gaps closes the question scope. Substrate untouched. Research arc terminates here — chain.TerminalStamper will fire and rule 04a will spawn the wake-up coordinator to deliver the answer."
        }

  # ---------- Loop E: coordinator-3 (rule 04a spawn — Slice 1c return path) ----------

  - tool_call:
      name: read_loop_result
      arguments_json: |
        {
          "loop_id": "reviewer-loop-D-retry"
        }

  - tool_call:
      name: decide
      arguments_json: |
        {
          "action": "respond_direct",
          "reason": "For IoT edge deployments on constrained ARM devices, MQTT has the edge on raw latency and footprint (Mosquitto runs under 2MB resident; QoS 0 publishes complete in well under a millisecond on Raspberry Pi-class hardware). NATS wins when you need both pub/sub AND request-reply in the same broker — its subject hierarchy is more expressive and JetStream gives you persistence — but it costs ~30MB of resident memory which matters on the tightest devices. Pick MQTT if pub/sub alone is sufficient and memory is tight; pick NATS when the workload needs request-reply or you have >256MB RAM to spare. (The chain initially drifted toward architect mode — a stall-recovery cycle re-framed and converged on this research-only answer.)"
        }
