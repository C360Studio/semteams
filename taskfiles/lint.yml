version: '3'

tasks:
  default:
    desc: Run Go vet and formatting checks; report revive warnings
    cmds:
      - go vet ./...
      - |
        unformatted=$(gofmt -l cmd test)
        if [ -n "$unformatted" ]; then
          echo "The following Go files need formatting:"
          echo "$unformatted"
          exit 1
        fi
      - revive -config revive.toml -formatter friendly ./...
