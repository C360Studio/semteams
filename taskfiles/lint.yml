version: '3'

tasks:
  default:
    desc: Run Go vet, worktree-safe gofmt check, go.mod tidy check, revive, cleanup-roots check, and fixed-port test guard
    cmds:
      - scripts/gopkgs.sh go vet ./...
      - |
        files=$(git ls-files --cached --others --exclude-standard -- '*.go' ':!docs/sponsor-packages/**')
        echo "gofmt: $(printf '%s\n' "$files" | grep -c . || true) Go file(s)"
        unformatted=""
        [ -z "$files" ] || unformatted=$(gofmt -l $files)
        if [ -n "$unformatted" ]; then
          echo "The following Go files need formatting:"
          echo "$unformatted"
          exit 1
        fi
      - go mod tidy -diff
      - scripts/gopkgs.sh revive -config revive.toml -formatter friendly ./...
      - scripts/cleanup-roots-check.sh
      - scripts/lint-test-ports.sh
      - scripts/lint-test-ports_fixture_test.sh
