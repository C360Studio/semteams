version: "3"

tasks:
  generate:
    desc: Generate component schemas and OpenAPI spec
    cmds:
      - mkdir -p schemas specs
      - go run ./cmd/openapi-generator -out ./schemas -openapi ./specs/openapi.v3.yaml
      - echo "Schemas and OpenAPI spec generated"

  validate:
    desc: Validate generated schemas against meta-schema
    cmds:
      - echo "Schema validation not yet implemented"

  check-changes:
    desc: Check for modified or untracked generated schemas
    cmds:
      - |
        schema_status=$(git status --porcelain --untracked-files=all -- schemas specs/openapi.v3.yaml)
        if [ -n "$schema_status" ]; then
          echo "Schema/OpenAPI files changed! Run 'task schema:generate' and commit:"
          echo "$schema_status"
          exit 1
        fi

  docs:
    desc: Serve OpenAPI docs at http://localhost:8081
    cmds:
      - npx @redocly/cli preview-docs specs/openapi.v3.yaml --port 8081
