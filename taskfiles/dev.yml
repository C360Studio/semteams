version: '3'

# Development workflow tasks for local development
# These tasks help new developers get started quickly

tasks:
  # NATS Server Management
  nats:start:
    desc: Start NATS server for local development
    cmds:
      - |
        echo "[DEV] Starting NATS server with JetStream..."
        if docker ps -a --format '{{.Names}}' | grep -q '^semstreams-nats$'; then
          docker start semstreams-nats 2>/dev/null || true
        else
          docker run -d --name semstreams-nats -p 4222:4222 -p 8222:8222 nats:2.12-alpine -js -m 8222
        fi
        echo "[OK] NATS running at nats://localhost:4222"
        echo "     Monitor at http://localhost:8222"

  nats:stop:
    desc: Stop local NATS server
    cmds:
      - |
        echo "[DEV] Stopping NATS server..."
        docker stop semstreams-nats 2>/dev/null || true
        echo "[OK] NATS stopped"

  nats:clean:
    desc: Stop and remove local NATS server (clears all data)
    cmds:
      - |
        echo "[DEV] Removing NATS server..."
        docker stop semstreams-nats 2>/dev/null || true
        docker rm semstreams-nats 2>/dev/null || true
        echo "[OK] NATS removed"

  nats:status:
    desc: Check NATS server status
    cmds:
      - |
        if docker ps --format '{{.Names}}' | grep -q '^semstreams-nats$'; then
          echo "[OK] NATS is running"
          docker ps --filter name=semstreams-nats --format "table {{.Status}}\t{{.Ports}}"
        else
          echo "[--] NATS is not running"
          echo "     Start with: task dev:nats:start"
        fi

  # Combined Development Workflow
  start:
    desc: Start NATS + SemTeams backend with the production bootstrap config
    deps:
      - nats:start
    cmds:
      - task build
      - |
        echo ""
        echo "[DEV] Starting SemTeams with configs/flow-bootstrap.json..."
        echo ""
        echo "============================================"
        echo "  SemTeams Backend"
        echo "============================================"
        echo ""
        echo "  Health:       http://localhost:8080/readyz"
        echo "  Components:   http://localhost:8080/api/components"
        echo "  Messages:     http://localhost:8080/message-logger/entries?limit=20"
        echo "  Metrics:      http://localhost:9090/metrics"
        echo ""
        echo "  Debug commands:"
        echo '    task dev:messages   # View recent messages'
        echo '    task dev:trace      # Trace message flow'
        echo '    task dev:stats      # View statistics'
        echo ""
        echo "  Press Ctrl+C to stop"
        echo "============================================"
        echo ""
      - ./bin/semteams --config configs/flow-bootstrap.json

  stop:
    desc: Stop SemTeams and NATS
    cmds:
      - |
        echo "[DEV] Stopping SemTeams..."
        pkill -f 'bin/semteams' 2>/dev/null || true
      - task: nats:stop
      - echo "[OK] All stopped"

  # Prerequisites Check
  check:prerequisites:
    desc: Verify development environment is ready
    cmds:
      - |
        echo "Checking development prerequisites..."
        echo ""
        echo "Go:"
        go version || (echo "  [FAIL] Go not found. Install from https://go.dev/dl/" && exit 1)
        echo ""
        echo "Docker:"
        docker --version || (echo "  [FAIL] Docker not found. Install from https://docker.com" && exit 1)
        docker info > /dev/null 2>&1 || (echo "  [FAIL] Docker daemon not running. Start Docker Desktop." && exit 1)
        echo ""
        echo "Task:"
        task --version || (echo "  [FAIL] Task not found. Install with: go install github.com/go-task/task/v3/cmd/task@latest" && exit 1)
        echo ""
        echo "Node:"
        node --version || (echo "  [FAIL] Node not found. Install Node.js 22+ for UI and Playwright journeys." && exit 1)
        echo ""
        echo "Caddy:"
        if caddy version > /dev/null 2>&1; then
          caddy version
        else
          echo "  [WARN] Caddy not found. Required for the live local UI path (task dev:research)."
          echo "         Install on macOS with: brew install caddy"
        fi
        echo ""
        echo "============================================"
        echo "  All prerequisites OK!"
        echo "  Run 'task ui:test:e2e:agentic:demo-mvp' for a no-key proof"
        echo "  Run 'task dev:research' for the live chat UI"
        echo "============================================"

  # Quick test data sender
  send:
    desc: Send a legacy graph-tier sensor reading (not used by flow-bootstrap)
    cmds:
      - |
        echo "[LEGACY] This helper targets the retired hello-world graph-tier example."
        echo "         It is not part of the SemTeams bootstrap or demo MVP path."
        echo '{"device_id":"sensor-001","type":"temperature","reading":23.5,"unit":"celsius","location":"warehouse-7","zone_type":"cold-storage"}' | nc -u localhost 14550
        echo "[OK] Sent test sensor reading"
        echo '     Query with: curl -s http://localhost:8084/graphql -H "Content-Type: application/json" -d '"'"'{"query":"{ entitiesByPrefix(prefix: \"demo\", limit: 10) { entityIds } }"}'"'"''

  # Debugging Tools
  messages:
    desc: View recent messages flowing through the system
    cmds:
      - |
        echo "=== Recent Messages ==="
        curl -s "http://localhost:8080/message-logger/entries?limit=20" | jq '.[] | {timestamp: .timestamp, subject: .subject, type: .message_type, trace: .trace_id}' 2>/dev/null || echo "SemTeams not running. Start with: task dev:start or task dev:research"

  stats:
    desc: View message flow statistics
    cmds:
      - |
        echo "=== Message Statistics ==="
        curl -s "http://localhost:8080/message-logger/stats" | jq . 2>/dev/null || echo "SemTeams not running"
        echo ""
        echo "=== JetStream Streams ==="
        curl -s "http://localhost:8222/jsz?streams=1" | jq '[.account_details[0].stream_detail[] | {name, messages: .state.messages}]' 2>/dev/null || echo "NATS not running"

  trace:
    desc: Trace a message through the pipeline (use TRACE_ID env var)
    cmds:
      - |
        if [ -z "$TRACE_ID" ]; then
          echo "Getting most recent trace ID..."
          TRACE_ID=$(curl -s "http://localhost:8080/message-logger/entries?limit=1" | jq -r '.[0].trace_id' 2>/dev/null)
        fi
        if [ -z "$TRACE_ID" ] || [ "$TRACE_ID" = "null" ]; then
          echo "No messages found. Send some data first: task dev:send"
          exit 1
        fi
        echo "=== Trace: $TRACE_ID ==="
        curl -s "http://localhost:8080/message-logger/trace/$TRACE_ID" | jq '.entries[] | {timestamp: .timestamp, subject: .subject, type: .message_type}' 2>/dev/null

  watch:entities:
    desc: Watch entity state changes in real-time (Ctrl+C to stop)
    cmds:
      - |
        echo "Watching ENTITY_STATES bucket for changes... (Ctrl+C to stop)"
        curl -N "http://localhost:8080/message-logger/kv/ENTITY_STATES/watch" 2>/dev/null || echo "SemTeams not running"

  kv:
    desc: Query a KV bucket (use BUCKET and PATTERN env vars)
    cmds:
      - |
        BUCKET=${BUCKET:-ENTITY_STATES}
        PATTERN=${PATTERN:-*}
        echo "=== KV Bucket: $BUCKET (pattern: $PATTERN) ==="
        curl -s "http://localhost:8080/message-logger/kv/$BUCKET?pattern=$PATTERN&limit=20" | jq '.entries[] | {key: .key, revision: .revision}' 2>/dev/null || echo "SemTeams not running"

  research:
    desc: Start semteams against the production bootstrap config (real LLM — requires .env with API keys)
    summary: |
      Boots the full stack against the ADR-042 production bootstrap:
      NATS + semteams backend (configs/flow-bootstrap.json) + UI.
      The bootstrap config wires the substrate singletons + live
      category rule packs + coordinator persona; the coordinator routes
      prose asks via decide(action=...). The default endpoint is
      gemini-flash. API keys are loaded from .env via the Taskfile
      dotenv directive.

      Usage:
        task dev:research
        # Open http://localhost:3001
        # Type a research question in the chat bar
    preconditions:
      - sh: command -v node
        msg: "Node.js 22+ is required for the live UI path. Install Node, then retry task dev:research."
      - sh: command -v npm
        msg: "npm is required for the live UI path. Install Node.js 22+, then retry task dev:research."
      - sh: command -v caddy
        msg: "Caddy is required for the live local UI proxy. Install with: brew install caddy"
    cmds:
      - task: nats:start
      - task build
      - defer: { task: stop }
      - |
        echo ""
        echo "Starting semteams against the production bootstrap..."
        echo "Config: configs/flow-bootstrap.json"
        echo "Default model endpoint: gemini-flash"
        echo ""
        ./bin/semteams --config configs/flow-bootstrap.json &
        SEMTEAMS_PID=$!
        echo "Backend PID: $SEMTEAMS_PID (kill with: task dev:stop)"
        echo ""
        echo "Waiting for backend health..."
        for i in $(seq 1 30); do
          if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
            echo "Backend ready!"
            break
          fi
          sleep 1
        done
        echo ""
        echo "Starting UI (Caddy + Vite)..."
        echo "Open http://localhost:3001 in your browser"
        echo ""
        cd ui && task dev:connect
