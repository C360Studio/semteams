# Agentic E2E Test Environment for SemTeams UI
#
# Runs a FULL agentic stack for Playwright journey tests:
#   NATS + semteams backend (agentic config) + mock-llm (fixture-driven)
#   + UI + Caddy reverse proxy
#
# This is distinct from docker-compose.e2e.yml, which uses protocol-flow.json
# and has no mock-llm service. Journey tests need agentic.json's components
# (teams-dispatch, teams-loop, teams-tools, teams-governance) and
# the mock-llm for deterministic LLM responses.
#
# Container names and networks are prefixed `semteams-ui-agentic-*` so this
# stack can run alongside docker-compose.e2e.yml without collision. Host
# port defaults to 3100 (vs 3000 for the non-agentic stack).
#
# Usage (via Playwright):
#   npm run test:e2e:agentic      # loads playwright.agentic.config.ts
#
# Usage (manual, with a specific fixture):
#   FIXTURE=tool-approval-gate.yaml \
#     docker compose -f docker-compose.agentic-e2e.yml up --build
#
# Passing FIXTURE env var mounts test/fixtures/journeys/$FIXTURE into the
# mock-llm container at /fixtures/$FIXTURE and starts the server with
# --fixture=/fixtures/$FIXTURE so responses are deterministic for that
# journey. If FIXTURE is unset, mock-llm starts with its built-in defaults.

services:
  # NATS Server with JetStream
  nats:
    image: nats:2.10-alpine
    container_name: semteams-ui-agentic-nats
    command: ["-js", "-sd", "/data", "-m", "8222", "--name", "ui-agentic-nats"]
    volumes:
      - nats-agentic-data:/data
    networks:
      - agentic-net
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8222/healthz",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  # Mock OpenAI Server (deterministic responses via YAML fixture)
  #
  # The command line wraps the binary in sh so we can conditionally append
  # `--fixture=/fixtures/$FIXTURE` based on whether the FIXTURE env var is
  # set. Without the wrapper, docker-compose env var interpolation would
  # produce `--fixture=/fixtures/` (empty suffix) when FIXTURE is unset,
  # and mock-llm would fail trying to load an empty path.
  mock-llm:
    build:
      context: ${BACKEND_CONTEXT:-..}
      dockerfile: test/e2e/mock/Dockerfile
    container_name: semteams-ui-agentic-mock-llm
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -n "$$FIXTURE" ]; then
          exec /app/mock-openai --port 8080 --agntcy-port 8081 --fixture=/fixtures/$$FIXTURE
        else
          exec /app/mock-openai --port 8080 --agntcy-port 8081
        fi
    environment:
      - FIXTURE=${FIXTURE:-}
    volumes:
      - ${BACKEND_CONTEXT:-..}/test/fixtures/journeys:/fixtures:ro
    networks:
      - agentic-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # SemTeams backend with agentic components enabled.
  #
  # Uses configs/e2e-flow-bootstrap.json (mock-LLM clone of the production
  # bootstrap; points at `http://mock-llm:8080/v1` for the model registry).
  # Per-task AGENTIC_CONFIG overrides target other surviving configs.
  backend:
    build:
      context: ${BACKEND_CONTEXT:-..}
      dockerfile: ${BACKEND_DOCKERFILE:-docker/Dockerfile}
      target: production
    container_name: semteams-ui-agentic-backend
    depends_on:
      nats:
        condition: service_healthy
      mock-llm:
        condition: service_healthy
      # ADR-042 MVP-7 follow-up sweep (2026-05-19): sandbox is now
      # always-warm. The dev-via-spec builder arc retired, but the
      # framework's BashExecutor reads SANDBOX_URL once at construction
      # and dispatches every bash call into the sandbox — research-pack
      # roles use bash too (e.g. reviewer-research cats the synthesize
      # artifact). required:true so the backend doesn't race past a
      # cold sandbox and silently fall back to local-exec, which would
      # lose ADR-032 isolation.
      sandbox:
        condition: service_healthy
    environment:
      - SEMSTREAMS_NATS_URLS=nats://nats:4222
      - SEMSTREAMS_LOG_LEVEL=debug
      - AGENTIC_LLM_URL=http://mock-llm:8080/v1
      # R2 source-acquisition tool — registers add_source_repo and
      # publishes to graph.ingest.add.research. Inert for journeys
      # that don't list the tool in agentic-tools.allowed_tools.
      - SEMTEAMS_SEMSOURCE_NAMESPACES=research
      - SEMTEAMS_SEMSOURCE_DEFAULT_NAMESPACE=research
      # Upstream BashExecutor reads SANDBOX_URL at boot and routes
      # every bash call through the sandbox container. Always set under
      # the always-warm posture (see depends_on above).
      - SANDBOX_URL=http://sandbox:8090
      # Cloud-LLM API keys for real-LLM smokes (smoke #6 runs
      # claude-haiku against flow-bootstrap.json). Empty defaults
      # keep mock-llm journeys unaffected — the model_registry
      # endpoints they use don't reference these env vars.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Brave Search key for the framework's web_search executor.
      # Unlike the cloud-LLM keys above, BRAVE_SEARCH_API_KEY gates
      # which web_search executor is REGISTERED at boot (real vs
      # stub) — so passing it unconditionally would make mock-LLM
      # journeys silently hit real Brave + break determinism. We
      # use a different env-var name on the compose side (BACKEND_BRAVE_SEARCH_API_KEY)
      # so individual tasks opt in by mapping it; mock-LLM tasks
      # don't set it and the backend boots with the stub. The
      # real-LLM smoke6 task forwards the host's
      # BRAVE_SEARCH_API_KEY into BACKEND_BRAVE_SEARCH_API_KEY.
      - BRAVE_SEARCH_API_KEY=${BACKEND_BRAVE_SEARCH_API_KEY:-}
      # emit-tool output dirs land in the shared agentic-artifacts
      # volume so the sandbox can `cat /artifacts/<kind>/<slug>.md`
      # from any role. The dev-via-spec artifact dir
      # (SEMTEAMS_DEVVIASPEC_ARTIFACT_DIR), workspace-root
      # (SEMTEAMS_WORKSPACE_ROOT) for the evidence preprocessor, and
      # harness catalog path (SEMTEAMS_HARNESS_CATALOG_PATH) retired
      # alongside their consumers in the ADR-042 MVP-7 follow-up sweep.
      - SEMTEAMS_RESEARCH_ARTIFACT_DIR=/artifacts/research
      - SEMTEAMS_PLAN_DIR=/artifacts/plans
    volumes:
      - ${BACKEND_CONTEXT:-..}/configs/${AGENTIC_CONFIG:-e2e-flow-bootstrap.json}:/etc/semstreams/config.json:ro
      - ${BACKEND_CONTEXT:-..}/testdata:/data/testdata:ro
      # Shared artifacts volume — backend writes emit_*_artifact markdown
      # here; sandbox mounts the SAME volume at /artifacts ro so bash-
      # equipped agents can read the rendered artifacts. The sandbox-
      # workspaces ro mount (for the evidence preprocessor) retired in
      # the ADR-042 MVP-7 follow-up sweep alongside the preprocessor.
      - agentic-artifacts:/artifacts
    networks:
      - agentic-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  # SemTeams Builder Sandbox (R3.6.1, ADR-032). Upstream's
  # BashExecutor routes through this container via SANDBOX_URL when
  # the agent loop calls the `bash` tool. Hardened posture mirrors
  # docker/compose/sandbox.yml (the standalone dev compose).
  #
  # Inlined rather than `include:`'d on purpose: Compose include would
  # couple the e2e stack's network (agentic-net) and per-journey
  # lifecycle to the standalone compose file's. Hardening posture
  # changes (cap_drop, tmpfs, etc.) MUST land in both places.
  #
  # ADR-042 MVP-7 follow-up sweep (2026-05-19): always-warm. Profile
  # gating retired — even research-pack roles use bash (cat the
  # synthesize artifact in the reviewer-research persona), and we
  # can't know at boot which prompts will arrive. Backend's
  # depends_on waits for the sandbox so the BashExecutor doesn't
  # race past a cold dispatch URL.
  sandbox:
    image: semteams-sandbox:dev
    build:
      context: ${BACKEND_CONTEXT:-..}
      dockerfile: docker/sandbox.Dockerfile
    container_name: semteams-ui-agentic-sandbox
    # Default to DooD (Docker-out-of-Docker, ADR-034 §addendum #2) so
    # testcontainer-flavored chains (process-local-testcontainer
    # Approach in ADR-034's verification class table) can spawn sibling
    # containers on the host's daemon. Operators who want an
    # isolation-only sandbox set SANDBOX_DOCKER_MODE=none to skip the
    # socket mount semantics; the bind mount is harmless when chains
    # don't use it.
    environment:
      - SANDBOX_DOCKER_MODE=${SANDBOX_DOCKER_MODE:-dood}
    # --docker-mode-strict turns a missing socket mount into a boot
    # failure rather than warn-and-continue. Compose-driven stacks
    # always supply the mount below, so a missing socket here is a
    # configuration regression, not an intentional dev-mode toggle —
    # fail-fast surfaces it before the first chain hits EACCES.
    command:
      [
        "--addr",
        ":8090",
        "--workspace",
        "/workspace",
        "--docker-mode-strict",
      ]
    # group_add wires the host docker socket's GID so the unprivileged
    # `sandbox` user (uid 1001, no docker group) gets supplementary
    # group access to the mode-0660 socket. Default 0 matches Docker
    # Desktop on macOS where the bind-mounted socket appears as
    # root:root inside containers; Linux dev hosts override via
    # SANDBOX_DOCKER_SOCK_GID=$(stat -c '%g' /var/run/docker.sock).
    # Keeps cap_drop ALL + USER sandbox hardening intact — only
    # supplementary-group membership widens, which is the minimum
    # required for socket reachability.
    group_add:
      - "${SANDBOX_DOCKER_SOCK_GID:-0}"
    volumes:
      - sandbox-agentic-workspaces:/workspace
      # Shared artifacts volume — ro view of the rw mount on the backend
      # container. Bash-equipped non-builder agents read rendered emit_*
      # artifacts here without crossing the ADR-033 D2 workspace boundary.
      - agentic-artifacts:/artifacts:ro
      - sandbox-agentic-caches-m2:/home/sandbox/.m2
      - sandbox-agentic-caches-go:/go/pkg/mod
      - sandbox-agentic-caches-npm:/home/sandbox/.npm
      - sandbox-agentic-caches-gradle:/home/sandbox/.gradle
      # Host docker socket bind mount — DooD trust boundary delta per
      # ADR-034 §addendum #2. Tests inside sandbox can spawn arbitrary
      # sibling containers on the host's Docker daemon. For the
      # single-tenant dev workflow targeted by smoke #7 this is
      # equivalent to running `mvn verify` on a developer laptop.
      # Multi-tenant production deployments need DinD or sysbox-runc
      # (R3.7.2.d′-dind follow-on); see ADR.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - agentic-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=512M
      - /var/tmp:size=256M
      - /run:size=64M
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 512M
    ulimits:
      nproc: 512
      nofile:
        soft: 4096
        hard: 8192
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8090/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  # SemSource (R2 of ADR-031). Headless mode — shares NATS with semteams,
  # subscribes to graph.ingest.add.{namespace} per
  # semsource/docs/adr/0003-programmatic-source-add-api.md, replies to
  # AddRequest. Only spawned for journeys that exercise the
  # add_source_repo tool — gate via the `semsource` profile so the
  # default tool-approval-gate / dev-research / etc. journeys skip the
  # extra boot cost.
  #
  # Image is pulled from ghcr (CI publishes on every main push). For
  # local development against an unreleased SemSource, override with
  # SEMSOURCE_IMAGE=local-tag and build it yourself, or point the
  # context at ../semsource and switch to a `build:` block.
  semsource:
    image: ${SEMSOURCE_IMAGE:-ghcr.io/c360studio/semsource:latest}
    container_name: semteams-ui-agentic-semsource
    profiles: ["semsource"]
    depends_on:
      nats:
        condition: service_healthy
      # Wait for the semteams backend to be healthy before booting —
      # backend's EnsureStreams provisions the GRAPH stream that
      # semsource's source-manifest publishes its manifest into. If
      # we boot in parallel, source-manifest publishes before the
      # stream exists and crashes with "no response from stream",
      # leaving the AddRequest subscription unregistered. With this
      # ordering the stream is guaranteed to exist before semsource
      # tries to publish.
      backend:
        condition: service_healthy
    environment:
      - NATS_URL=nats://nats:4222
      - SEMSOURCE_LOG_LEVEL=info
    volumes:
      - ${BACKEND_CONTEXT:-..}/test/fixtures/semsource/semsource-e2e.json:/etc/semsource/semsource.json:ro
      # doc-source processor expects a directory of docs, not a file
      # (semsource processor/doc-source/config.go: "Filesystem
      # directories to scan for documents"). Mount the seed/ dir; the
      # paths field in semsource-e2e.json points at the dir not the
      # file. Pre-fix smoke #14 ran with a file mount and the
      # doc-source-seed-md component crashed at boot ("path is not a
      # directory"), leaving semsource with zero working sources.
      - ${BACKEND_CONTEXT:-..}/test/fixtures/semsource/seed:/etc/semsource/seed:ro
    networks:
      - agentic-net
    healthcheck:
      # source-manifest binds an HTTP server at the configured port
      # (8090 in our test config) once it has registered the
      # graph.ingest.add subscription. A successful health probe means
      # it's ready to receive AddRequests on NATS.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8090/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  # SemInstruct — local instruct-tier inference (llama-server with a
  # baked GGUF). Profile-gated under `local-models` so existing
  # mock-llm journeys stay slim. R3.4's OSH demo binds it as the
  # destination for every internal-graph LLM capability
  # (community_summary, anomaly_review, summarization, etc.) per
  # ADR-031 §addendum 2026-05-XX. The :qwen3-8b tag is deliberate —
  # graph-persisting capabilities are on the 8B floor to avoid
  # garbage in the substrate.
  seminstruct:
    image: ${SEMINSTRUCT_IMAGE:-ghcr.io/c360studio/seminstruct:qwen3-8b}
    container_name: semteams-ui-agentic-seminstruct
    profiles: ["local-models"]
    environment:
      - MODEL_ALIAS=qwen3-8b
      - MODEL_REASONING=auto
      # MODEL_CONTEXT (-c) is divided across MODEL_PARALLEL slots.
      # Internal-graph capabilities (community_summary, anomaly_review)
      # send modest prompts (~2k); summarization can hit ~16k. We size
      # for the worst case + headroom: 32k total / 2 slots = 16k per
      # slot. Without this the image fell back to llama-server's 512
      # default and every call ≥512 tokens 400'd.
      - MODEL_CONTEXT=32768
      - MODEL_PARALLEL=2
      # MODEL_THREADS caps llama.cpp's OpenMP thread count. WITHOUT
      # this set, llama.cpp grabs all available host cores and
      # competes with sibling containers (semembed + sandbox + the
      # backend), oversubscribing CPU ~4× on a 12-core host (semspec
      # 2026-05 evidence). Docker's `cpus: 2` deploy limit caps
      # container CPU but llama.cpp's worker pool still launches with
      # whatever the kernel reports — MODEL_THREADS=2 makes the worker
      # pool match the cgroup cap. Keep these two values in sync.
      - MODEL_THREADS=2
    networks:
      - agentic-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 60s
    # 8GB matches llama.cpp's qwen3-8b Q4_K_M working set at
    # MODEL_CONTEXT=32768 + MODEL_PARALLEL=2 (~6GB resident + KV-cache
    # headroom). Without this cap, the seminstruct OOM kill order on a
    # contended host was unpredictable. cpus=2 mirrors semspec's
    # validated config (configs/docker/compose/e2e.yml).
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 8G

  # SemEmbed — local embedding-tier inference (fastembed-rs + ONNX).
  # Profile-gated under `local-models`. R3.4's OSH demo binds it as
  # the `embedding` capability so every new entity vector is local
  # rather than a cloud round-trip.
  semembed:
    image: ${SEMEMBED_IMAGE:-ghcr.io/c360studio/semembed:latest}
    container_name: semteams-ui-agentic-semembed
    profiles: ["local-models"]
    environment:
      - SEMEMBED_MODEL=Snowflake/snowflake-arctic-embed-s
    networks:
      - agentic-net
    # Probe the real embeddings endpoint, not /health. semspec caught
    # 2026-05-02: /health returns 200 ~939ms before the Rust HTTP
    # listener actually accepts POSTs, so service_healthy fired early
    # and graph-embedding's first 5 entities got connection-refused.
    # POST /v1/embeddings exercises the full handler chain — only
    # passes once the listener is genuinely serving requests.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -X POST http://localhost:8081/v1/embeddings
          -H 'Content-Type: application/json'
          -d '{"model":"Snowflake/snowflake-arctic-embed-s","input":"x"}'
          >/dev/null
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # 1 CPU is plenty for arctic-embed-s (small model, batch friendly).
    # semspec validated this on a 12-core host; the cap prevents the
    # Rust runtime from competing with seminstruct + the backend for
    # cores during entity-bulk-embed bursts.
    deploy:
      resources:
        limits:
          cpus: "1"

  # SemTeams UI (same as the non-agentic stack)
  ui:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: semteams-ui-agentic-ui
    environment:
      - NODE_ENV=development
      - BACKEND_HOST=backend:8080
    volumes:
      - ./src:/app/src
      - ./static:/app/static
      - ui-agentic-node-modules:/app/node_modules
    networks:
      - agentic-net

  # Caddy Reverse Proxy — reuses Caddyfile.e2e (already has
  # /teams-dispatch/* and /teams-loop/* routes with SSE flushing).
  caddy:
    image: caddy:2-alpine
    container_name: semteams-ui-agentic-caddy
    depends_on:
      - ui
    volumes:
      - ./Caddyfile.e2e:/etc/caddy/Caddyfile:ro
    environment:
      - BACKEND_HOST=backend:8080
      - GRAPHQL_HOST=backend:8082
    ports:
      - "${E2E_AGENTIC_UI_PORT:-3100}:3000"
    networks:
      - agentic-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  agentic-net:
    driver: bridge

volumes:
  nats-agentic-data:
    driver: local
  ui-agentic-node-modules:
    driver: local
  sandbox-agentic-workspaces:
    driver: local
  # Shared rendered-artifact volume. rw on backend (emit_*_artifact tools
  # write here), ro on sandbox (bash-equipped agents read here). Distinct
  # from sandbox-agentic-workspaces so ADR-033 D2 (measurer/measured
  # separation: backend never writes the workspace) is unaffected.
  agentic-artifacts:
    driver: local
  sandbox-agentic-caches-m2:
    driver: local
  sandbox-agentic-caches-go:
    driver: local
  sandbox-agentic-caches-npm:
    driver: local
  sandbox-agentic-caches-gradle:
    driver: local
