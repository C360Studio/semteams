version: "3"

# Note on env-var loading for real-LLM scenarios (smoke #7, osh-demo):
# Task forbids `dotenv:` in included Taskfiles. The project-root
# Taskfile already loads `.env` via its top-level `dotenv: ['.env']`
# directive; for real-LLM tasks here, invoke from the project root —
# e.g. `task ui:test:e2e:agentic:smoke7:run` — so the parent
# Taskfile's dotenv runs and ANTHROPIC_API_KEY etc. flow through.
# Direct `task ...` invocation from `ui/` skips that and the smoke7
# precondition will fail loud with remediation guidance.

env:
  # Pin the docker-compose project name so we don't collide with sibling
  # products (semspec, semdragons) whose compose files live in directories
  # also named `ui` and would otherwise share the default project name.
  # Without this, our `nats` service can be shadowed by another project's
  # nats container running concurrently.
  COMPOSE_PROJECT_NAME: '{{.COMPOSE_PROJECT_NAME | default "semteams-agentic"}}'

vars:
  # Backend configuration — the semteams backend
  BACKEND_URL: '{{.BACKEND_URL | default "http://localhost:8080"}}'

  # OpenAPI spec path — defaults to the semteams-generated spec at the repo root
  OPENAPI_SPEC_PATH: '{{.OPENAPI_SPEC_PATH | default "../specs/openapi.v3.yaml"}}'

  # Development ports (configurable to avoid collisions)
  DEV_UI_PORT: '{{.DEV_UI_PORT | default "3001"}}'
  DEV_VITE_PORT: '{{.DEV_VITE_PORT | default "5173"}}'

tasks:
  # === Type Generation ===

  generate-types:
    desc: Generate TypeScript types from the semteams OpenAPI spec
    cmds:
      - npx openapi-typescript {{.OPENAPI_SPEC_PATH}} --output src/lib/types/api.generated.ts
      - echo "✅ TypeScript types generated from {{.OPENAPI_SPEC_PATH}}"

  generate-types:from-url:
    desc: Generate TypeScript types from running backend
    cmds:
      - npx openapi-typescript {{.BACKEND_URL}}/openapi.yaml --output src/lib/types/api.generated.ts
      - echo "✅ TypeScript types generated from {{.BACKEND_URL}}/openapi.yaml"

  generate-types:check:
    desc: Check for uncommitted type changes (CI)
    cmds:
      - task: generate-types
      - git diff --exit-code src/lib/types/api.generated.ts || (echo "⚠️  Generated types changed! Run 'task generate-types' and commit."; exit 1)

  # === Development ===

  dev:
    desc: Start Vite dev server only (no proxy — use dev:connect or dev:full instead)
    cmds:
      - echo "Starting UI dev server..."
      - echo "Expecting backend at {{.BACKEND_URL}}"
      - npm run dev

  dev:connect:
    desc: Connect to any running SemStreams app (no Docker backend needed)
    summary: |
      Starts Caddy + Vite dev server, proxying API requests to a running
      SemStreams backend. No NATS, no Docker build — just point and go.

      Examples:
        task dev:connect                                  # localhost:8080
        BACKEND_HOST=myapp.local:8080 task dev:connect    # remote host
        BACKEND_HOST=10.0.1.5:8080 GRAPHQL_HOST=10.0.1.5:8082 task dev:connect
    vars:
      BACKEND_HOST: '{{.BACKEND_HOST | default "localhost:8080"}}'
      GRAPHQL_HOST: '{{.GRAPHQL_HOST | default .BACKEND_HOST | default "localhost:8080"}}'
    env:
      BACKEND_HOST: "{{.BACKEND_HOST}}"
      GRAPHQL_HOST: "{{.GRAPHQL_HOST}}"
      UI_HOST: "localhost:{{.DEV_VITE_PORT}}"
      LISTEN_PORT: "{{.DEV_UI_PORT}}"
    deps:
      - task: dev:connect:check
        vars:
          BACKEND_HOST: "{{.BACKEND_HOST}}"
    cmds:
      - defer: { task: dev:connect:stop }
      - |
        echo "Connecting to SemStreams backend at {{.BACKEND_HOST}}"
        echo "GraphQL gateway at {{.GRAPHQL_HOST}}"
        echo ""
        echo "UI will be at http://localhost:{{.DEV_UI_PORT}}"
        echo ""
      - caddy start --config Caddyfile.dev
      - npm run dev -- --port {{.DEV_VITE_PORT}} --host
    preconditions:
      - sh: command -v caddy
        msg: "Caddy not found. Install with: brew install caddy"

  dev:connect:check:
    desc: Check if the backend is reachable
    internal: true
    vars:
      BACKEND_HOST: '{{.BACKEND_HOST | default "localhost:8080"}}'
    cmds:
      - |
        if curl -sf "http://{{.BACKEND_HOST}}/health" > /dev/null 2>&1; then
          echo "✅ Backend reachable at {{.BACKEND_HOST}}"
        else
          echo "⚠️  Backend at {{.BACKEND_HOST}} not responding — Caddy will retry"
        fi

  dev:connect:stop:
    desc: Stop the Caddy dev proxy
    internal: true
    cmds:
      - caddy stop 2>/dev/null || true

  # === Full Stack Development ===

  dev:backend:
    desc: Start backend infrastructure (NATS + backend) in foreground
    cmds:
      - echo "Starting backend infrastructure..."
      - echo "NATS will be at localhost:4222"
      - echo "Backend API will be at localhost:8080"
      - docker compose -f docker-compose.dev.yml up

  dev:backend:start:
    desc: Start backend infrastructure in background
    env:
      DEV_UI_PORT: "{{.DEV_UI_PORT}}"
      DEV_VITE_PORT: "{{.DEV_VITE_PORT}}"
    cmds:
      - docker compose -f docker-compose.dev.yml up -d
      - echo "✅ Backend infrastructure starting..."
      - echo "   Access UI at http://localhost:{{.DEV_UI_PORT}}"
      - echo "   Run 'task dev:backend:logs' to see logs"
      - echo "   Run 'task dev:backend:stop' to stop"

  dev:backend:stop:
    desc: Stop backend infrastructure
    cmds:
      - docker compose -f docker-compose.dev.yml down
      - echo "✅ Backend infrastructure stopped"

  dev:backend:logs:
    desc: View backend infrastructure logs
    cmds:
      - docker compose -f docker-compose.dev.yml logs -f

  dev:full:
    desc: Start full development stack (backend + frontend)
    env:
      DEV_UI_PORT: "{{.DEV_UI_PORT}}"
      DEV_VITE_PORT: "{{.DEV_VITE_PORT}}"
    cmds:
      - task: dev:backend:start
      - echo "Waiting for Caddy health check..."
      - |
        for i in $(seq 1 30); do
          if curl -s http://localhost:{{.DEV_UI_PORT}}/health > /dev/null 2>&1; then
            echo "✅ Backend ready!"
            break
          fi
          echo "   Waiting... ($i/30)"
          sleep 2
        done
      - echo ""
      - echo "📱 Open http://localhost:{{.DEV_UI_PORT}} in your browser"
      - echo ""
      - npm run dev -- --port {{.DEV_VITE_PORT}} --host

  dev:docker:
    desc: Start UI in Docker (backend at host.docker.internal:8080)
    cmds:
      - echo "Starting UI in Docker..."
      - docker compose up

  dev:with-caddy:
    desc: Start UI + Caddy in Docker (available at http://localhost:3000)
    cmds:
      - echo "Starting UI + Caddy..."
      - docker compose --profile caddy up

  # === Testing ===

  test:
    desc: Run unit tests
    cmds:
      - npm run test

  test:e2e:
    desc: Run all E2E journey specs (each with its own fixture and fresh stack)
    summary: |
      Runs every Playwright journey under e2e/agentic/ with the
      research-mvp mock-LLM fixture (the surviving ADR-042 MVP cut),
      tearing down the docker stack between runs.
    cmds:
      - task: test:e2e:agentic:research-mvp
      - task: test:e2e:agentic:create-change
      - task: test:e2e:agentic:create-change-recovery
      - task: test:e2e:agentic:dev-via-test
      - task: test:e2e:agentic:dev-via-test-replan
      - task: test:e2e:agentic:autoresearch
      - task: test:e2e:agentic:autoresearch-guardrails
      - task: test:e2e:agentic:coordinator-routing-matrix
      - task: test:e2e:agentic:sandbox-mvp
      - task: test:e2e:agentic:ops-agent
      - task: test:e2e:agentic:real-time-activity-stream
      - task: test:e2e:agentic:task-story-trace
      - task: test:e2e:agentic:action-chips
      - task: test:e2e:agentic:task-title-aliases
      - task: test:e2e:agentic:admin-flows-inventory
      - task: test:e2e:agentic:chain-drill-in
      - task: test:e2e:agentic:run-failed
      - task: test:e2e:agentic:run-failed-coordinator
      - task: test:e2e:agentic:run-failed-coordinator-inherit
      - task: test:e2e:agentic:ask-user-pause
      - task: test:e2e:agentic:clarification-resume
      - task: test:e2e:agentic:clarification-autonomous

  test:e2e:agentic:real-time-activity-stream:
    desc: Run the real-time-activity-stream journey
    vars:
      FIXTURE: real-time-activity-stream.yaml
      AGENTIC_CONFIG: e2e-flow-bootstrap.json
    cmds:
      - defer: { task: test:e2e:agentic:cleanup }
      - task: test:e2e:agentic:stack:up
        vars:
          FIXTURE: "{{.FIXTURE}}"
          AGENTIC_CONFIG: "{{.AGENTIC_CONFIG}}"
      - npx playwright test e2e/agentic/real-time-activity-stream.spec.ts

  test:e2e:agentic:ops-agent:
    desc: Run the ops-agent baseline journey (ADR-027 Phase 1 — 20 researcher loops + ops diagnostic)
    summary: |
      Drives 20 serial researcher loops against the mock LLM, then
      validates that the ops_observe_complete_loops rule spawns an
      ops-analyst loop whose completion cites docs/objectives/dev-research.md.

      Long-running: 20 mock researcher loops take ~100s. Set a generous
      timeout when running under CI.
    vars:
      FIXTURE: ops-agent-baseline.yaml
      AGENTIC_CONFIG: e2e-flow-bootstrap.json
    cmds:
      - defer: { task: test:e2e:agentic:cleanup }
      - task: test:e2e:agentic:stack:up
        vars:
          FIXTURE: "{{.FIXTURE}}"
          AGENTIC_CONFIG: "{{.AGENTIC_CONFIG}}"
      - npx playwright test e2e/agentic/ops-agent-baseline.spec.ts

  test:e2e:agentic:research-mvp:
    desc: Run the ADR-042 MVP-5 research-category mock-LLM journey
    summary: |
      One user prompt drives the full research-category arc end-to-end
      against the MVP roster:

        Loop 0  coordinator (dispatch)        decide(action="research")
        Loop A  researcher-research-plan      emit_plan + decide(gather)
        Loop B  researcher-research-gather    web_search + decide(synthesize)
        Loop C  researcher-research-synthesize emit_artifact + decide(emit)
        Loop D  reviewer-research             decide(approved)
        Loop E  coordinator (wake-up)         decide(respond_direct)

      Validates the substrate-plus-overlays architecture: a single
      category-keyed rule pack + named persona bundles wired through
      the framework's singleton substrate (MVP-1 through MVP-4 work
      shipped under PRs #172/#173/#174/#175).

      Six loops, thirteen mock-LLM round-trips. No approval gate, no
      recovery. Compose profiles: none; the sandbox container is
      always-warm under the ADR-042 MVP-7 follow-up posture.
    vars:
      FIXTURE: research-mvp.yaml
      AGENTIC_CONFIG: e2e-flow-bootstrap.json
    cmds:
      - defer: { task: test:e2e:agentic:cleanup }
      - task: test:e2e:agentic:stack:up
        vars:
          FIXTURE: "{{.FIXTURE}}"
          AGENTIC_CONFIG: "{{.AGENTIC_CONFIG}}"
      - npx playwright test e2e/agentic/research-mvp.spec.ts

  test:e2e:agentic:create-change:
    desc: Run the ADR-057 §D5 create_change-category mock-LLM journey
    summary: |
      One spec-authoring prompt drives the full create-change arc
      end-to-end against the e2e substrate:

        Loop 0  coordinator (dispatch)      decide(action="create_change")
        Loop A  author-create-change        emit_change + decide(drafted)
        Loop B  reviewer-create-change      decide(approved)
        Loop C  coordinator (wake-up)       decide(respond_direct)

      Validates the create-change pack (ADR-057 §D5) wired through the
      substrate-plus-overlays architecture: the coordinator classifies a
      spec-authoring ask, the author stamps a schema-valid change.<slug>.*
      via the REAL emit_change executor, the reviewer gate approves, and
      the coordinator wakes to deliver the reviewed change.

      Four loops, no sandbox (the author authors greenfield — its bash
      tool, for reading an existing openspec/ tree, is unused on this
      fixture). The emit_change payload's §D3/§D6 validity is pinned
      separately at `go test` time by
      test/contract/create_change_fixture_test.go.
    vars:
      FIXTURE: create-change.yaml
      AGENTIC_CONFIG: e2e-flow-bootstrap.json
    cmds:
      - defer: { task: test:e2e:agentic:cleanup }
      - task: test:e2e:agentic:stack:up
        vars:
          FIXTURE: "{{.FIXTURE}}"
          AGENTIC_CONFIG: "{{.AGENTIC_CONFIG}}"
      - npx playwright test e2e/agentic/create-change.spec.ts

  test:e2e:agentic:create-change:gemini-smoke:
    desc: Run the OpenSpec create_change real-LLM smoke on Gemini
    summary: |
      Real-LLM smoke for OpenSpec change 6.1. Derives a Gemini-only
      bootstrap config from configs/flow-bootstrap.json, sends a small
      spec-authoring prompt for POST /jobs Idempotency-Key support, and
      lets Playwright poll the live stack until the create-change arc
      settles:

        Loop 0  coordinator (dispatch)      decide(action="create_change")
        Loop A  author-create-change        emit_change + decide(drafted)
        Loop B  reviewer-create-change      decide(approved)
        Loop C  coordinator (wake-up)       render_openspec + respond_direct

      The assertions stay structural to keep spend low: route to
      create_change, emit a reviewed OpenSpec change, call render_openspec,
      complete the run, and attach the e2e report with Gemini model
      resolution plus artifact/tool evidence.

      Invoke from the project root so `.env` is auto-loaded by the parent
      Taskfile. GEMINI_API_KEY is required. The generated config removes
      Anthropic endpoints/fallbacks so this cannot green by exercising a
      non-Gemini fallback path.
    vars:
      AGENTIC_CONFIG: flow-bootstrap-gemini-smoke.gen.json
      COMPOSE_PROFILES: ""
    env:
      AGENTIC_CONFIG: "{{.AGENTIC_CONFIG}}"
      FIXTURE: ""
    preconditions:
      - sh: '[ -n "$GEMINI_API_KEY" ]'
        msg: "GEMINI_API_KEY is unset. Add it to the project-root .env (auto-loaded when invoking from root) or export it before running the Gemini create-change smoke."
    cmds:
      - 'echo "▶︎  create-change Gemini smoke starting; evidence will land in Playwright test-results/"'
      - 'echo "▶︎  pre-cleaning agentic stack volumes so stale graph/message state cannot satisfy smoke assertions"'
      - npm run test:e2e:cleanup
      - defer: { task: test:e2e:agentic:cleanup }
      - defer: rm -f ../configs/flow-bootstrap-gemini-smoke.gen.json
      - |
        jq '
          del(.model_registry.endpoints["claude-haiku"], .model_registry.endpoints["claude-sonnet"])
          | .model_registry.capabilities |= with_entries(
              .value.fallback = ((.value.fallback // []) | map(select(type == "string" and startswith("gemini"))))
            )
        ' ../configs/flow-bootstrap.json > ../configs/flow-bootstrap-gemini-smoke.gen.json
      - task: test:e2e:agentic:stack:up
        vars:
          FIXTURE: ""
          AGENTIC_CONFIG: "{{.AGENTIC_CONFIG}}"
          COMPOSE_PROFILES: "{{.COMPOSE_PROFILES}}"
      - npx playwright test e2e/agentic/create-change-gemini-smoke.spec.ts

  test:e2e:agentic:create-change-recovery:
    desc: Run the ADR-057 §D5 create_change REJECT-RECOVERY mock-LLM journey
    summary: |
      The companion to create-change (the happy approve path): drives the
      reviewer→coordinator recovery path (rule 04) that the happy path never
      reaches, giving the anchor_inherit recovery spawn live coverage
      (go-reviewer Nit 2):

        Loop 0  coordinator (dispatch)     decide(create_change)
        Loop A  author #1                  emit_change + decide(drafted)
        Loop B  reviewer #1                decide(rejected)        [rule 04]
        Loop C  coordinator (recovery)     decide(create_change)   [re-dispatch]
        Loop D  author #2                  emit_change + decide(drafted)
        Loop E  reviewer #2                decide(approved)
        Loop F  coordinator (wake-up)      decide(respond_direct)

      Proves: rule 04 spawns the recovery coordinator (which inherits the run
      anchor), it re-dispatches create_change (rule 01 fires again — no lineage
      fence) onto a FRESH run, and the re-dispatched arc reaches approved +
      completed (supersession; the original run stays executing — accepted v1
      recovery semantics, the reaper is deferred).
    vars:
      FIXTURE: create-change-recovery.yaml
      AGENTIC_CONFIG: e2e-flow-bootstrap.json
    cmds:
      - defer: { task: test:e2e:agentic:cleanup }
      - task: test:e2e:agentic:stack:up
        vars:
          FIXTURE: "{{.FIXTURE}}"
          AGENTIC_CONFIG: "{{.AGENTIC_CONFIG}}"
      - npx playwright test e2e/agentic/create-change-recovery.spec.ts

  test:e2e:agentic:run-failed:
    desc: Run the ADR-053 Phase 4a′ executing→failed run-transition journey
    summary: |
      A coordinator dispatches research, then the planner is wedged to a
      max_iterations failure (its fixture bucket serves a repeating
      non-terminal scratchpad call, so it never decides). The substrate must
      drive the run executing→failed:

        research/08-loop-failed-pause   → chain.paused.marker on the planner
        research/09-loop-failed-run-outcome → agent.run.outcome=failed (run)
        agent-run/04-executing-to-failed   → executing→failed

      Asserts agent.run.last_transition_from==executing to prove rule 04 drove
      it, NOT the upstream D3 dispatched→failed zombie guard. Two loops only;
      the planner never decided gather so nothing downstream spawns.
    vars:
      FIXTURE: run-failed.yaml
      AGENTIC_CONFIG: e2e-flow-bootstrap.json
    cmds:
      - defer: { task: test:e2e:agentic:cleanup }
      - task: test:e2e:agentic:stack:up
        vars:
          FIXTURE: "{{.FIXTURE}}"
          AGENTIC_CONFIG: "{{.AGENTIC_CONFIG}}"
      - npx playwright test e2e/agentic/run-failed.spec.ts

  test:e2e:agentic:run-failed-coordinator:
    desc: Run the ADR-053 Phase 4b-1a threaded-recovery-coordinator-failed journey
    summary: |
      The coordinator-failure sibling of run-failed. A dev_via_test plan-review
      gate rejects the plan, so rule 02e spawns a recovery coordinator THREADING
      run-loop-entity-id off the CBG's lineage (4b-1a anchor work). That recovery
      coordinator is wedged to a max_iterations failure (repeating non-terminal
      read_loop_result — it has no scratchpad), so the substrate must drive the
      run executing→failed via the LINEAGE anchor:

        rule 02e                        → recovery coordinator (threaded)
        agent-run/06-coordinator-failed → agent.run.outcome=failed (lineage)
        agent-run/04-executing-to-failed → executing→failed

      Asserts agent.run.last_transition_from==executing to prove rule 04 drove it
      (via rule 06's lineage-anchor stamp), NOT the upstream D3 dispatched→failed
      guard. The empirical proof the threaded lineage anchor resolves at runtime.
      Sandbox = MockRunner (no sandbox requested — wedges before any Ralph).
    vars:
      FIXTURE: run-failed-coordinator.yaml
      AGENTIC_CONFIG: e2e-flow-bootstrap.json
    cmds:
      - defer: { task: test:e2e:agentic:cleanup }
      - task: test:e2e:agentic:stack:up
        vars:
          FIXTURE: "{{.FIXTURE}}"
          AGENTIC_CONFIG: "{{.AGENTIC_CONFIG}}"
      - npx playwright test e2e/agentic/run-failed-coordinator.spec.ts

  test:e2e:agentic:run-failed-coordinator-inherit:
    desc: Run the ADR-053 Phase 4b-1a inherit-anchor-recovery-coordinator-failed journey
    summary: |
      The anchor_inherit sibling of run-failed-coordinator (which exercises the
      threaded branch → rule 06). A first-pass Lisa escalates needs_clarification,
      so rule 02f spawns a recovery coordinator that does NOT thread lineage — it
      INHERITS agent.run.entity_id off Lisa's bare agent.run. That coordinator is
      wedged to a max_iterations failure, so the substrate must drive the run
      executing→failed via the agent.run.entity_id anchor:

        rule 02f                        → recovery coordinator (inherit, no thread)
        agent-run/05-coordinator-failed → agent.run.outcome=failed (run-anchor)
        agent-run/04-executing-to-failed → executing→failed

      Closes the empirical gap the 4b-1a review flagged: the inherit
      coordinator-failure path (rule 05) now has the same end-to-end gate the
      lineage branch (rule 06) does. Asserts last_transition_from==executing.
      Sandbox = MockRunner (no sandbox requested — wedges before any plan/Ralph).
    vars:
      FIXTURE: run-failed-coordinator-inherit.yaml
      AGENTIC_CONFIG: e2e-flow-bootstrap.json
    cmds:
      - defer: { task: test:e2e:agentic:cleanup }
      - task: test:e2e:agentic:stack:up
        vars:
          FIXTURE: "{{.FIXTURE}}"
          AGENTIC_CONFIG: "{{.AGENTIC_CONFIG}}"
      - npx playwright test e2e/agentic/run-failed-coordinator-inherit.spec.ts

  test:e2e:agentic:ask-user-pause:
    desc: Run the ADR-053 Phase 4b-2 interactive-pause journey (in-run ask_user → awaiting_approval)
    summary: |
      A first-pass Lisa escalates needs_clarification, so rule 02f spawns a
      recovery coordinator (inherit anchor: agent.run.entity_id). That coordinator
      emits decide(ask_user) — and because it belongs to a run, the 4b-2 pause
      fires:

        coordinator/03-ask-user                            → coordinator.user_question
        agent-run/07-ask-user-pause-run-anchor             → agent.run.clarification_pending (run entity)
        agent-run/09-executing-to-awaiting-on-clarification → executing→awaiting_approval

      The run is honestly paused on a human reply (PR-1 has no resume — it parks
      in awaiting_approval; resume is PR-2). Asserts agent.run.phase reaches
      awaiting_approval (NOT completed/failed) + last_transition_from==executing,
      and the clarification_pending marker that distinguishes a 4b-2 pause from a
      4c tool-gate. Interactive mode (restricted_decide_actions=[]). Sandbox =
      MockRunner (no sandbox requested — pauses before any plan/Ralph).
    vars:
      FIXTURE: ask-user-pause.yaml
      AGENTIC_CONFIG: e2e-flow-bootstrap.json
    cmds:
      - defer: { task: test:e2e:agentic:cleanup }
      - task: test:e2e:agentic:stack:up
        vars:
          FIXTURE: "{{.FIXTURE}}"
          AGENTIC_CONFIG: "{{.AGENTIC_CONFIG}}"
      - npx playwright test e2e/agentic/ask-user-pause.spec.ts

  test:e2e:agentic:clarification-resume:
    desc: Run the ADR-053 Phase 4b-2 PR-2 interactive-RESUME journey (operator reply → awaiting_approval→executing)
    summary: |
      The resume twin of ask-user-pause. The pause half is identical (first-pass
      Lisa escalates needs_clarification → recovery coordinator decide(ask_user) →
      run parks in awaiting_approval). Then the spec POSTs the operator's answer to
      the dispatch /message endpoint with the resumable-reply anchors threaded by
      semstreams#256 (beta.106):

        run_id      → TaskMessage.RunID      → agent.run.entity_id on the reply loop
        in_reply_to → TaskMessage.InReplyTo  → agent.loop.reply_to on the reply loop

      buildSpawnIdentityTriples stamps both at spawn (before any LLM call), firing:

        agent-run/10-clarification-reply-resume-marker → agent.run.clarification_resumed
        agent-run/11-resume-awaiting-to-executing      → awaiting_approval→executing
                                                          + clear BOTH markers

      The resumed coordinator decide(respond_direct) answers directly; the run
      resumes to `executing` and stays there (a plain coordinator respond_direct
      stamps no agent.run.outcome, so no completion — the journey proves the
      RESUME MECHANIC, not work completion). DECISIVE assertion: the run that
      REACHED awaiting_approval LEAVES it to `executing` with both clarification
      markers cleared, and a settle window confirms no bounce back to
      awaiting_approval. Reply driven via the direct dispatch API (no UI affordance
      yet — that is the deferred B2 slice); no triple seeding (real wire anchors).
      Interactive mode (restricted_decide_actions=[]). Sandbox = MockRunner.
    vars:
      FIXTURE: clarification-resume.yaml
      AGENTIC_CONFIG: e2e-flow-bootstrap.json
    cmds:
      - defer: { task: test:e2e:agentic:cleanup }
      - task: test:e2e:agentic:stack:up
        vars:
          FIXTURE: "{{.FIXTURE}}"
          AGENTIC_CONFIG: "{{.AGENTIC_CONFIG}}"
      - npx playwright test e2e/agentic/clarification-resume.spec.ts

  test:e2e:agentic:clarification-resume-ui:
    desc: Run the ADR-053 Phase 4b-2 run-waiting UI affordance journey (operator resumes a paused run THROUGH the UI)
    summary: |
      The UI-driven twin of clarification-resume. The pause half is identical
      (first-pass Lisa escalates needs_clarification → recovery coordinator
      decide(ask_user) → run parks in awaiting_approval). The difference: this
      journey resumes the run through the operator-facing UI, not the raw API.

      It proves the deferred "B2 UI slice":
        - the runStatus poll of /graph/triples surfaces the run-level pause as a
          "Answer needed" badge on the front-door card (runID === the card's
          loop_id) and a RunWaitingSection in the detail panel;
        - the rendered question prose proves deriveRunStatuses joined
          coordinator.user_question to the run via the BARE asking-loop id (the
          wire-shape fix — clarification_pending.object is $entity.instance, a
          bare UUID, NOT a full entity ref; the unit tests masked this);
        - clicking Send posts run_id + in_reply_to (the bare asking-loop id) →
          beta.106 stamps the anchors at spawn → agent-run/10→11 resume the run
          (awaiting_approval→executing + clear markers) → the affordance unmounts.

      Reuses the clarification-resume.yaml fixture (mock serves responses in
      global order, so the typed reply content is free). Interactive mode
      (restricted_decide_actions=[]). Sandbox = MockRunner.
    vars:
      FIXTURE: clarification-resume.yaml
      AGENTIC_CONFIG: e2e-flow-bootstrap.json
    cmds:
      - defer: { task: test:e2e:agentic:cleanup }
      - task: test:e2e:agentic:stack:up
        vars:
          FIXTURE: "{{.FIXTURE}}"
          AGENTIC_CONFIG: "{{.AGENTIC_CONFIG}}"
      - npx playwright test e2e/agentic/clarification-resume-ui.spec.ts

  test:e2e:agentic:clarification-autonomous:
    desc: Run the ADR-053 4b clarification-policy AUTONOMOUS-mode journey
    summary: |
      Proves the run-level clarification policy end-to-end. Boots a config
      DERIVED from e2e-flow-bootstrap.json at run time (via jq) with
      restricted_decide_actions=["ask_user"] (autonomous mode) — no committed
      duplicate, no drift. The FRONT-DOOR coordinator's decide(ask_user) is
      barred by the framework gate (semstreams#239, beta.104); the loop
      re-picks decide(respond_direct) and answers autonomously. The spec
      asserts a coordinator.user_reply triple (answered) + NO
      coordinator.user_question triple (ask_user blocked, not delivered).

      ADR-053 §4b autonomous persona overlay: the backend ALSO loads the
      autonomous coordinator overlay (PERSONA_OVERLAY below) on top of the base
      fragments. Under a real LLM that overlay makes the coordinator skip the
      ask_user attempt entirely (respond_direct upfront); the mock serves
      fixtures regardless of persona, so this journey proves the overlay LOADS
      and does not break the autonomous flow (the policy gate + answer still
      land). The behavioral skip is a real-LLM-smoke concern.

      The generated config (configs/*.gen.json) is gitignored + removed on
      teardown.
    vars:
      FIXTURE: clarification-autonomous.yaml
      AGENTIC_CONFIG: e2e-flow-bootstrap-autonomous.gen.json
    cmds:
      - defer: { task: test:e2e:agentic:cleanup }
      - defer: rm -f ../configs/e2e-flow-bootstrap-autonomous.gen.json
      - jq '.components["agentic-tools"].config.restricted_decide_actions=["ask_user"]' ../configs/e2e-flow-bootstrap.json > ../configs/e2e-flow-bootstrap-autonomous.gen.json
      - task: test:e2e:agentic:stack:up
        vars:
          FIXTURE: "{{.FIXTURE}}"
          AGENTIC_CONFIG: "{{.AGENTIC_CONFIG}}"
          PERSONA_OVERLAY: configs/personas/fragments-autonomous
      - npx playwright test e2e/agentic/clarification-autonomous.spec.ts

  test:e2e:agentic:approval-pause:
    desc: Run the ADR-053 Phase 4c PR-1 tool-gate pause journey (in-run gated tool → awaiting_approval)
    summary: |
      The 4c twin of ask-user-pause. Same dev-via-test scaffold (first-pass Lisa
      escalates needs_clarification → rule 02f spawns the recovery coordinator,
      inherit anchor agent.run.entity_id), but the recovery coordinator calls
      create_rule — which e2e-flow-bootstrap.json lists in
      agentic-tools.approval_required. The upstream ApprovalFilter rejects it and the
      loop parks in awaiting_approval, emitting agent.approval_pending.<loopID>:

        approvalpause subscriber  → agent.run.approval_pending (run entity)
        agent-run/12 (approval_pending + phase==executing) → executing→awaiting_approval

      The run is honestly paused on a human approval (PR-1 has no resume — it parks
      in awaiting_approval). Asserts agent.run.phase reaches awaiting_approval (NOT
      completed/failed) + last_transition_from==executing + the agent.run.approval_pending
      marker is PRESENT and agent.run.clarification_pending is ABSENT (the 4c-vs-4b-2
      distinction — the two pauses must never be confused or cross-resumed). Exercises
      the thinly-tested upstream approval path (gateForApproval publish + ApprovalFilter)
      end-to-end. Sandbox = MockRunner (no sandbox requested — pauses before any plan).
    vars:
      FIXTURE: approval-pause.yaml
      AGENTIC_CONFIG: e2e-flow-bootstrap.json
    cmds:
      - defer: { task: test:e2e:agentic:cleanup }
      - task: test:e2e:agentic:stack:up
        vars:
          FIXTURE: "{{.FIXTURE}}"
          AGENTIC_CONFIG: "{{.AGENTIC_CONFIG}}"
      - npx playwright test e2e/agentic/approval-pause.spec.ts

  test:e2e:agentic:approval-resume:
    desc: Run the ADR-053 Phase 4c PR-2 tool-gate RESUME journey (approve gated tool → awaiting_approval→executing)
    summary: |
      The resume twin of approval-pause. Same pause half (dev-via-test → recovery
      coordinator gated create_rule → run parks in awaiting_approval). Then the spec
      POSTs the operator's approval to the real dispatch endpoint:

        POST /teams-dispatch/loops/{loopId}/approval {"decision":"approve"}

      which publishes agent.approval_response.<loopId>. The teams-loop
      agent.approval_response input port (NEW for 4c PR-2) un-parks the loop
      (ResolveApprovalIfPending; create_rule re-dispatched with ApprovedBy → gate
      bypass), and the approvalpause subscriber stamps agent.run.approval_resumed →
      agent-run/13 transitions awaiting_approval→executing + clears BOTH markers. The
      resumed coordinator respond_direct answers; the run stays `executing` (no
      outcome stamped — proves the RESUME MECHANIC, not completion).

      DECISIVE: approval_pending CLEARED + run executing (NOT awaiting_approval/
      completed/failed) + approval_resumed cleared + settle window confirms no bounce.
      Exercises the thinly-tested upstream approval resume path end-to-end
      (GetPendingApprovalCallID, publishApprovalResponse, ResolveApprovalIfPending,
      the ApprovedBy bypass). Approval driven via the direct dispatch API (no UI
      affordance yet). Sandbox = MockRunner.
    vars:
      FIXTURE: approval-resume.yaml
      AGENTIC_CONFIG: e2e-flow-bootstrap.json
    cmds:
      - defer: { task: test:e2e:agentic:cleanup }
      - task: test:e2e:agentic:stack:up
        vars:
          FIXTURE: "{{.FIXTURE}}"
          AGENTIC_CONFIG: "{{.AGENTIC_CONFIG}}"
      - npx playwright test e2e/agentic/approval-resume.spec.ts

