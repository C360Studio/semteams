version: "3"

# Note on env-var loading for real-LLM scenarios (smoke #7, osh-demo):
# Task forbids `dotenv:` in included Taskfiles. The project-root
# Taskfile already loads `.env` via its top-level `dotenv: ['.env']`
# directive; for real-LLM tasks here, invoke from the project root —
# e.g. `task ui:test:e2e:agentic:smoke7:run` — so the parent
# Taskfile's dotenv runs and ANTHROPIC_API_KEY etc. flow through.
# Direct `task ...` invocation from `ui/` skips that and the smoke7
# precondition will fail loud with remediation guidance.

env:
  # Pin the docker-compose project name so we don't collide with sibling
  # products (semspec, semdragons) whose compose files live in directories
  # also named `ui` and would otherwise share the default project name.
  # Without this, our `nats` service can be shadowed by another project's
  # nats container running concurrently.
  COMPOSE_PROJECT_NAME: '{{.COMPOSE_PROJECT_NAME | default "semteams-agentic"}}'

vars:
  # Backend configuration — the semteams backend
  BACKEND_URL: '{{.BACKEND_URL | default "http://localhost:8080"}}'

  # OpenAPI spec path — defaults to the semteams-generated spec at the repo root
  OPENAPI_SPEC_PATH: '{{.OPENAPI_SPEC_PATH | default "../specs/openapi.v3.yaml"}}'

  # Development ports (configurable to avoid collisions)
  DEV_UI_PORT: '{{.DEV_UI_PORT | default "3001"}}'
  DEV_VITE_PORT: '{{.DEV_VITE_PORT | default "5173"}}'

tasks:
  # === Type Generation ===

  generate-types:
    desc: Generate TypeScript types from the semteams OpenAPI spec
    cmds:
      - npx openapi-typescript {{.OPENAPI_SPEC_PATH}} --output src/lib/types/api.generated.ts
      - echo "✅ TypeScript types generated from {{.OPENAPI_SPEC_PATH}}"

  generate-types:from-url:
    desc: Generate TypeScript types from running backend
    cmds:
      - npx openapi-typescript {{.BACKEND_URL}}/openapi.yaml --output src/lib/types/api.generated.ts
      - echo "✅ TypeScript types generated from {{.BACKEND_URL}}/openapi.yaml"

  generate-types:check:
    desc: Check for uncommitted type changes (CI)
    cmds:
      - task: generate-types
      - git diff --exit-code src/lib/types/api.generated.ts || (echo "⚠️  Generated types changed! Run 'task generate-types' and commit."; exit 1)

  # === Development ===

  dev:
    desc: Start Vite dev server only (no proxy — use dev:connect or dev:full instead)
    cmds:
      - echo "Starting UI dev server..."
      - echo "Expecting backend at {{.BACKEND_URL}}"
      - npm run dev

  dev:connect:
    desc: Connect to any running SemStreams app (no Docker backend needed)
    summary: |
      Starts Caddy + Vite dev server, proxying API requests to a running
      SemStreams backend. No NATS, no Docker build — just point and go.

      Examples:
        task dev:connect                                  # localhost:8080
        BACKEND_HOST=myapp.local:8080 task dev:connect    # remote host
        BACKEND_HOST=10.0.1.5:8080 GRAPHQL_HOST=10.0.1.5:8082 task dev:connect
    vars:
      BACKEND_HOST: '{{.BACKEND_HOST | default "localhost:8080"}}'
      GRAPHQL_HOST: '{{.GRAPHQL_HOST | default .BACKEND_HOST | default "localhost:8080"}}'
    env:
      BACKEND_HOST: "{{.BACKEND_HOST}}"
      GRAPHQL_HOST: "{{.GRAPHQL_HOST}}"
      UI_HOST: "localhost:{{.DEV_VITE_PORT}}"
      LISTEN_PORT: "{{.DEV_UI_PORT}}"
    deps:
      - task: dev:connect:check
        vars:
          BACKEND_HOST: "{{.BACKEND_HOST}}"
    cmds:
      - defer: { task: dev:connect:stop }
      - |
        echo "Connecting to SemStreams backend at {{.BACKEND_HOST}}"
        echo "GraphQL gateway at {{.GRAPHQL_HOST}}"
        echo ""
        echo "UI will be at http://localhost:{{.DEV_UI_PORT}}"
        echo ""
      - caddy start --config Caddyfile.dev
      - npm run dev -- --port {{.DEV_VITE_PORT}} --host
    preconditions:
      - sh: command -v caddy
        msg: "Caddy not found. Install with: brew install caddy"

  dev:connect:check:
    desc: Check if the backend is reachable
    internal: true
    vars:
      BACKEND_HOST: '{{.BACKEND_HOST | default "localhost:8080"}}'
    cmds:
      - |
        if curl -sf "http://{{.BACKEND_HOST}}/health" > /dev/null 2>&1; then
          echo "✅ Backend reachable at {{.BACKEND_HOST}}"
        else
          echo "⚠️  Backend at {{.BACKEND_HOST}} not responding — Caddy will retry"
        fi

  dev:connect:stop:
    desc: Stop the Caddy dev proxy
    internal: true
    cmds:
      - caddy stop 2>/dev/null || true

  # === Full Stack Development ===

  dev:backend:
    desc: Start backend infrastructure (NATS + backend) in foreground
    cmds:
      - echo "Starting backend infrastructure..."
      - echo "NATS will be at localhost:4222"
      - echo "Backend API will be at localhost:8080"
      - docker compose -f docker-compose.dev.yml up

  dev:backend:start:
    desc: Start backend infrastructure in background
    env:
      DEV_UI_PORT: "{{.DEV_UI_PORT}}"
      DEV_VITE_PORT: "{{.DEV_VITE_PORT}}"
    cmds:
      - docker compose -f docker-compose.dev.yml up -d
      - echo "✅ Backend infrastructure starting..."
      - echo "   Access UI at http://localhost:{{.DEV_UI_PORT}}"
      - echo "   Run 'task dev:backend:logs' to see logs"
      - echo "   Run 'task dev:backend:stop' to stop"

  dev:backend:stop:
    desc: Stop backend infrastructure
    cmds:
      - docker compose -f docker-compose.dev.yml down
      - echo "✅ Backend infrastructure stopped"

  dev:backend:logs:
    desc: View backend infrastructure logs
    cmds:
      - docker compose -f docker-compose.dev.yml logs -f

  dev:full:
    desc: Start full development stack (backend + frontend)
    env:
      DEV_UI_PORT: "{{.DEV_UI_PORT}}"
      DEV_VITE_PORT: "{{.DEV_VITE_PORT}}"
    cmds:
      - task: dev:backend:start
      - echo "Waiting for Caddy health check..."
      - |
        for i in $(seq 1 30); do
          if curl -s http://localhost:{{.DEV_UI_PORT}}/health > /dev/null 2>&1; then
            echo "✅ Backend ready!"
            break
          fi
          echo "   Waiting... ($i/30)"
          sleep 2
        done
      - echo ""
      - echo "📱 Open http://localhost:{{.DEV_UI_PORT}} in your browser"
      - echo ""
      - npm run dev -- --port {{.DEV_VITE_PORT}} --host

  dev:docker:
    desc: Start UI in Docker (backend at host.docker.internal:8080)
    cmds:
      - echo "Starting UI in Docker..."
      - docker compose up

  dev:with-caddy:
    desc: Start UI + Caddy in Docker (available at http://localhost:3000)
    cmds:
      - echo "Starting UI + Caddy..."
      - docker compose --profile caddy up

  # === Testing ===

  test:
    desc: Run unit tests
    cmds:
      - npm run test

  test:e2e:
    desc: Run all E2E journey specs (each with its own fixture and fresh stack)
    summary: |
      Runs every Playwright journey under e2e/agentic/ with the
      research-mvp mock-LLM fixture (the surviving ADR-042 MVP cut),
      tearing down the docker stack between runs.
    cmds:
      - task: test:e2e:agentic:research-mvp
      - task: test:e2e:agentic:ops-agent
      - task: test:e2e:agentic:real-time-activity-stream
      - task: test:e2e:agentic:task-story-trace
      - task: test:e2e:agentic:action-chips
      - task: test:e2e:agentic:task-title-aliases
      - task: test:e2e:agentic:admin-flows-inventory

  test:e2e:agentic:real-time-activity-stream:
    desc: Run the real-time-activity-stream journey
    vars:
      FIXTURE: real-time-activity-stream.yaml
      AGENTIC_CONFIG: e2e-flow-bootstrap.json
    cmds:
      - defer: { task: test:e2e:agentic:cleanup }
      - task: test:e2e:agentic:stack:up
        vars:
          FIXTURE: "{{.FIXTURE}}"
          AGENTIC_CONFIG: "{{.AGENTIC_CONFIG}}"
      - npx playwright test e2e/agentic/real-time-activity-stream.spec.ts

  test:e2e:agentic:ops-agent:
    desc: Run the ops-agent baseline journey (ADR-027 Phase 1 — 20 researcher loops + ops diagnostic)
    summary: |
      Drives 20 serial researcher loops against the mock LLM, then
      validates that the ops_observe_complete_loops rule spawns an
      ops-analyst loop whose completion cites docs/objectives/dev-research.md.

      Long-running: 20 mock researcher loops take ~100s. Set a generous
      timeout when running under CI.
    vars:
      FIXTURE: ops-agent-baseline.yaml
      AGENTIC_CONFIG: e2e-flow-bootstrap.json
    cmds:
      - defer: { task: test:e2e:agentic:cleanup }
      - task: test:e2e:agentic:stack:up
        vars:
          FIXTURE: "{{.FIXTURE}}"
          AGENTIC_CONFIG: "{{.AGENTIC_CONFIG}}"
      - npx playwright test e2e/agentic/ops-agent-baseline.spec.ts

  test:e2e:agentic:research-mvp:
    desc: Run the ADR-042 MVP-5 research-category mock-LLM journey
    summary: |
      One user prompt drives the full research-category arc end-to-end
      against the MVP roster:

        Loop 0  coordinator (dispatch)        decide(action="research")
        Loop A  researcher-research-plan      emit_plan + decide(gather)
        Loop B  researcher-research-gather    web_search + decide(synthesize)
        Loop C  researcher-research-synthesize emit_artifact + decide(emit)
        Loop D  reviewer-research             decide(approved)
        Loop E  coordinator (wake-up)         decide(respond_direct)

      Validates the substrate-plus-overlays architecture: a single
      category-keyed rule pack + named persona bundles wired through
      the framework's singleton substrate (MVP-1 through MVP-4 work
      shipped under PRs #172/#173/#174/#175).

      Six loops, thirteen mock-LLM round-trips. No approval gate, no
      recovery. Compose profiles: none; the sandbox container is
      always-warm under the ADR-042 MVP-7 follow-up posture.
    vars:
      FIXTURE: research-mvp.yaml
      AGENTIC_CONFIG: e2e-flow-bootstrap.json
    cmds:
      - defer: { task: test:e2e:agentic:cleanup }
      - task: test:e2e:agentic:stack:up
        vars:
          FIXTURE: "{{.FIXTURE}}"
          AGENTIC_CONFIG: "{{.AGENTIC_CONFIG}}"
      - npx playwright test e2e/agentic/research-mvp.spec.ts

  test:e2e:agentic:task-story-trace:
    desc: Run the task-story / raw-activity right-rail journey (fixture-agnostic; uses research-mvp for backend activity)
    vars:
      FIXTURE: research-mvp.yaml
      AGENTIC_CONFIG: e2e-flow-bootstrap.json
    cmds:
      - defer: { task: test:e2e:agentic:cleanup }
      - task: test:e2e:agentic:stack:up
        vars:
          FIXTURE: "{{.FIXTURE}}"
          AGENTIC_CONFIG: "{{.AGENTIC_CONFIG}}"
      - npx playwright test e2e/agentic/task-story-trace.spec.ts

  test:e2e:agentic:action-chips:
    desc: Run the persona action-chips journey (fixture-agnostic; uses research-mvp for backend activity)
    vars:
      FIXTURE: research-mvp.yaml
      AGENTIC_CONFIG: e2e-flow-bootstrap.json
    cmds:
      - defer: { task: test:e2e:agentic:cleanup }
      - task: test:e2e:agentic:stack:up
        vars:
          FIXTURE: "{{.FIXTURE}}"
          AGENTIC_CONFIG: "{{.AGENTIC_CONFIG}}"
      - npx playwright test e2e/agentic/action-chips-personas.spec.ts

  test:e2e:agentic:task-title-aliases:
    desc: Run the editable-title + alias-chip journey (fixture-agnostic; uses research-mvp for backend activity)
    vars:
      FIXTURE: research-mvp.yaml
      AGENTIC_CONFIG: e2e-flow-bootstrap.json
    cmds:
      - defer: { task: test:e2e:agentic:cleanup }
      - task: test:e2e:agentic:stack:up
        vars:
          FIXTURE: "{{.FIXTURE}}"
          AGENTIC_CONFIG: "{{.AGENTIC_CONFIG}}"
      - npx playwright test e2e/agentic/task-title-aliases.spec.ts

  test:e2e:agentic:admin-flows-inventory:
    desc: Run the read-only /admin/flows inventory journey (fixture-agnostic; uses research-mvp for backend activity)
    vars:
      FIXTURE: research-mvp.yaml
      AGENTIC_CONFIG: e2e-flow-bootstrap.json
    cmds:
      - defer: { task: test:e2e:agentic:cleanup }
      - task: test:e2e:agentic:stack:up
        vars:
          FIXTURE: "{{.FIXTURE}}"
          AGENTIC_CONFIG: "{{.AGENTIC_CONFIG}}"
      - npx playwright test e2e/agentic/admin-flows-inventory.spec.ts

  # === Interactive dev-mode scenario tasks ===
  #
  # Each scenario binds a FIXTURE + AGENTIC_CONFIG pair so the caller does
  # not juggle two env vars. Matches the test:e2e:agentic:<scenario>
  # pattern (which also runs playwright) — these variants just boot and
  # leave the stack up for curl / probe experimentation.
  #
  # Tear down any scenario with: task test:e2e:agentic:cleanup

  test:e2e:agentic:dev:ops-agent:
    desc: Boot stack for the ops-agent scenario (researcher + ops observer). No playwright.
    cmds:
      - task: test:e2e:agentic:dev:_boot
        vars:
          FIXTURE: ops-agent-baseline.yaml
          AGENTIC_CONFIG: e2e-flow-bootstrap.json
          SCENARIO: ops-agent

  test:e2e:agentic:dev:real-time-activity:
    desc: Boot stack for the real-time-activity-stream scenario. No playwright.
    cmds:
      - task: test:e2e:agentic:dev:_boot
        vars:
          FIXTURE: real-time-activity-stream.yaml
          AGENTIC_CONFIG: e2e-flow-bootstrap.json
          SCENARIO: real-time-activity

  test:e2e:agentic:dev:research-mvp:
    desc: Boot stack for the ADR-042 MVP-5 research-category scenario (substrate + research pack). No playwright.
    cmds:
      - task: test:e2e:agentic:dev:_boot
        vars:
          FIXTURE: research-mvp.yaml
          AGENTIC_CONFIG: e2e-flow-bootstrap.json
          SCENARIO: research-mvp

  test:e2e:agentic:smoke7:capture:
    desc: Dump per-loop trajectories + message-log + wedge-report for real-LLM smoke findings synthesis
    internal: true
    vars:
      RUN_ID: '{{.RUN_ID | default "smoke-manual"}}'
      OUT_DIR: '/tmp/{{.RUN_ID}}'
      PORT: '{{.E2E_AGENTIC_UI_PORT | default "3100"}}'
      # The role the smoke is expected to end on. Default coordinator
      # is the ADR-042 MVP-7 chain terminal — reviewer-research(approved)
      # spawns a wake-up coordinator that emits respond_direct, so the
      # last live loop is the coordinator wake-up. Override via env
      # var for other flows. Empty = skip the chain-shape check.
      WEDGE_EXPECTED_TERMINAL_ROLE: '{{.WEDGE_EXPECTED_TERMINAL_ROLE | default "coordinator"}}'
    cmds:
      - mkdir -p {{.OUT_DIR}}
      - |
        PORT="{{.PORT}}"
        OUT_DIR="{{.OUT_DIR}}"
        RUN_ID="{{.RUN_ID}}"
        # Consolidate watcher artefacts (sibling files at /tmp/<RUN_ID>-*)
        # into the capture directory so the operator has one path to the
        # full evidence set. Watcher writes -trajectory.jsonl,
        # -events.log, -seen/-states/-approved.txt; only the first two are
        # findings-relevant.
        for SUFFIX in trajectory.jsonl events.log; do
          SRC="/tmp/${RUN_ID}-${SUFFIX}"
          if [ -f "$SRC" ]; then
            mv "$SRC" "${OUT_DIR}/watcher-${SUFFIX}" 2>/dev/null \
              || echo "warn: failed to relocate ${SRC}" >&2
          fi
        done
        # Full container logs + docker-state snapshot — must run BEFORE
        # the loops-reachable gate below, because the most useful time to
        # have these is exactly when the stack went sideways. Smoke #25c
        # (2026-05-14) lost this evidence: loops endpoint returned empty
        # mid-builder, we couldn't tell why because logs were gone with
        # the post-cleanup container removal. Both backend and sandbox
        # carry our product code; dump both.
        for CONTAINER in semteams-ui-agentic-backend semteams-ui-agentic-sandbox; do
          if docker ps -a --format '{{`{{.Names}}`}}' | grep -q "^${CONTAINER}$"; then
            SHORT=$(echo "$CONTAINER" | sed 's/^semteams-ui-agentic-//')
            docker logs "$CONTAINER" > "${OUT_DIR}/${SHORT}.log" 2>&1 \
              || echo "warn: docker logs failed for ${CONTAINER}" >&2
            # inspect JSON includes OOMKilled, ExitCode, RestartCount,
            # State.Status (running/exited/dead) — answers the "did the
            # container die" question without retained logs.
            docker inspect "$CONTAINER" > "${OUT_DIR}/${SHORT}.inspect.json" 2>&1 \
              || echo "warn: docker inspect failed for ${CONTAINER}" >&2
          else
            echo "(container ${CONTAINER} absent at capture time)" \
              > "${OUT_DIR}/$(echo "$CONTAINER" | sed 's/^semteams-ui-agentic-//').log"
          fi
        done
        # Compose-wide container state snapshot — shows which containers
        # are alive vs exited at capture time. Quick triage signal before
        # opening any individual inspect JSON.
        docker compose -f docker-compose.agentic-e2e.yml --project-name semteams-agentic ps -a \
          > "${OUT_DIR}/compose-ps.txt" 2>&1 \
          || echo "warn: compose ps failed" >&2
        # Loops snapshot — input for the trajectory loop below.
        if ! curl -sf "http://localhost:${PORT}/teams-dispatch/loops" > "${OUT_DIR}/loops.json"; then
          echo "warn: stack already torn down or unreachable at port ${PORT}; live-state capture skipped" >&2
          echo "▶︎  Watcher evidence preserved in ${OUT_DIR}/:"
          ls -la "${OUT_DIR}/" 2>/dev/null
          exit 0
        fi
        # Per-loop trajectories. Best-effort: a single 404 doesn't abort the others.
        jq -r '.[].loop_id' "${OUT_DIR}/loops.json" 2>/dev/null | while read -r LOOP_ID; do
          [ -n "$LOOP_ID" ] || continue
          curl -sf "http://localhost:${PORT}/teams-loop/trajectories/${LOOP_ID}" \
            > "${OUT_DIR}/trajectory-${LOOP_ID}.json" \
            || echo "warn: trajectory fetch failed for ${LOOP_ID}" >&2
        done
        # Message-logger entries (subjects + payloads) — input for "what fired" forensics.
        curl -sf "http://localhost:${PORT}/message-logger/entries?limit=10000" \
          > "${OUT_DIR}/messages.json" \
          || echo "warn: message-logger fetch failed" >&2
        # Graph triples snapshot — the qa-reviewer's coordinator.decision_reason
        # lives here and is the substantive output the playbook asks operators
        # to grep. Best-effort same as the others.
        curl -sf "http://localhost:${PORT}/graph/triples?limit=10000" \
          > "${OUT_DIR}/triples.json" \
          || echo "warn: graph triples fetch failed" >&2
        # Tool-issue scan from the backend logs while the container is
        # still up. Catches the smoke-#7 "kv: key not found" pattern and
        # any other tool execution failures. Empty file is fine (means
        # no tool errors logged at ERROR level).
        if docker ps --format '{{`{{.Names}}`}}' | grep -q '^semteams-ui-agentic-backend$'; then
          docker logs semteams-ui-agentic-backend 2>&1 \
            | grep -E '"msg":"Failed to execute tool"|"tool_status":"error"|"msg":"Tool .* not found"' \
            > "${OUT_DIR}/tool-issues.log" \
            || echo "(no tool-issue log lines matched filter — likely a clean run)" > "${OUT_DIR}/tool-issues.log"
        else
          echo "(backend container not running at capture time — tool-issue scan skipped)" > "${OUT_DIR}/tool-issues.log"
        fi
        # Rate-limit / model-error scan. Captures 429 indicators, retry-
        # with-backoff messages, context-deadline errors. Empty file =
        # clean run. Surfaced in wedge-report.txt so operator sees
        # rate-limit pressure at a glance. Smoke #7 run-2 (2026-05-05)
        # hit a 180s sonnet timeout — this scan would have caught it.
        if docker ps --format '{{`{{.Names}}`}}' | grep -q '^semteams-ui-agentic-backend$'; then
          docker logs semteams-ui-agentic-backend 2>&1 \
            | grep -iE '"msg":"Failed to complete chat"|"status_code":429|rate.?limit|context deadline exceeded|retry-attempt|backoff.*sleep' \
            > "${OUT_DIR}/rate-limit-issues.log" \
            || echo "(no rate-limit indicators in backend logs — clean run)" > "${OUT_DIR}/rate-limit-issues.log"
        else
          echo "(backend container not running at capture time — rate-limit scan skipped)" > "${OUT_DIR}/rate-limit-issues.log"
        fi
      # F3 chain-wedge report. Synthesises a wedge-report.txt over the
      # captured evidence. Factored into smoke7:wedge-report so it can
      # be re-run against an existing /tmp/<RUN_ID>/ post-hoc without
      # re-running the smoke.
      - task: test:e2e:agentic:smoke7:wedge-report
        vars:
          RUN_ID: "{{.RUN_ID}}"
          WEDGE_EXPECTED_TERMINAL_ROLE: "{{.WEDGE_EXPECTED_TERMINAL_ROLE}}"
      - |
        echo ""
        echo "▶︎  Smoke #7 evidence dumped to {{.OUT_DIR}}/:"
        ls -la "{{.OUT_DIR}}/"

  test:e2e:agentic:smoke7:wedge-report:
    desc: |
      F3 chain-wedge diagnosis: synthesise a wedge-report.txt over an
      already-captured /tmp/<RUN_ID>/ evidence directory. Prints
      per-loop terminal action, chain-shape match against
      $WEDGE_EXPECTED_TERMINAL_ROLE, and tool-issue tally.

      Usage:
        task ui:test:e2e:agentic:smoke7:wedge-report                 # RUN_ID=smoke7-manual
        RUN_ID=smoke7-run1 task ui:test:e2e:agentic:smoke7:wedge-report
        WEDGE_EXPECTED_TERMINAL_ROLE=reviewer-research RUN_ID=smoke7-run1 task ui:test:e2e:agentic:smoke7:wedge-report

      Reads (best-effort): /tmp/$RUN_ID/loops.json,
      /tmp/$RUN_ID/trajectory-*.json, /tmp/$RUN_ID/tool-issues.log.
      Writes: /tmp/$RUN_ID/wedge-report.txt and stdout.
    vars:
      RUN_ID: '{{.RUN_ID | default "smoke7-manual"}}'
      OUT_DIR: '/tmp/{{.RUN_ID}}'
      WEDGE_EXPECTED_TERMINAL_ROLE: '{{.WEDGE_EXPECTED_TERMINAL_ROLE | default "reviewer-qa"}}'
    cmds:
      - |
        OUT_DIR="{{.OUT_DIR}}"
        EXPECTED="{{.WEDGE_EXPECTED_TERMINAL_ROLE}}"
        REPORT="${OUT_DIR}/wedge-report.txt"
        if [ ! -d "$OUT_DIR" ]; then
          echo "no capture directory at $OUT_DIR — set RUN_ID to a directory that exists" >&2
          exit 1
        fi
        {
          echo "# Smoke wedge-report ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          echo ""
          if [ ! -f "${OUT_DIR}/loops.json" ]; then
            echo "loops.json missing — stack was torn down before capture; cannot diagnose chain shape."
          else
            LOOP_COUNT=$(jq 'length' "${OUT_DIR}/loops.json")
            echo "Loop count: ${LOOP_COUNT}"
            echo ""
            echo "## Per-loop terminal actions"
            echo ""
            jq -r '.[] | "\(.loop_id)\t\(.role // "(dispatch)")\t\(.state)"' "${OUT_DIR}/loops.json" | while IFS=$'\t' read -r LOOP_ID ROLE STATE; do
              TRAJ="${OUT_DIR}/trajectory-${LOOP_ID}.json"
              if [ ! -f "$TRAJ" ]; then
                printf "%s\trole=%s\tstate=%s\tterminal=(no trajectory)\n" "${LOOP_ID:0:12}" "$ROLE" "$STATE"
                continue
              fi
              TERMINAL=$(jq -r '
                [.steps[] | select(.step_type=="tool_call")][-1] as $last
                | if $last == null then "(no tool calls)"
                  elif ($last.tool_arguments.action // null) != null then
                    "\($last.tool_name)(action=\($last.tool_arguments.action))"
                  else $last.tool_name end' "$TRAJ" 2>/dev/null)
              printf "%s\trole=%s\tstate=%s\tterminal=%s\n" "${LOOP_ID:0:12}" "$ROLE" "$STATE" "$TERMINAL"
            done | column -t -s $'\t'
            echo ""
            echo "## Chain-shape check"
            echo ""
            LAST_ROLE=$(jq -r 'sort_by(.created_at)[-1] | .role // "(dispatch)"' "${OUT_DIR}/loops.json" 2>/dev/null)
            if [ -z "$EXPECTED" ]; then
              echo "WEDGE_EXPECTED_TERMINAL_ROLE unset — skipping role match. Final terminal role: ${LAST_ROLE}"
            elif [ "$LAST_ROLE" = "$EXPECTED" ]; then
              echo "OK — final terminal role matches expected: ${LAST_ROLE}"
            else
              echo "WEDGE — final terminal role is '${LAST_ROLE}', expected '${EXPECTED}'."
              echo "       The chain stopped before reaching the expected end role."
              echo "       Inspect the last loop's trajectory + triples for the"
              echo "       coordinator.next_action that no rule matched."
            fi
          fi
          echo ""
          echo "## Tool-issue tally (from ${OUT_DIR}/tool-issues.log)"
          echo ""
          ISSUES_LOG="${OUT_DIR}/tool-issues.log"
          if [ -f "$ISSUES_LOG" ] && [ -s "$ISSUES_LOG" ]; then
            COUNT=$(jq -r '.tool' "$ISSUES_LOG" 2>/dev/null | sort | uniq -c | sort -rn)
            if [ -n "$COUNT" ]; then
              echo "$COUNT"
            else
              head -20 "$ISSUES_LOG"
            fi
          else
            echo "(no tool errors recorded — clean run or backend not running at capture time)"
          fi
          echo ""
          echo "## Rate-limit indicators (from ${OUT_DIR}/rate-limit-issues.log)"
          echo ""
          RATE_LOG="${OUT_DIR}/rate-limit-issues.log"
          if [ -f "$RATE_LOG" ] && [ -s "$RATE_LOG" ]; then
            jq -r '.error // .msg // empty' "$RATE_LOG" 2>/dev/null \
              | awk '{print substr($0,1,80)}' | sort | uniq -c | sort -rn | head -10 \
              || head -10 "$RATE_LOG"
            echo ""
            echo "Total rate-limit-shaped events: $(wc -l < "$RATE_LOG" | tr -d ' ')"
          else
            echo "(no rate-limit indicators — model providers healthy or backend not running)"
          fi
        } > "$REPORT" 2>&1
        echo ""
        cat "$REPORT"

  test:e2e:agentic:smoke6:run:
    desc: Run smoke #6 (ADR-042 MVP-6 — research-category real-LLM) end-to-end with cleanup
    summary: |
      Real-LLM smoke for ADR-042 MVP-6. Boots the bootstrap config
      (configs/flow-bootstrap.json — real Anthropic claude-haiku for
      coordinator + research + reviewing capabilities), sends the
      canonical MVP-5 research prompt, runs the auto-approve watcher
      (no gates expected in the research category — watcher just polls
      until all loops terminate), captures trajectories + message log
      to /tmp/smoke6-<RUN_ID>/, then tears the stack down.

      Sibling task to smoke7 but scoped to the MVP roster — no
      sandbox/semsource profiles, no chainmode/phasevalidator
      machinery, just the substrate + research-pack rules. Expected
      chain shape: six loops total — coordinator dispatch +
      researcher-research-{plan,gather,synthesize} + reviewer-research
      (approved) + wake-up coordinator (respond_direct). Matches the
      mock-LLM journey from MVP-5 (#176).

      Real Anthropic spend (~$0.30-$0.50 per run on claude-haiku-4-5
      across six loops, roughly 13 model calls). ANTHROPIC_API_KEY
      required: invoke from the project root so the parent Taskfile's
      `dotenv: ['.env']` loads it, or export it manually before
      invoking from this directory.

      Usage (from project root):
        task ui:test:e2e:agentic:smoke6:run                   # RUN_ID defaults to a date stamp
        RUN_ID=ticket-176 task ui:test:e2e:agentic:smoke6:run

      Findings synthesis lands in a project_smoke6_findings.md
      memory record per the MVP-6 plan in [[adr-042-mvp-redesign]].
    vars:
      RUN_ID: '{{.RUN_ID | default (printf "smoke6-%s" (now | date "20060102-150405"))}}'
      AGENTIC_CONFIG: flow-bootstrap.json
      COMPOSE_PROFILES: ""
      PROMPT: "Compare MQTT vs NATS for IoT edge deployments — which has lower latency on constrained ARM devices?"
      # Capture the host's BRAVE_SEARCH_API_KEY via a sh: var rather
      # than Task's `{{.VAR}}` template — Task's templating context
      # only sees task vars, not dotenv-loaded env vars. `sh:` runs
      # a shell that DOES inherit the parent Taskfile's dotenv, so
      # the captured value is the real key when the host has one.
      # Fall-through to empty when unset (precondition below catches
      # that case before we get this far).
      HOST_BRAVE_KEY:
        sh: printf '%s' "${BRAVE_SEARCH_API_KEY:-}"
    preconditions:
      - sh: '[ -n "$ANTHROPIC_API_KEY" ]'
        msg: "ANTHROPIC_API_KEY is unset. Add it to the project-root .env (auto-loaded when invoking from project root) or export it in your shell. Smoke #6 routes the research arc to claude-haiku-4-5; without a key the run cannot start."
      - sh: '[ -n "$BRAVE_SEARCH_API_KEY" ]'
        msg: "BRAVE_SEARCH_API_KEY is unset. Add it to the project-root .env. Without it the framework registers the web_search stub, gather can't ground claims, and the chain wedges in needs_clarification recovery (smoke #6 Finding 1)."
    cmds:
      - 'echo "▶︎  Smoke #6 starting (RUN_ID={{.RUN_ID}}); evidence will land in /tmp/{{.RUN_ID}}/"'
      - defer: { task: test:e2e:agentic:cleanup }
      # Re-use smoke7's capture task — generic enough to handle any
      # real-LLM smoke; just parameterise RUN_ID and the expected
      # terminal role. The wake-up coordinator's respond_direct is the
      # research-category terminal; the chain entity's terminal role
      # is "coordinator" (the wake-up loop).
      - defer:
          task: test:e2e:agentic:smoke7:capture
          vars:
            RUN_ID: "{{.RUN_ID}}"
            WEDGE_EXPECTED_TERMINAL_ROLE: coordinator
      - task: test:e2e:agentic:stack:up
        vars:
          FIXTURE: ""
          AGENTIC_CONFIG: "{{.AGENTIC_CONFIG}}"
          COMPOSE_PROFILES: "{{.COMPOSE_PROFILES}}"
          # Pass the host's BRAVE_SEARCH_API_KEY through to stack:up
          # as a TASK VAR (not an env block), because Task's env:
          # blocks DO NOT propagate to sub-tasks invoked via `task:`.
          # Bisected against PR #181/#182 silent failures: parent's
          # env block stayed at length 0 in the sub-task shell, so
          # docker compose substituted `${BACKEND_BRAVE_SEARCH_API_KEY:-}`
          # to empty and the backend booted with the web_search
          # stub. The vars-passing path is the documented Task
          # idiom for cross-task data flow.
          BACKEND_BRAVE_KEY: "{{.HOST_BRAVE_KEY}}"
      - task: test:e2e:agentic:probe:send
        vars:
          CLI_ARGS: '{{.PROMPT}}'
      # Hard cap on the watcher to bound real-LLM spend. Research
      # category is short (six loops, ~$0.30) so 600s = 10min is
      # generous. Cleanup + capture defers fire either way.
      - timeout 600 task test:e2e:agentic:probe:auto-approve-watcher -- {{.RUN_ID}}

  test:e2e:agentic:dev:_boot:
    desc: Internal — boot helper for the per-scenario dev tasks
    internal: true
    vars:
      FIXTURE: '{{.FIXTURE}}'
      AGENTIC_CONFIG: '{{.AGENTIC_CONFIG}}'
      SCENARIO: '{{.SCENARIO | default "custom"}}'
      COMPOSE_PROFILES: '{{.COMPOSE_PROFILES | default ""}}'
    cmds:
      - echo "▶︎  Booting scenario '{{.SCENARIO}}' (FIXTURE={{.FIXTURE}} AGENTIC_CONFIG={{.AGENTIC_CONFIG}} PROFILES={{.COMPOSE_PROFILES}}) — no auto-cleanup"
      - task: test:e2e:agentic:stack:up
        vars:
          FIXTURE: "{{.FIXTURE}}"
          AGENTIC_CONFIG: "{{.AGENTIC_CONFIG}}"
          COMPOSE_PROFILES: "{{.COMPOSE_PROFILES}}"
      - |
        cat <<EOF

        Stack up at http://localhost:3100 (scenario: {{.SCENARIO}}). Probe with:
          task test:e2e:agentic:probe:loops
          task test:e2e:agentic:probe:send -- 'your message'
          task test:e2e:agentic:probe:triples -- <predicate>
          task test:e2e:agentic:logs

        Re-run the matching spec without rebooting:
          task test:e2e:agentic:run-spec -- e2e/agentic/<scenario>.spec.ts

        Tear down with: task test:e2e:agentic:cleanup
        EOF

  test:e2e:agentic:dev:
    desc: |
      Boot the agentic E2E stack with custom FIXTURE / AGENTIC_CONFIG env
      vars. For named scenarios prefer the dedicated tasks:
        task test:e2e:agentic:dev:research-mvp
        task test:e2e:agentic:dev:ops-agent
        task test:e2e:agentic:dev:real-time-activity

      Use this task when experimenting with a config that does not yet
      have a named scenario entry.

      Tear down with: task test:e2e:agentic:cleanup
    vars:
      FIXTURE: '{{.FIXTURE}}'
      AGENTIC_CONFIG: '{{.AGENTIC_CONFIG}}'
    preconditions:
      - sh: '[ -n "{{.FIXTURE}}" ] && [ -n "{{.AGENTIC_CONFIG}}" ]'
        msg: "FIXTURE and AGENTIC_CONFIG env vars required. Prefer a test:e2e:agentic:dev:<scenario> task."
    cmds:
      - task: test:e2e:agentic:dev:_boot
        vars:
          FIXTURE: "{{.FIXTURE}}"
          AGENTIC_CONFIG: "{{.AGENTIC_CONFIG}}"
          SCENARIO: custom

  test:e2e:agentic:run-spec:
    desc: |
      Run a playwright spec against the already-running stack (booted
      via test:e2e:agentic:dev). Pass the spec path as the first CLI arg.
      Example:
        task test:e2e:agentic:run-spec -- e2e/agentic/ops-agent-baseline.spec.ts
    cmds:
      - npx playwright test {{.CLI_ARGS}}

  test:e2e:agentic:logs:
    desc: |
      Tail backend container logs (debug level by default). Pass --since
      via CLI_ARGS, e.g.:
        task test:e2e:agentic:logs -- --since=30s
    cmds:
      - docker compose -f docker-compose.agentic-e2e.yml logs backend {{.CLI_ARGS | default "--tail=100"}}

  test:e2e:agentic:logs:semsource:
    desc: |
      Tail semsource container logs (only present when the semsource compose
      profile is active — used by R2 source-acquisition scenarios).
        task test:e2e:agentic:logs:semsource -- --since=30s
    cmds:
      - docker logs semteams-ui-agentic-semsource {{.CLI_ARGS | default "--tail=100"}}

  test:e2e:agentic:cleanup:orphans:
    desc: |
      Force-remove orphan agentic containers + networks left behind by an
      interrupted run. Use when `task test:e2e:agentic:cleanup` complains
      about resources still in use.
    cmds:
      - |
        docker ps -a --format '{{`{{.Names}}`}}' \
          | grep -E '^semteams-(ui-)?agentic-' \
          | xargs -I{} docker rm -f {} 2>/dev/null || true
      - docker network rm semteams-agentic_agentic-net ui_agentic-net 2>/dev/null || true
      - echo "✓ orphans cleaned"

  test:e2e:agentic:probe:loops:
    desc: List active loops on the running stack (one-line summary per loop)
    cmds:
      - |
        (
          echo -e "loop_id\tstate\titers\toutcome"
          curl -sf http://localhost:3100/teams-dispatch/loops \
            | jq -r '.[] | "\(.loop_id)\t\(.state)\t\(.iterations)/\(.max_iterations)\t\(.outcome // "-")"'
        ) | column -t -s $'\t'

  test:e2e:agentic:probe:send:
    desc: |
      Send a chat message to the running stack. Pass content as CLI arg:
        task test:e2e:agentic:probe:send -- "Research MQTT vs NATS"
    cmds:
      - |
        CONTENT="{{.CLI_ARGS | default "ping"}}"
        curl -sf -X POST http://localhost:3100/teams-dispatch/message \
          -H 'Content-Type: application/json' \
          -d "$(jq -nc --arg c "$CONTENT" '{content:$c}')" \
          | jq

  test:e2e:agentic:probe:loop:
    desc: |
      Show a single loop's full state (state, outcome, pending_approval).
      Pass the loop_id as CLI arg:
        task test:e2e:agentic:probe:loop -- loop_70876992
    cmds:
      - |
        LOOP_ID="{{.CLI_ARGS}}"
        if [ -z "$LOOP_ID" ]; then
          echo "Usage: task test:e2e:agentic:probe:loop -- <loop_id>" >&2
          exit 1
        fi
        curl -sf "http://localhost:3100/teams-dispatch/loops/$LOOP_ID" \
          | jq '{loop_id, role, state, outcome, error, pending_approval}'

  test:e2e:agentic:probe:approve:
    desc: |
      Approve a loop's pending tool call (R2 source-acquisition + any
      approval-gated journey). Pass the loop_id as CLI arg; optional
      X-User-Id via USER_ID env var (default "ui-anonymous").
        task test:e2e:agentic:probe:approve -- loop_70876992
        USER_ID=alice task test:e2e:agentic:probe:approve -- loop_70876992
    cmds:
      - |
        LOOP_ID="{{.CLI_ARGS}}"
        if [ -z "$LOOP_ID" ]; then
          echo "Usage: task test:e2e:agentic:probe:approve -- <loop_id>" >&2
          exit 1
        fi
        USER_ID="${USER_ID:-ui-anonymous}"
        curl -sf -X POST "http://localhost:3100/teams-dispatch/loops/$LOOP_ID/approval" \
          -H 'Content-Type: application/json' \
          -H "X-User-Id: $USER_ID" \
          -d "$(jq -nc --arg uid "$USER_ID" '{decision:"approve",user_id:$uid}')" \
          | jq

  test:e2e:agentic:probe:reject:
    desc: |
      Reject a loop's pending tool call. Pass the loop_id; optional reason
      via REASON env var.
        task test:e2e:agentic:probe:reject -- loop_70876992
        REASON='out of scope' task test:e2e:agentic:probe:reject -- loop_70876992
    cmds:
      - |
        LOOP_ID="{{.CLI_ARGS}}"
        if [ -z "$LOOP_ID" ]; then
          echo "Usage: task test:e2e:agentic:probe:reject -- <loop_id>" >&2
          exit 1
        fi
        USER_ID="${USER_ID:-ui-anonymous}"
        REASON="${REASON:-rejected via probe task}"
        curl -sf -X POST "http://localhost:3100/teams-dispatch/loops/$LOOP_ID/approval" \
          -H 'Content-Type: application/json' \
          -H "X-User-Id: $USER_ID" \
          -d "$(jq -nc --arg uid "$USER_ID" --arg r "$REASON" '{decision:"reject",user_id:$uid,reason:$r}')" \
          | jq

  test:e2e:agentic:probe:triples:
    desc: |
      Query the graph for triples by predicate (semstreams beta.9 endpoint).
      Pass predicate as CLI arg:
        task test:e2e:agentic:probe:triples -- ops.diagnosis.finding
    cmds:
      - |
        PREDICATE="{{.CLI_ARGS}}"
        if [ -z "$PREDICATE" ]; then
          echo "Usage: task test:e2e:agentic:probe:triples -- <predicate>" >&2
          exit 1
        fi
        curl -sf "http://localhost:3100/graph/triples?predicate=$PREDICATE&limit=20" | jq

  test:e2e:agentic:probe:auto-approve-watcher:
    desc: |
      Run the auto-approve chain watcher against the running stack.
      Polls /teams-dispatch/loops every 5s; logs role transitions to
      /tmp/<run_id>-events.log; auto-approves any pending tool gate
      (de-duped by call_id so list-endpoint staleness can't HTTP-409
      spam). Designed for real-LLM smokes (R3.4 OSH and similar).
      Mock-llm Playwright specs drive approvals themselves; don't
      use this for those.

      Usage:
        task test:e2e:agentic:probe:auto-approve-watcher -- <run_id>
        task test:e2e:agentic:probe:auto-approve-watcher  # defaults run_id=agentic

      Outputs land in /tmp/<run_id>-* (trajectory.jsonl, events.log,
      and three internal de-dup files). Watcher exits when every loop
      is terminal and the count's been stable for ~120s. Ctrl-C is
      always safe.

      Source: ui/scripts/agentic-chain-watcher.sh
    cmds:
      - |
        RUN_ID="{{.CLI_ARGS}}"
        RUN_ID="${RUN_ID:-agentic}"
        bash scripts/agentic-chain-watcher.sh "$RUN_ID" "${E2E_AGENTIC_UI_PORT:-3100}"

  test:e2e:agentic:stack:up:
    desc: Start the agentic E2E Docker stack and wait for health
    internal: true
    vars:
      FIXTURE: '{{.FIXTURE | default ""}}'
      AGENTIC_CONFIG: '{{.AGENTIC_CONFIG | default "e2e-flow-bootstrap.json"}}'
      E2E_AGENTIC_UI_PORT: '{{.E2E_AGENTIC_UI_PORT | default "3100"}}'
      # COMPOSE_PROFILES toggles optional services (e.g. "semsource",
      # "local-models"). Empty default keeps existing journeys boot-
      # fast; the sandbox is always-warm under ADR-042 MVP-7 follow-up
      # and no longer profile-gated.
      COMPOSE_PROFILES: '{{.COMPOSE_PROFILES | default ""}}'
      # Opt-in BRAVE_SEARCH_API_KEY forwarding. Real-LLM smokes (smoke6
      # and similar) pass the host's key via the BACKEND_BRAVE_KEY task
      # var; mock-LLM journeys leave it unset and the backend boots with
      # the deterministic web_search stub. See [[compose-env-boot-gate]]
      # for the design rationale. Stays at this level (stack:up) because
      # Task's env: blocks don't propagate from a parent task to a sub-
      # task invoked via `task:` — the env var must be set on the task
      # that ACTUALLY invokes `docker compose up`.
      BACKEND_BRAVE_KEY: '{{.BACKEND_BRAVE_KEY | default ""}}'
    env:
      FIXTURE: "{{.FIXTURE}}"
      AGENTIC_CONFIG: "{{.AGENTIC_CONFIG}}"
      E2E_AGENTIC_UI_PORT: "{{.E2E_AGENTIC_UI_PORT}}"
      COMPOSE_PROFILES: "{{.COMPOSE_PROFILES}}"
      BACKEND_BRAVE_SEARCH_API_KEY: "{{.BACKEND_BRAVE_KEY}}"
    cmds:
      - echo "Stack config → AGENTIC_CONFIG={{.AGENTIC_CONFIG}} FIXTURE={{.FIXTURE}} PROFILES={{.COMPOSE_PROFILES}}"
      # Smoke #25 finding (2026-05-14): rebuilding only `backend` with
      # --no-cache leaves the sandbox image carrying cached layers from
      # a prior build — Docker's cache-by-content-hash should pick up
      # source mutations, but in practice we hit stale binaries on
      # adjacent slices (Fix A's sandbox/server.go change didn't deploy
      # despite the source modification, because the cache key on the
      # Go build layer didn't invalidate as expected). Both images
      # carry our product code; both need the no-cache treatment to
      # guarantee a smoke runs the committed source. Always-warm
      # sandbox means we always rebuild it.
      - docker compose -f docker-compose.agentic-e2e.yml build --no-cache backend sandbox
      - docker compose -f docker-compose.agentic-e2e.yml up -d
      - |
        PORT="{{.E2E_AGENTIC_UI_PORT}}"
        echo "Waiting for stack at http://localhost:${PORT} ..."
        for i in $(seq 1 60); do
          if curl -sf "http://localhost:${PORT}/health" > /dev/null 2>&1; then
            echo "  Health OK after ${i}s, checking dispatch..."
            # Wait for component HTTP handlers (register slightly after health)
            for j in $(seq 1 10); do
              if curl -sf "http://localhost:${PORT}/teams-dispatch/commands" > /dev/null 2>&1; then
                echo "✅ Stack ready (health + dispatch) after ~$((i + j))s"
                exit 0
              fi
              sleep 1
            done
            echo "⚠️  Health OK but dispatch not responding"
          fi
          sleep 3
        done
        echo "❌ Stack failed to become ready after 180s"
        docker compose -f docker-compose.agentic-e2e.yml logs backend --tail 20
        exit 1

  test:e2e:agentic:cleanup:
    desc: Tear down the agentic E2E Docker stack (skipped when DEBUG=1 or KEEP_STACK_UP=1)
    cmds:
      - |
        # DEBUG=1 / KEEP_STACK_UP=1: skip teardown so the operator can
        # poke at the running stack post-mortem (docker exec into
        # backend/sandbox, curl the dispatch endpoint, etc.). Smoke #25c
        # taught us we lose all evidence with -v cleanup; this is the
        # opt-in escape hatch. Run `task ui:test:e2e:agentic:cleanup`
        # manually to tear down after inspection.
        if [ "${DEBUG:-}" = "1" ] || [ "${KEEP_STACK_UP:-}" = "1" ]; then
          echo "▶︎  Stack teardown SKIPPED (DEBUG=1 / KEEP_STACK_UP=1)."
          echo "    Stack is still running. To inspect:"
          echo "      docker ps --format 'table {{`{{.Names}}\t{{.Status}}`}}' | grep agentic"
          echo "      docker logs semteams-ui-agentic-backend --tail 200"
          echo "      docker exec -it semteams-ui-agentic-sandbox bash"
          echo "      curl http://localhost:3100/teams-dispatch/loops | jq"
          echo "    To tear down when done:"
          echo "      task ui:test:e2e:agentic:cleanup  # (with DEBUG unset)"
          exit 0
        fi
        npm run test:e2e:cleanup

  test:e2e:sandbox:dood:smoke:
    desc: Smoke #d′ — sandbox DooD trust-boundary verification (ADR-034 §addendum #2)
    summary: |
      Brings up the sandbox container alone (no backend / mock-llm /
      semsource) with --docker-mode=dood, runs the
      TestSandboxDooDSmoke integration test which verifies:

        1. `docker` CLI inside the sandbox can talk to the host
           daemon (mounted /var/run/docker.sock + group_add 0).
        2. The sandbox can spawn a sibling nats:2.10-alpine
           container on the shared agentic-net network.
        3. The sandbox process can complete a TCP handshake to the
           sibling's :4222 (the actual cross-container reachability
           that builder testcontainer flows depend on).

      Tears the sandbox down (and the nats sibling on best-effort)
      regardless of test outcome.

      Linux dev hosts where the docker socket is owned by a non-root
      group export SANDBOX_DOCKER_SOCK_GID=$(stat -c '%g' /var/run/docker.sock)
      before running this task; the default of 0 is correct for Mac
      / Docker Desktop where the bind-mounted socket appears as
      root:root inside containers.
    cmds:
      - defer: { task: test:e2e:sandbox:dood:smoke:cleanup }
      # Linux dev hosts where /var/run/docker.sock is owned by a
      # non-root group need SANDBOX_DOCKER_SOCK_GID set; emit the
      # hint up front so the operator gets a clean override line
      # instead of decoding an EACCES later. Mac / Docker Desktop
      # ships GID 0 inside containers and falls through to the
      # group_add 0 default in compose.
      - |
        if [ "$(uname -s)" = "Linux" ] && [ -e /var/run/docker.sock ]; then
          DOCKER_SOCK_GID=$(stat -c '%g' /var/run/docker.sock)
          if [ -z "${SANDBOX_DOCKER_SOCK_GID:-}" ] && [ "$DOCKER_SOCK_GID" != "0" ]; then
            echo "ℹ️  Linux host detected with docker socket GID=$DOCKER_SOCK_GID;"
            echo "    set SANDBOX_DOCKER_SOCK_GID=$DOCKER_SOCK_GID before re-running this task"
            echo "    if the smoke fails on socket EACCES."
          fi
        fi
      - docker compose -f docker-compose.agentic-e2e.yml build sandbox
      - docker compose -f docker-compose.agentic-e2e.yml up -d sandbox
      # Healthcheck loop — `up -d` returns immediately, but the
      # sandbox HTTP server (and the boot-time DooD probe in
      # main.go) need a few seconds to settle. Poll the health
      # endpoint via docker exec to avoid needing a port publish.
      - |
        for i in $(seq 1 20); do
          if docker exec semteams-ui-agentic-sandbox wget -q --spider http://localhost:8090/health 2>/dev/null; then
            echo "✅ sandbox healthy after ~${i}s"
            break
          fi
          if [ "$i" = "20" ]; then
            echo "❌ sandbox failed to become healthy"
            docker logs semteams-ui-agentic-sandbox --tail 30
            exit 1
          fi
          sleep 1
        done
      - cd .. && SANDBOX_DOOD_SMOKE=1 go test -tags=integration -count=1 -v -run TestSandboxDooDSmoke ./test/integration/...

  test:e2e:sandbox:dood:smoke:cleanup:
    internal: true
    cmds:
      # Sweep any DooD-smoke-spawned sibling containers that escaped
      # the test's t.Cleanup (test SIGKILL'd between `docker run -d`
      # and `docker stop`). Without this, a leaked sibling holds an
      # endpoint on agentic-net and the subsequent `down -v` errors
      # with "network has active endpoints".
      - docker ps -aq --filter label=org.semteams.dood-smoke=1 | xargs -r docker rm -f >/dev/null 2>&1 || true
      - docker compose -f docker-compose.agentic-e2e.yml down -v

  # === Linting and Formatting ===

  lint:
    desc: Run ESLint
    cmds:
      - npm run lint

  format:
    desc: Format code with Prettier
    cmds:
      - npm run format

  check:
    desc: Run type checking
    cmds:
      - npm run check

  # === CI ===

  ci:
    desc: Run all CI checks
    cmds:
      - task: lint
      - task: check
      - task: test
      - task: generate-types:check

  # === Cleanup ===

  clean:
    desc: Clean Docker volumes and containers
    cmds:
      - docker compose -f docker-compose.yml down -v
      - docker compose -f docker-compose.e2e.yml down -v
      - echo "✅ Cleaned up Docker resources"
