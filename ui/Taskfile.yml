version: "3"

env:
  # Pin the docker-compose project name so we don't collide with sibling
  # products (semspec, semdragons) whose compose files live in directories
  # also named `ui` and would otherwise share the default project name.
  # Without this, our `nats` service can be shadowed by another project's
  # nats container running concurrently.
  COMPOSE_PROJECT_NAME: '{{.COMPOSE_PROJECT_NAME | default "semteams-agentic"}}'

vars:
  # Backend configuration — the semteams backend
  BACKEND_URL: '{{.BACKEND_URL | default "http://localhost:8080"}}'

  # OpenAPI spec path — defaults to the semteams-generated spec at the repo root
  OPENAPI_SPEC_PATH: '{{.OPENAPI_SPEC_PATH | default "../specs/openapi.v3.yaml"}}'

  # Development ports (configurable to avoid collisions)
  DEV_UI_PORT: '{{.DEV_UI_PORT | default "3001"}}'
  DEV_VITE_PORT: '{{.DEV_VITE_PORT | default "5173"}}'

tasks:
  # === Type Generation ===

  generate-types:
    desc: Generate TypeScript types from the semteams OpenAPI spec
    cmds:
      - npx openapi-typescript {{.OPENAPI_SPEC_PATH}} --output src/lib/types/api.generated.ts
      - echo "✅ TypeScript types generated from {{.OPENAPI_SPEC_PATH}}"

  generate-types:from-url:
    desc: Generate TypeScript types from running backend
    cmds:
      - npx openapi-typescript {{.BACKEND_URL}}/openapi.yaml --output src/lib/types/api.generated.ts
      - echo "✅ TypeScript types generated from {{.BACKEND_URL}}/openapi.yaml"

  generate-types:check:
    desc: Check for uncommitted type changes (CI)
    cmds:
      - task: generate-types
      - git diff --exit-code src/lib/types/api.generated.ts || (echo "⚠️  Generated types changed! Run 'task generate-types' and commit."; exit 1)

  # === Development ===

  dev:
    desc: Start Vite dev server only (no proxy — use dev:connect or dev:full instead)
    cmds:
      - echo "Starting UI dev server..."
      - echo "Expecting backend at {{.BACKEND_URL}}"
      - npm run dev

  dev:connect:
    desc: Connect to any running SemStreams app (no Docker backend needed)
    summary: |
      Starts Caddy + Vite dev server, proxying API requests to a running
      SemStreams backend. No NATS, no Docker build — just point and go.

      Examples:
        task dev:connect                                  # localhost:8080
        BACKEND_HOST=myapp.local:8080 task dev:connect    # remote host
        BACKEND_HOST=10.0.1.5:8080 GRAPHQL_HOST=10.0.1.5:8082 task dev:connect
    vars:
      BACKEND_HOST: '{{.BACKEND_HOST | default "localhost:8080"}}'
      GRAPHQL_HOST: '{{.GRAPHQL_HOST | default .BACKEND_HOST | default "localhost:8080"}}'
    env:
      BACKEND_HOST: "{{.BACKEND_HOST}}"
      GRAPHQL_HOST: "{{.GRAPHQL_HOST}}"
      UI_HOST: "localhost:{{.DEV_VITE_PORT}}"
      LISTEN_PORT: "{{.DEV_UI_PORT}}"
    deps:
      - task: dev:connect:check
        vars:
          BACKEND_HOST: "{{.BACKEND_HOST}}"
    cmds:
      - defer: { task: dev:connect:stop }
      - |
        echo "Connecting to SemStreams backend at {{.BACKEND_HOST}}"
        echo "GraphQL gateway at {{.GRAPHQL_HOST}}"
        echo ""
        echo "UI will be at http://localhost:{{.DEV_UI_PORT}}"
        echo ""
      - caddy start --config Caddyfile.dev
      - npm run dev -- --port {{.DEV_VITE_PORT}} --host
    preconditions:
      - sh: command -v caddy
        msg: "Caddy not found. Install with: brew install caddy"

  dev:connect:check:
    desc: Check if the backend is reachable
    internal: true
    vars:
      BACKEND_HOST: '{{.BACKEND_HOST | default "localhost:8080"}}'
    cmds:
      - |
        if curl -sf "http://{{.BACKEND_HOST}}/health" > /dev/null 2>&1; then
          echo "✅ Backend reachable at {{.BACKEND_HOST}}"
        else
          echo "⚠️  Backend at {{.BACKEND_HOST}} not responding — Caddy will retry"
        fi

  dev:connect:stop:
    desc: Stop the Caddy dev proxy
    internal: true
    cmds:
      - caddy stop 2>/dev/null || true

  # === Full Stack Development ===

  dev:backend:
    desc: Start backend infrastructure (NATS + backend) in foreground
    cmds:
      - echo "Starting backend infrastructure..."
      - echo "NATS will be at localhost:4222"
      - echo "Backend API will be at localhost:8080"
      - docker compose -f docker-compose.dev.yml up

  dev:backend:start:
    desc: Start backend infrastructure in background
    env:
      DEV_UI_PORT: "{{.DEV_UI_PORT}}"
      DEV_VITE_PORT: "{{.DEV_VITE_PORT}}"
    cmds:
      - docker compose -f docker-compose.dev.yml up -d
      - echo "✅ Backend infrastructure starting..."
      - echo "   Access UI at http://localhost:{{.DEV_UI_PORT}}"
      - echo "   Run 'task dev:backend:logs' to see logs"
      - echo "   Run 'task dev:backend:stop' to stop"

  dev:backend:stop:
    desc: Stop backend infrastructure
    cmds:
      - docker compose -f docker-compose.dev.yml down
      - echo "✅ Backend infrastructure stopped"

  dev:backend:logs:
    desc: View backend infrastructure logs
    cmds:
      - docker compose -f docker-compose.dev.yml logs -f

  dev:full:
    desc: Start full development stack (backend + frontend)
    env:
      DEV_UI_PORT: "{{.DEV_UI_PORT}}"
      DEV_VITE_PORT: "{{.DEV_VITE_PORT}}"
    cmds:
      - task: dev:backend:start
      - echo "Waiting for Caddy health check..."
      - |
        for i in $(seq 1 30); do
          if curl -s http://localhost:{{.DEV_UI_PORT}}/health > /dev/null 2>&1; then
            echo "✅ Backend ready!"
            break
          fi
          echo "   Waiting... ($i/30)"
          sleep 2
        done
      - echo ""
      - echo "📱 Open http://localhost:{{.DEV_UI_PORT}} in your browser"
      - echo ""
      - npm run dev -- --port {{.DEV_VITE_PORT}} --host

  dev:docker:
    desc: Start UI in Docker (backend at host.docker.internal:8080)
    cmds:
      - echo "Starting UI in Docker..."
      - docker compose up

  dev:with-caddy:
    desc: Start UI + Caddy in Docker (available at http://localhost:3000)
    cmds:
      - echo "Starting UI + Caddy..."
      - docker compose --profile caddy up

  # === Testing ===

  test:
    desc: Run unit tests
    cmds:
      - npm run test

  test:e2e:
    desc: Run all E2E journey specs (each with its own fixture and fresh stack)
    summary: |
      Runs every Playwright journey under e2e/agentic/ with its paired
      mock-llm fixture, tearing down the docker stack between runs so
      mock-llm reloads the right fixture for each journey.

      Slow (each journey re-builds and re-boots the stack — roughly
      2-3 minutes per journey on first run) but deterministic. Prefer
      the per-scenario tasks (test:e2e:agentic:<slug>) for iterative
      development.
    cmds:
      - task: test:e2e:agentic:tool-approval-gate
      - task: test:e2e:agentic:real-time-activity-stream
      - task: test:e2e:agentic:deep-research
      - task: test:e2e:agentic:ops-agent
      - task: test:e2e:agentic:coordinator-researcher
      - task: test:e2e:agentic:task-story-trace
      - task: test:e2e:agentic:action-chips
      - task: test:e2e:agentic:task-title-aliases
      - task: test:e2e:agentic:admin-flows-inventory
      - task: test:e2e:agentic:research-iterative
      - task: test:e2e:agentic:research-with-source
      - task: test:e2e:agentic:research-with-source-acquisition
      - task: test:e2e:agentic:research-mode-transition
      - task: test:e2e:agentic:dev-via-spec

  test:e2e:agentic:research-with-source:
    desc: Run the R2 source-acquisition journey (add_source_repo + approval gate + SemSource)
    summary: |
      Spawns the SemSource container alongside the regular agentic stack
      (compose profile `semsource`). The journey exercises add_source_repo
      end-to-end: source-curator agent proposes the add → approval gate
      fires → human approves → tool publishes AddRequest on
      graph.ingest.add.research → SemSource replies → loop completes.

      Requires the SemSource image at ghcr.io/c360studio/semsource:latest;
      override with SEMSOURCE_IMAGE if testing an unreleased build.
    vars:
      FIXTURE: research-with-source.yaml
      AGENTIC_CONFIG: e2e-research-with-source.json
      COMPOSE_PROFILES: semsource
    cmds:
      - defer: { task: test:e2e:agentic:cleanup }
      - task: test:e2e:agentic:stack:up
        vars:
          FIXTURE: "{{.FIXTURE}}"
          AGENTIC_CONFIG: "{{.AGENTIC_CONFIG}}"
          COMPOSE_PROFILES: "{{.COMPOSE_PROFILES}}"
      - npx playwright test e2e/agentic/research-with-source.spec.ts

  test:e2e:agentic:tool-approval-gate:
    desc: Run the tool-approval-gate journey with its paired fixture
    vars:
      FIXTURE: tool-approval-gate.yaml
      AGENTIC_CONFIG: e2e-agentic.json
    cmds:
      - defer: { task: test:e2e:agentic:cleanup }
      - task: test:e2e:agentic:stack:up
        vars:
          FIXTURE: "{{.FIXTURE}}"
          AGENTIC_CONFIG: "{{.AGENTIC_CONFIG}}"
      - npx playwright test e2e/agentic/tool-approval-gate.spec.ts

  test:e2e:agentic:research-iterative:
    desc: Run the research-iterative journey with its paired fixture (R1 of ADR-031)
    vars:
      FIXTURE: research-iterative.yaml
      AGENTIC_CONFIG: e2e-research-iterative.json
    cmds:
      - defer: { task: test:e2e:agentic:cleanup }
      - task: test:e2e:agentic:stack:up
        vars:
          FIXTURE: "{{.FIXTURE}}"
          AGENTIC_CONFIG: "{{.AGENTIC_CONFIG}}"
      - npx playwright test e2e/agentic/research-iterative.spec.ts

  test:e2e:agentic:research-harness-hit:
    desc: Run the harness-catalog-hit journey (R3.7.1.e of ADR-033)
    summary: |
      Single-pass researcher emits an artifact whose `harness` field
      references the `stub` entry in configs/harnesses-stub.json,
      mounted via SEMTEAMS_HARNESS_CATALOG_PATH override. Verifies
      boot-time catalog load + persona-fragment auto-render +
      emit_research_artifact harness-field plumbing end-to-end.
      Catalog-miss is structurally a strict subset of this fixture
      (omit harness field) and is implicitly tested by the existing
      research-iterative journey.
    vars:
      FIXTURE: research-harness-hit.yaml
      AGENTIC_CONFIG: e2e-research-harness-hit.json
      SEMTEAMS_HARNESS_CATALOG_PATH: /app/configs/harnesses-stub.json
    cmds:
      - defer: { task: test:e2e:agentic:cleanup }
      - task: test:e2e:agentic:stack:up
        vars:
          FIXTURE: "{{.FIXTURE}}"
          AGENTIC_CONFIG: "{{.AGENTIC_CONFIG}}"
          SEMTEAMS_HARNESS_CATALOG_PATH: "{{.SEMTEAMS_HARNESS_CATALOG_PATH}}"
      - npx playwright test e2e/agentic/research-harness-hit.spec.ts

  test:e2e:agentic:research-mode-transition:
    desc: Run the R3.2.2 research → dev-via-spec mode-transition journey
    summary: |
      End-to-end exercise of ADR-031 R3.2.2: stabilisation gate +
      persona-swap mode transition. Builds on R2.5's chained research
      + source-acquisition arc; adds the emit_research_artifact tool
      call inside each researcher pass and the persona-swap rule
      (03-stabilise-and-transition.json) that fires when the reviewer
      approves a stabilised arc and spawns the dev-via-spec-planner
      stub. The reviewer's stabilisation predicate (zero new substrate
      mutations on the latest revision, per the ADR-031 §addendum
      2026-04-30 "converged change-log" model) lives in the reviewer
      persona; the rule trusts the structured terminal output per
      ADR-028 §Layer 2.

      Seven loops, twenty LLM round-trips. The chain is longer than
      R2.5's because the stabilisation gate makes "approve on the
      pass that mutated" structurally impossible — a settling pass
      with zero new mutations is required before the reviewer can
      approve.

      Requires the SemSource image at ghcr.io/c360studio/semsource:latest;
      override with SEMSOURCE_IMAGE if testing an unreleased build.
    vars:
      FIXTURE: research-mode-transition.yaml
      AGENTIC_CONFIG: e2e-research-mode-transition.json
      COMPOSE_PROFILES: semsource
    cmds:
      - defer: { task: test:e2e:agentic:cleanup }
      - task: test:e2e:agentic:stack:up
        vars:
          FIXTURE: "{{.FIXTURE}}"
          AGENTIC_CONFIG: "{{.AGENTIC_CONFIG}}"
          COMPOSE_PROFILES: "{{.COMPOSE_PROFILES}}"
      - npx playwright test e2e/agentic/research-mode-transition.spec.ts

  test:e2e:agentic:dev-via-spec:
    desc: Run the R3.3 + R3.4b + R3.6.2 dev-via-spec full-chain journey (planner / reviewer / challenger / architect / builder)
    summary: |
      End-to-end exercise of ADR-031 R3.3 (port from SemSpec patterns) +
      R3.4b (architect emits typed artifact) + R3.6.2 (builder slice).
      Builds on R3.2.2's research-mode-transition: the six-loop research
      arc completes, the stabilisation rule spawns the dev-via-spec-
      planner, and the dev-via-spec internal rule chain (configs/rules/
      dev-via-spec/ rules 01/03/05/06) drives the five-role handoff to
      builder terminal.

      Eleven loops, thirty-three LLM round-trips. Covers the golden
      path — every gate (reviewer + challenger) approves on first pass;
      the builder terminates with builder_decide(tests_failing) per
      the fixture's mock-LLM constraint (it cannot pre-know the
      architect's dynamically-dated slug, see fixture comment).
      Retry rules (02 reviewer-rejected, 04 challenger-concerns,
      builder iteration-budget exhaustion) are exercised structurally
      by max_iterations metadata; covering them under e2e is a follow-up
      if the OSH smoke #6 reveals real-LLM retry behaviour worth pinning.

      Requires the SemSource image at ghcr.io/c360studio/semsource:latest
      (override with SEMSOURCE_IMAGE if testing an unreleased build) and
      the sandbox image (built locally from docker/sandbox.Dockerfile).
    vars:
      FIXTURE: dev-via-spec.yaml
      AGENTIC_CONFIG: e2e-dev-via-spec.json
      COMPOSE_PROFILES: semsource,sandbox
    cmds:
      - defer: { task: test:e2e:agentic:cleanup }
      - task: test:e2e:agentic:stack:up
        vars:
          FIXTURE: "{{.FIXTURE}}"
          AGENTIC_CONFIG: "{{.AGENTIC_CONFIG}}"
          COMPOSE_PROFILES: "{{.COMPOSE_PROFILES}}"
      - npx playwright test e2e/agentic/dev-via-spec.spec.ts

  test:e2e:agentic:dev-via-spec-qa:
    desc: Run the R3.7.2.k′ dev-via-spec full-chain journey extended through the qa-reviewer terminal
    summary: |
      End-to-end exercise of ADR-034 R3.7.2.k′ — the post-build
      review hop. Runs the same eleven loops as
      test:e2e:agentic:dev-via-spec, but the builder terminates with
      builder_decide(tests_passing) instead of needs_clarification,
      which triggers configs/rules/dev-via-spec/07-builder-decide-to-
      qa-reviewer.json and spawns the dev-via-spec-qa-reviewer
      (R3.7.2.j′ persona) as Loop L. The qa-reviewer reads the
      builder's terminal and emits decide(needs_clarification)
      because the spawn-rule supplies a hardcoded "(stub)" evidence
      summary — real evidence-rendering plumbing is deferred. See
      project_smoke7_open_plumbing.md §2.

      Twelve loops, thirty-five LLM round-trips. Mock-LLM only —
      real LLM exercise lands in smoke #7 (R3.7.2.l′).

      Requires the SemSource image at ghcr.io/c360studio/semsource:latest
      (override with SEMSOURCE_IMAGE if testing an unreleased build) and
      the sandbox image (built locally from docker/sandbox.Dockerfile).
    vars:
      FIXTURE: dev-via-spec-qa.yaml
      AGENTIC_CONFIG: e2e-dev-via-spec.json
      COMPOSE_PROFILES: semsource,sandbox
    cmds:
      - defer: { task: test:e2e:agentic:cleanup }
      - task: test:e2e:agentic:stack:up
        vars:
          FIXTURE: "{{.FIXTURE}}"
          AGENTIC_CONFIG: "{{.AGENTIC_CONFIG}}"
          COMPOSE_PROFILES: "{{.COMPOSE_PROFILES}}"
      - npx playwright test e2e/agentic/dev-via-spec-qa.spec.ts

  test:e2e:agentic:research-with-source-acquisition:
    desc: Run the chained research + source-acquisition journey (R2.5 of ADR-031)
    summary: |
      End-to-end exercise of the ADR-031 invariant: research can modify
      the substrate it is reasoning over. Joins R1's iterative-research
      rules with R2's add_source_repo + approval gate. The first
      researcher pass flags a corpus gap; the reviewer rejects with
      "recommend add_source_repo"; the retry pass spawns the
      researcher-with-source-acquisition role, which calls
      add_source_repo (approval-gated). After human approval, the same
      loop iterates against the augmented corpus and submits a
      complete artifact; the second reviewer approves; terminal.

      Requires the SemSource image at ghcr.io/c360studio/semsource:latest;
      override with SEMSOURCE_IMAGE if testing an unreleased build.
    vars:
      FIXTURE: research-with-source-acquisition.yaml
      AGENTIC_CONFIG: e2e-research-with-source-acquisition.json
      COMPOSE_PROFILES: semsource
    cmds:
      - defer: { task: test:e2e:agentic:cleanup }
      - task: test:e2e:agentic:stack:up
        vars:
          FIXTURE: "{{.FIXTURE}}"
          AGENTIC_CONFIG: "{{.AGENTIC_CONFIG}}"
          COMPOSE_PROFILES: "{{.COMPOSE_PROFILES}}"
      - npx playwright test e2e/agentic/research-with-source-acquisition.spec.ts

  test:e2e:agentic:real-time-activity-stream:
    desc: Run the real-time-activity-stream journey with its paired fixture
    vars:
      FIXTURE: real-time-activity-stream.yaml
      AGENTIC_CONFIG: e2e-agentic.json
    cmds:
      - defer: { task: test:e2e:agentic:cleanup }
      - task: test:e2e:agentic:stack:up
        vars:
          FIXTURE: "{{.FIXTURE}}"
          AGENTIC_CONFIG: "{{.AGENTIC_CONFIG}}"
      - npx playwright test e2e/agentic/real-time-activity-stream.spec.ts

  test:e2e:agentic:deep-research:
    desc: Run the deep-research journey with researcher config + paired fixture
    vars:
      FIXTURE: deep-research.yaml
      AGENTIC_CONFIG: e2e-deep-research.json
    cmds:
      - defer: { task: test:e2e:agentic:cleanup }
      - task: test:e2e:agentic:stack:up
        vars:
          FIXTURE: "{{.FIXTURE}}"
          AGENTIC_CONFIG: "{{.AGENTIC_CONFIG}}"
      - npx playwright test e2e/agentic/deep-research.spec.ts

  test:e2e:agentic:ops-agent:
    desc: Run the ops-agent baseline journey (ADR-027 Phase 1 — 20 researcher loops + ops diagnostic)
    summary: |
      Drives 20 serial researcher loops against the mock LLM, then
      validates that the ops_observe_complete_loops rule spawns an
      ops-analyst loop whose completion cites docs/objectives/deep-research.md.

      Long-running: 20 mock researcher loops take ~100s. Set a generous
      timeout when running under CI.
    vars:
      FIXTURE: ops-agent-baseline.yaml
      AGENTIC_CONFIG: e2e-ops-observer.json
    cmds:
      - defer: { task: test:e2e:agentic:cleanup }
      - task: test:e2e:agentic:stack:up
        vars:
          FIXTURE: "{{.FIXTURE}}"
          AGENTIC_CONFIG: "{{.AGENTIC_CONFIG}}"
      - npx playwright test e2e/agentic/ops-agent-baseline.spec.ts

  test:e2e:agentic:coordinator-researcher:
    desc: Run the coordinator → researcher delegation journey
    summary: |
      One user prompt produces two loops: coordinator (decide tool) and
      researcher (web_search + synth). Validates the rule-engine spawn
      path (publish_agent on coordinator.next_action triple).
    vars:
      FIXTURE: coordinator-researcher.yaml
      AGENTIC_CONFIG: e2e-coordinator.json
    cmds:
      - defer: { task: test:e2e:agentic:cleanup }
      - task: test:e2e:agentic:stack:up
        vars:
          FIXTURE: "{{.FIXTURE}}"
          AGENTIC_CONFIG: "{{.AGENTIC_CONFIG}}"
      - npx playwright test e2e/agentic/coordinator-researcher.spec.ts

  test:e2e:agentic:task-story-trace:
    desc: Run the task-story / raw-activity right-rail journey
    summary: |
      Reuses the deep-research fixture to land a completed task, then
      drives the right-rail detail panel: Activity tab shows the story
      list; "Show raw activity" disclosure exposes the trace rows.
    vars:
      FIXTURE: deep-research.yaml
      AGENTIC_CONFIG: e2e-deep-research.json
    cmds:
      - defer: { task: test:e2e:agentic:cleanup }
      - task: test:e2e:agentic:stack:up
        vars:
          FIXTURE: "{{.FIXTURE}}"
          AGENTIC_CONFIG: "{{.AGENTIC_CONFIG}}"
      - npx playwright test e2e/agentic/task-story-trace.spec.ts

  test:e2e:agentic:action-chips:
    desc: Run the persona action-chips journey (Research / Plan / Implement)
    vars:
      FIXTURE: deep-research.yaml
      AGENTIC_CONFIG: e2e-deep-research.json
    cmds:
      - defer: { task: test:e2e:agentic:cleanup }
      - task: test:e2e:agentic:stack:up
        vars:
          FIXTURE: "{{.FIXTURE}}"
          AGENTIC_CONFIG: "{{.AGENTIC_CONFIG}}"
      - npx playwright test e2e/agentic/action-chips-personas.spec.ts

  test:e2e:agentic:task-title-aliases:
    desc: Run the editable-title + alias-chip journey
    vars:
      FIXTURE: deep-research.yaml
      AGENTIC_CONFIG: e2e-deep-research.json
    cmds:
      - defer: { task: test:e2e:agentic:cleanup }
      - task: test:e2e:agentic:stack:up
        vars:
          FIXTURE: "{{.FIXTURE}}"
          AGENTIC_CONFIG: "{{.AGENTIC_CONFIG}}"
      - npx playwright test e2e/agentic/task-title-aliases.spec.ts

  test:e2e:agentic:admin-flows-inventory:
    desc: Run the read-only /admin/flows inventory journey
    vars:
      FIXTURE: deep-research.yaml
      AGENTIC_CONFIG: e2e-deep-research.json
    cmds:
      - defer: { task: test:e2e:agentic:cleanup }
      - task: test:e2e:agentic:stack:up
        vars:
          FIXTURE: "{{.FIXTURE}}"
          AGENTIC_CONFIG: "{{.AGENTIC_CONFIG}}"
      - npx playwright test e2e/agentic/admin-flows-inventory.spec.ts

  # === Interactive dev-mode scenario tasks ===
  #
  # Each scenario binds a FIXTURE + AGENTIC_CONFIG pair so the caller does
  # not juggle two env vars. Matches the test:e2e:agentic:<scenario>
  # pattern (which also runs playwright) — these variants just boot and
  # leave the stack up for curl / probe experimentation.
  #
  # Tear down any scenario with: task test:e2e:agentic:cleanup

  test:e2e:agentic:dev:deep-research:
    desc: Boot stack for the deep-research scenario (thin researcher loop + mock-LLM). No playwright.
    cmds:
      - task: test:e2e:agentic:dev:_boot
        vars:
          FIXTURE: deep-research.yaml
          AGENTIC_CONFIG: e2e-deep-research.json
          SCENARIO: deep-research

  test:e2e:agentic:dev:ops-agent:
    desc: Boot stack for the ops-agent scenario (researcher + ops observer). No playwright.
    cmds:
      - task: test:e2e:agentic:dev:_boot
        vars:
          FIXTURE: ops-agent-baseline.yaml
          AGENTIC_CONFIG: e2e-ops-observer.json
          SCENARIO: ops-agent

  test:e2e:agentic:dev:tool-approval:
    desc: Boot stack for the tool-approval-gate scenario. No playwright.
    cmds:
      - task: test:e2e:agentic:dev:_boot
        vars:
          FIXTURE: tool-approval-gate.yaml
          AGENTIC_CONFIG: e2e-agentic.json
          SCENARIO: tool-approval

  test:e2e:agentic:dev:real-time-activity:
    desc: Boot stack for the real-time-activity-stream scenario. No playwright.
    cmds:
      - task: test:e2e:agentic:dev:_boot
        vars:
          FIXTURE: real-time-activity-stream.yaml
          AGENTIC_CONFIG: e2e-agentic.json
          SCENARIO: real-time-activity

  test:e2e:agentic:dev:coordinator:
    desc: Boot stack for the coordinator front-door scenario (coordinator classifies → rule spawns researcher). No playwright.
    cmds:
      - task: test:e2e:agentic:dev:_boot
        vars:
          FIXTURE: coordinator-researcher.yaml
          AGENTIC_CONFIG: e2e-coordinator.json
          SCENARIO: coordinator

  test:e2e:agentic:dev:research-with-source:
    desc: Boot stack for the R2 source-acquisition scenario (semsource container + add_source_repo). No playwright.
    cmds:
      - task: test:e2e:agentic:dev:_boot
        vars:
          FIXTURE: research-with-source.yaml
          AGENTIC_CONFIG: e2e-research-with-source.json
          COMPOSE_PROFILES: semsource
          SCENARIO: research-with-source

  test:e2e:agentic:dev:research-with-source-acquisition:
    desc: Boot stack for the R2.5 chained research + source-acquisition scenario (semsource + iterative researcher rules). No playwright.
    cmds:
      - task: test:e2e:agentic:dev:_boot
        vars:
          FIXTURE: research-with-source-acquisition.yaml
          AGENTIC_CONFIG: e2e-research-with-source-acquisition.json
          COMPOSE_PROFILES: semsource
          SCENARIO: research-with-source-acquisition

  test:e2e:agentic:dev:research-mode-transition:
    desc: Boot stack for the R3.2.2 research → dev-via-spec mode-transition scenario (semsource + emit_research_artifact + stabilisation + persona-swap). No playwright.
    cmds:
      - task: test:e2e:agentic:dev:_boot
        vars:
          FIXTURE: research-mode-transition.yaml
          AGENTIC_CONFIG: e2e-research-mode-transition.json
          COMPOSE_PROFILES: semsource
          SCENARIO: research-mode-transition

  test:e2e:agentic:dev:dev-via-spec:
    desc: Boot stack for the R3.3 dev-via-spec full-chain scenario (planner / reviewer / challenger / architect-light over the R3.2.2 research substrate). No playwright.
    cmds:
      - task: test:e2e:agentic:dev:_boot
        vars:
          FIXTURE: dev-via-spec.yaml
          AGENTIC_CONFIG: e2e-dev-via-spec.json
          COMPOSE_PROFILES: semsource
          SCENARIO: dev-via-spec

  test:e2e:agentic:dev:dev-via-spec-qa:
    desc: Boot stack for the R3.7.2.k′ dev-via-spec-qa scenario (full chain extended through qa-reviewer terminal). No playwright.
    cmds:
      - task: test:e2e:agentic:dev:_boot
        vars:
          FIXTURE: dev-via-spec-qa.yaml
          AGENTIC_CONFIG: e2e-dev-via-spec.json
          COMPOSE_PROFILES: semsource,sandbox
          SCENARIO: dev-via-spec-qa

  test:e2e:agentic:dev:osh-demo:
    desc: |
      Boot the OSH-demo stack — real LLM (claude-sonnet + claude-haiku for
      the dev-via-spec chain), local seminstruct (qwen3-8b) for every
      internal-graph capability, semembed for embeddings, real SemSource
      for source acquisition, sandbox for builder bash + bootstrap_workspace.
      Manual smoke run (R3.4 OSH demo, extended for R3.7.2.l′ smoke #7).
      No playwright — see docs/smoke7-osh-meshtastic.md for the playbook.
    summary: |
      Requires ANTHROPIC_API_KEY in the environment (the compose forwards
      it through to the backend). First run pulls
      ghcr.io/c360studio/seminstruct:qwen3-8b (~5GB) and
      ghcr.io/c360studio/semembed:latest. Allow ~5min for first boot.

      The OSH prompt to send (from ADR-031): "create a driver for
      OpenSensorHub using OGC Connected Systems for Meshtastic devices" —
      send via `task test:e2e:agentic:probe:send -- '<prompt>'` after the
      stack is up, then watch the chain via `task probe:loops`.

      Expected chain shape (R3.7.2.l′ smoke #7): twelve loops total — six
      from the research-mode-transition arc (researcher + reviewer + 2×
      researcher-with-source-acquisition + reviewer + reviewer-approve),
      then the four-role dev-via-spec chain (planner / reviewer /
      challenger / architect), then the builder, then the qa-reviewer.
      See docs/smoke7-osh-meshtastic.md for what to verify at each phase
      and how to capture findings — particularly around the qa-reviewer's
      verdict given the spawn-rule's stubbed evidence_summary (the
      open-plumbing question this smoke is designed to surface).
    cmds:
      - task: test:e2e:agentic:dev:_boot
        vars:
          FIXTURE: ""
          AGENTIC_CONFIG: osh-demo.json
          COMPOSE_PROFILES: semsource,local-models,sandbox
          SCENARIO: osh-demo

  test:e2e:agentic:dev:_boot:
    desc: Internal — boot helper for the per-scenario dev tasks
    internal: true
    vars:
      FIXTURE: '{{.FIXTURE}}'
      AGENTIC_CONFIG: '{{.AGENTIC_CONFIG}}'
      SCENARIO: '{{.SCENARIO | default "custom"}}'
      COMPOSE_PROFILES: '{{.COMPOSE_PROFILES | default ""}}'
    cmds:
      - echo "▶︎  Booting scenario '{{.SCENARIO}}' (FIXTURE={{.FIXTURE}} AGENTIC_CONFIG={{.AGENTIC_CONFIG}} PROFILES={{.COMPOSE_PROFILES}}) — no auto-cleanup"
      - task: test:e2e:agentic:stack:up
        vars:
          FIXTURE: "{{.FIXTURE}}"
          AGENTIC_CONFIG: "{{.AGENTIC_CONFIG}}"
          COMPOSE_PROFILES: "{{.COMPOSE_PROFILES}}"
      - |
        cat <<EOF

        Stack up at http://localhost:3100 (scenario: {{.SCENARIO}}). Probe with:
          task test:e2e:agentic:probe:loops
          task test:e2e:agentic:probe:send -- 'your message'
          task test:e2e:agentic:probe:triples -- <predicate>
          task test:e2e:agentic:logs

        Re-run the matching spec without rebooting:
          task test:e2e:agentic:run-spec -- e2e/agentic/<scenario>.spec.ts

        Tear down with: task test:e2e:agentic:cleanup
        EOF

  test:e2e:agentic:dev:
    desc: |
      Boot the agentic E2E stack with custom FIXTURE / AGENTIC_CONFIG env
      vars. For named scenarios prefer the dedicated tasks:
        task test:e2e:agentic:dev:deep-research
        task test:e2e:agentic:dev:ops-agent
        task test:e2e:agentic:dev:tool-approval
        task test:e2e:agentic:dev:real-time-activity

      Use this task when experimenting with a config that does not yet
      have a named scenario entry.

      Tear down with: task test:e2e:agentic:cleanup
    vars:
      FIXTURE: '{{.FIXTURE}}'
      AGENTIC_CONFIG: '{{.AGENTIC_CONFIG}}'
    preconditions:
      - sh: '[ -n "{{.FIXTURE}}" ] && [ -n "{{.AGENTIC_CONFIG}}" ]'
        msg: "FIXTURE and AGENTIC_CONFIG env vars required. Prefer a test:e2e:agentic:dev:<scenario> task."
    cmds:
      - task: test:e2e:agentic:dev:_boot
        vars:
          FIXTURE: "{{.FIXTURE}}"
          AGENTIC_CONFIG: "{{.AGENTIC_CONFIG}}"
          SCENARIO: custom

  test:e2e:agentic:run-spec:
    desc: |
      Run a playwright spec against the already-running stack (booted
      via test:e2e:agentic:dev). Pass the spec path as the first CLI arg.
      Example:
        task test:e2e:agentic:run-spec -- e2e/agentic/ops-agent-baseline.spec.ts
    cmds:
      - npx playwright test {{.CLI_ARGS}}

  test:e2e:agentic:logs:
    desc: |
      Tail backend container logs (debug level by default). Pass --since
      via CLI_ARGS, e.g.:
        task test:e2e:agentic:logs -- --since=30s
    cmds:
      - docker compose -f docker-compose.agentic-e2e.yml logs backend {{.CLI_ARGS | default "--tail=100"}}

  test:e2e:agentic:logs:semsource:
    desc: |
      Tail semsource container logs (only present when the semsource compose
      profile is active — used by R2 source-acquisition scenarios).
        task test:e2e:agentic:logs:semsource -- --since=30s
    cmds:
      - docker logs semteams-ui-agentic-semsource {{.CLI_ARGS | default "--tail=100"}}

  test:e2e:agentic:cleanup:orphans:
    desc: |
      Force-remove orphan agentic containers + networks left behind by an
      interrupted run. Use when `task test:e2e:agentic:cleanup` complains
      about resources still in use.
    cmds:
      - |
        docker ps -a --format '{{`{{.Names}}`}}' \
          | grep -E '^semteams-(ui-)?agentic-' \
          | xargs -I{} docker rm -f {} 2>/dev/null || true
      - docker network rm semteams-agentic_agentic-net ui_agentic-net 2>/dev/null || true
      - echo "✓ orphans cleaned"

  test:e2e:agentic:probe:loops:
    desc: List active loops on the running stack (one-line summary per loop)
    cmds:
      - |
        (
          echo -e "loop_id\tstate\titers\toutcome"
          curl -sf http://localhost:3100/teams-dispatch/loops \
            | jq -r '.[] | "\(.loop_id)\t\(.state)\t\(.iterations)/\(.max_iterations)\t\(.outcome // "-")"'
        ) | column -t -s $'\t'

  test:e2e:agentic:probe:send:
    desc: |
      Send a chat message to the running stack. Pass content as CLI arg:
        task test:e2e:agentic:probe:send -- "Research MQTT vs NATS"
    cmds:
      - |
        CONTENT="{{.CLI_ARGS | default "ping"}}"
        curl -sf -X POST http://localhost:3100/teams-dispatch/message \
          -H 'Content-Type: application/json' \
          -d "$(jq -nc --arg c "$CONTENT" '{content:$c}')" \
          | jq

  test:e2e:agentic:probe:loop:
    desc: |
      Show a single loop's full state (state, outcome, pending_approval).
      Pass the loop_id as CLI arg:
        task test:e2e:agentic:probe:loop -- loop_70876992
    cmds:
      - |
        LOOP_ID="{{.CLI_ARGS}}"
        if [ -z "$LOOP_ID" ]; then
          echo "Usage: task test:e2e:agentic:probe:loop -- <loop_id>" >&2
          exit 1
        fi
        curl -sf "http://localhost:3100/teams-dispatch/loops/$LOOP_ID" \
          | jq '{loop_id, role, state, outcome, error, pending_approval}'

  test:e2e:agentic:probe:approve:
    desc: |
      Approve a loop's pending tool call (R2 source-acquisition + any
      approval-gated journey). Pass the loop_id as CLI arg; optional
      X-User-Id via USER_ID env var (default "ui-anonymous").
        task test:e2e:agentic:probe:approve -- loop_70876992
        USER_ID=alice task test:e2e:agentic:probe:approve -- loop_70876992
    cmds:
      - |
        LOOP_ID="{{.CLI_ARGS}}"
        if [ -z "$LOOP_ID" ]; then
          echo "Usage: task test:e2e:agentic:probe:approve -- <loop_id>" >&2
          exit 1
        fi
        USER_ID="${USER_ID:-ui-anonymous}"
        curl -sf -X POST "http://localhost:3100/teams-dispatch/loops/$LOOP_ID/approval" \
          -H 'Content-Type: application/json' \
          -H "X-User-Id: $USER_ID" \
          -d "$(jq -nc --arg uid "$USER_ID" '{decision:"approve",user_id:$uid}')" \
          | jq

  test:e2e:agentic:probe:reject:
    desc: |
      Reject a loop's pending tool call. Pass the loop_id; optional reason
      via REASON env var.
        task test:e2e:agentic:probe:reject -- loop_70876992
        REASON='out of scope' task test:e2e:agentic:probe:reject -- loop_70876992
    cmds:
      - |
        LOOP_ID="{{.CLI_ARGS}}"
        if [ -z "$LOOP_ID" ]; then
          echo "Usage: task test:e2e:agentic:probe:reject -- <loop_id>" >&2
          exit 1
        fi
        USER_ID="${USER_ID:-ui-anonymous}"
        REASON="${REASON:-rejected via probe task}"
        curl -sf -X POST "http://localhost:3100/teams-dispatch/loops/$LOOP_ID/approval" \
          -H 'Content-Type: application/json' \
          -H "X-User-Id: $USER_ID" \
          -d "$(jq -nc --arg uid "$USER_ID" --arg r "$REASON" '{decision:"reject",user_id:$uid,reason:$r}')" \
          | jq

  test:e2e:agentic:probe:triples:
    desc: |
      Query the graph for triples by predicate (semstreams beta.9 endpoint).
      Pass predicate as CLI arg:
        task test:e2e:agentic:probe:triples -- ops.diagnosis.finding
    cmds:
      - |
        PREDICATE="{{.CLI_ARGS}}"
        if [ -z "$PREDICATE" ]; then
          echo "Usage: task test:e2e:agentic:probe:triples -- <predicate>" >&2
          exit 1
        fi
        curl -sf "http://localhost:3100/graph/triples?predicate=$PREDICATE&limit=20" | jq

  test:e2e:agentic:probe:auto-approve-watcher:
    desc: |
      Run the auto-approve chain watcher against the running stack.
      Polls /teams-dispatch/loops every 5s; logs role transitions to
      /tmp/<run_id>-events.log; auto-approves any pending tool gate
      (de-duped by call_id so list-endpoint staleness can't HTTP-409
      spam). Designed for real-LLM smokes (R3.4 OSH and similar).
      Mock-llm Playwright specs drive approvals themselves; don't
      use this for those.

      Usage:
        task test:e2e:agentic:probe:auto-approve-watcher -- <run_id>
        task test:e2e:agentic:probe:auto-approve-watcher  # defaults run_id=agentic

      Outputs land in /tmp/<run_id>-* (trajectory.jsonl, events.log,
      and three internal de-dup files). Watcher exits when every loop
      is terminal and the count's been stable for ~120s. Ctrl-C is
      always safe.

      Source: ui/scripts/agentic-chain-watcher.sh
    cmds:
      - |
        RUN_ID="{{.CLI_ARGS}}"
        RUN_ID="${RUN_ID:-agentic}"
        bash scripts/agentic-chain-watcher.sh "$RUN_ID" "${E2E_AGENTIC_UI_PORT:-3100}"

  test:e2e:agentic:stack:up:
    desc: Start the agentic E2E Docker stack and wait for health
    internal: true
    vars:
      FIXTURE: '{{.FIXTURE | default ""}}'
      AGENTIC_CONFIG: '{{.AGENTIC_CONFIG | default "e2e-agentic.json"}}'
      E2E_AGENTIC_UI_PORT: '{{.E2E_AGENTIC_UI_PORT | default "3100"}}'
      # COMPOSE_PROFILES toggles optional services (e.g. "semsource").
      # Empty default keeps existing journeys boot-fast; the
      # research-with-source journey sets COMPOSE_PROFILES=semsource.
      COMPOSE_PROFILES: '{{.COMPOSE_PROFILES | default ""}}'
      # R3.7.1: per-journey harness catalog override. Default falls
      # through to the empty configs/harnesses.json baked into the
      # image; journeys that need a stub harness (research-harness-
      # hit) set this to /app/configs/harnesses-stub.json.
      SEMTEAMS_HARNESS_CATALOG_PATH: '{{.SEMTEAMS_HARNESS_CATALOG_PATH | default "/app/configs/harnesses.json"}}'
    env:
      FIXTURE: "{{.FIXTURE}}"
      AGENTIC_CONFIG: "{{.AGENTIC_CONFIG}}"
      E2E_AGENTIC_UI_PORT: "{{.E2E_AGENTIC_UI_PORT}}"
      COMPOSE_PROFILES: "{{.COMPOSE_PROFILES}}"
      SEMTEAMS_HARNESS_CATALOG_PATH: "{{.SEMTEAMS_HARNESS_CATALOG_PATH}}"
    cmds:
      - echo "Stack config → AGENTIC_CONFIG={{.AGENTIC_CONFIG}} FIXTURE={{.FIXTURE}} PROFILES={{.COMPOSE_PROFILES}}"
      - docker compose -f docker-compose.agentic-e2e.yml build --no-cache backend
      - docker compose -f docker-compose.agentic-e2e.yml up -d
      - |
        PORT="{{.E2E_AGENTIC_UI_PORT}}"
        echo "Waiting for stack at http://localhost:${PORT} ..."
        for i in $(seq 1 60); do
          if curl -sf "http://localhost:${PORT}/health" > /dev/null 2>&1; then
            echo "  Health OK after ${i}s, checking dispatch..."
            # Wait for component HTTP handlers (register slightly after health)
            for j in $(seq 1 10); do
              if curl -sf "http://localhost:${PORT}/teams-dispatch/commands" > /dev/null 2>&1; then
                echo "✅ Stack ready (health + dispatch) after ~$((i + j))s"
                exit 0
              fi
              sleep 1
            done
            echo "⚠️  Health OK but dispatch not responding"
          fi
          sleep 3
        done
        echo "❌ Stack failed to become ready after 180s"
        docker compose -f docker-compose.agentic-e2e.yml logs backend --tail 20
        exit 1

  test:e2e:agentic:cleanup:
    desc: Tear down the agentic E2E Docker stack
    cmds:
      - npm run test:e2e:cleanup

  test:e2e:sandbox:dood:smoke:
    desc: Smoke #d′ — sandbox DooD trust-boundary verification (ADR-034 §addendum #2)
    summary: |
      Brings up the sandbox container alone (no backend / mock-llm /
      semsource) with --docker-mode=dood, runs the
      TestSandboxDooDSmoke integration test which verifies:

        1. `docker` CLI inside the sandbox can talk to the host
           daemon (mounted /var/run/docker.sock + group_add 0).
        2. The sandbox can spawn a sibling nats:2.10-alpine
           container on the shared agentic-net network.
        3. The sandbox process can complete a TCP handshake to the
           sibling's :4222 (the actual cross-container reachability
           that builder testcontainer flows depend on).

      Tears the sandbox down (and the nats sibling on best-effort)
      regardless of test outcome.

      Linux dev hosts where the docker socket is owned by a non-root
      group export SANDBOX_DOCKER_SOCK_GID=$(stat -c '%g' /var/run/docker.sock)
      before running this task; the default of 0 is correct for Mac
      / Docker Desktop where the bind-mounted socket appears as
      root:root inside containers.
    cmds:
      - defer: { task: test:e2e:sandbox:dood:smoke:cleanup }
      # Linux dev hosts where /var/run/docker.sock is owned by a
      # non-root group need SANDBOX_DOCKER_SOCK_GID set; emit the
      # hint up front so the operator gets a clean override line
      # instead of decoding an EACCES later. Mac / Docker Desktop
      # ships GID 0 inside containers and falls through to the
      # group_add 0 default in compose.
      - |
        if [ "$(uname -s)" = "Linux" ] && [ -e /var/run/docker.sock ]; then
          DOCKER_SOCK_GID=$(stat -c '%g' /var/run/docker.sock)
          if [ -z "${SANDBOX_DOCKER_SOCK_GID:-}" ] && [ "$DOCKER_SOCK_GID" != "0" ]; then
            echo "ℹ️  Linux host detected with docker socket GID=$DOCKER_SOCK_GID;"
            echo "    set SANDBOX_DOCKER_SOCK_GID=$DOCKER_SOCK_GID before re-running this task"
            echo "    if the smoke fails on socket EACCES."
          fi
        fi
      - docker compose -f docker-compose.agentic-e2e.yml --profile sandbox build sandbox
      - docker compose -f docker-compose.agentic-e2e.yml --profile sandbox up -d sandbox
      # Healthcheck loop — `up -d` returns immediately, but the
      # sandbox HTTP server (and the boot-time DooD probe in
      # main.go) need a few seconds to settle. Poll the health
      # endpoint via docker exec to avoid needing a port publish.
      - |
        for i in $(seq 1 20); do
          if docker exec semteams-ui-agentic-sandbox wget -q --spider http://localhost:8090/health 2>/dev/null; then
            echo "✅ sandbox healthy after ~${i}s"
            break
          fi
          if [ "$i" = "20" ]; then
            echo "❌ sandbox failed to become healthy"
            docker logs semteams-ui-agentic-sandbox --tail 30
            exit 1
          fi
          sleep 1
        done
      - cd .. && SANDBOX_DOOD_SMOKE=1 go test -tags=integration -count=1 -v -run TestSandboxDooDSmoke ./test/integration/...

  test:e2e:sandbox:dood:smoke:cleanup:
    internal: true
    cmds:
      # Sweep any DooD-smoke-spawned sibling containers that escaped
      # the test's t.Cleanup (test SIGKILL'd between `docker run -d`
      # and `docker stop`). Without this, a leaked sibling holds an
      # endpoint on agentic-net and the subsequent `down -v` errors
      # with "network has active endpoints".
      - docker ps -aq --filter label=org.semteams.dood-smoke=1 | xargs -r docker rm -f >/dev/null 2>&1 || true
      - docker compose -f docker-compose.agentic-e2e.yml --profile sandbox down -v

  # === Linting and Formatting ===

  lint:
    desc: Run ESLint
    cmds:
      - npm run lint

  format:
    desc: Format code with Prettier
    cmds:
      - npm run format

  check:
    desc: Run type checking
    cmds:
      - npm run check

  # === CI ===

  ci:
    desc: Run all CI checks
    cmds:
      - task: lint
      - task: check
      - task: test
      - task: generate-types:check

  # === Cleanup ===

  clean:
    desc: Clean Docker volumes and containers
    cmds:
      - docker compose -f docker-compose.yml down -v
      - docker compose -f docker-compose.e2e.yml down -v
      - echo "✅ Cleaned up Docker resources"
