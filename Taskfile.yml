version: "3"

dotenv: ['.env']

includes:
  build:
    taskfile: ./taskfiles/build.yml
    aliases: [b]
  test:
    taskfile: ./taskfiles/test.yml
    aliases: [t]
  lint:
    taskfile: ./taskfiles/lint.yml
    aliases: [l]
  clean:
    taskfile: ./taskfiles/clean.yml
  schema:
    taskfile: ./taskfiles/schema.yml
  services:
    taskfile: ./taskfiles/services.yml
  dev:
    taskfile: ./taskfiles/dev.yml
    aliases: [d]
  openspec:
    taskfile: ./taskfiles/openspec.yml
  publish:
    taskfile: ./taskfiles/publish.yml

  # Frontend (Svelte 5 + SvelteKit) — see ui/Taskfile.yml for full surface.
  ui:
    taskfile: ./ui/Taskfile.yml
    dir: ./ui

tasks:
  # Default task
  default:
    desc: Show available tasks
    cmds:
      - task --list

  doctor:
    desc: Report tool versions and Docker reachability against their pins; starts no workloads
    cmds:
      - scripts/doctor.sh

  ateam:doctor:
    desc: Check ATeam multi-agent setup, hook, MCP, skill, and review-policy parity without mutating worktree state
    cmds:
      - env -u ATEAM_SESSION_ID -u CLAUDE_SESSION_ID -u CODEX_SESSION_ID -u GEMINI_SESSION_ID ateam doctor --check

  # Both read git's file list (tracked plus unignored untracked), so a primary checkout never
  # walks .worktrees/; gofmt with no file argument would read stdin, hence the empty guard.
  fmt:
    desc: Format Go sources (changes files)
    cmds:
      - |
        files=$(git ls-files --cached --others --exclude-standard -- '*.go' ':!docs/sponsor-packages/**')
        echo "gofmt: $(printf '%s\n' "$files" | grep -c . || true) Go file(s)"
        [ -z "$files" ] || gofmt -w $files

  fmt:check:
    desc: Fail if any Go source needs formatting (no writes)
    cmds:
      - |
        files=$(git ls-files --cached --others --exclude-standard -- '*.go' ':!docs/sponsor-packages/**')
        echo "gofmt: $(printf '%s\n' "$files" | grep -c . || true) Go file(s)"
        drift=""
        [ -z "$files" ] || drift=$(gofmt -l $files)
        if [ -n "$drift" ]; then echo "gofmt drift:"; echo "$drift"; exit 1; fi

  tidy:check:
    desc: Fail if go.mod or go.sum is not tidy
    cmds:
      - go mod tidy -diff

  vet:
    desc: Run go vet over all packages
    cmds:
      - scripts/gopkgs.sh go vet ./...

  cleanup-roots:check:
    desc: Fail if a test stops, closes, or terminates under an unbounded context.Background/TODO
    cmds:
      - scripts/cleanup-roots-check.sh

  merge:check:
    desc: Fail if main lacks an active strict Required ruleset, PR <n> is a non-draft code PR failing .agents/review-policy.json or missing a commit-bound review record, or an open class:flake issue is not closed by PR <n>; -- <n>. Reads GitHub, so not in validate/verify
    cmds:
      - scripts/merge-check.sh {{.CLI_ARGS}}

  # Mirrors ateam's own target (ateam v0.3.4 Taskfile.yml mutate:check) but calls the pinned,
  # installed ateam binary; SemTeams does not vendor ateam's source. Integration-tagged tests are
  # reached through the environment: GOFLAGS=-tags=integration task mutate:check -- ...
  mutate:check:
    desc: "Run non-destructive Go -overlay mutation check (-- -pkg -test -file -mutant -expect or -expect-text)"
    cmds:
      - "ateam mutate {{.CLI_ARGS}}"

  spec:check:
    desc: Validate all OpenSpec changes and specs strictly, then run ateam's spec-check (fails on a hold written outside every task)
    cmds:
      - openspec validate --all --strict
      - ateam state spec-check

  spec:queue:
    desc: Show each in-flight OpenSpec change with its holds and blocking conditions
    cmds:
      - ateam state spec-queue

  # ateam's own test:spec runs unscoped; with thousands of legacy uncited tests we scope missing citations to tests
  # changed since the merge base of TEST_SPEC_BASE and HEAD (ateam #237). Broken citations fail everywhere. CI sets
  # TEST_SPEC_BASE to the pull request base, or the previous main commit on a push; locally it defaults to origin/main.
  test:spec:
    desc: Check that new and changed Go and Vitest tests cite a spec Requirement (ateam test-spec --base)
    cmds:
      - ateam test-spec --base "${TEST_SPEC_BASE:-origin/main}"

  # Observability shortcuts
  observe:up:
    desc: Start Prometheus + Grafana for local monitoring
    cmds:
      - task: services:start:observability

  observe:down:
    desc: Stop observability stack
    cmds:
      - task: services:stop

  observe:logs:
    desc: Tail Prometheus and Grafana logs
    cmds:
      - docker compose -f docker/compose/services.yml --profile observability logs -f

  # Composite tasks
  check:
    desc: Run Go checks (lint + test). Fast — no Node required.
    cmds:
      - task: lint:default
      - task: test:default

  check:all:
    desc: Run Go + UI checks (lint, type-check, test, build). Requires Node.
    cmds:
      - task: lint:default
      - task: test:default
      - task: ui:lint
      - task: ui:check
      - task: ui:test
      - task: ui:build

  validate:
    desc: Run read-only local validation mirroring Repository CI (Go, UI, Governance)
    cmds:
      - scripts/validate.sh

  verify:
    desc: Alias for validate — run read-only local validation mirroring Repository CI (Go, UI, Governance)
    cmds:
      - scripts/verify.sh
