name: Merge check

# As in ateam v0.3.5's merge-check.yml: its own workflow and required check, apart from Repository CI (ateam #255).
# The merge check reads pull request state (the review record, the reviewed-by: line, open flake issues), so it reruns
# on edited, which is how the reviewer's description edit reaches it, without rerunning Go, UI, or Governance; and an
# open class:flake fails Merge check only, never Required. pull_request, not pull_request_target, so the pull request
# that adds or changes this file runs it; this file is read from the pull request, so a change to it is caught by
# review only (ateam's Gate files workflow is a non-goal, #372).
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

# One run per pull request at a time, queued, never cancelled: a cancelled Merge check would sit beside the passing one
# at the same head (ateam #87), and the queued latest event reads the forge after every earlier run finished.
concurrency:
  group: merge-check-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Up-to-date rule, review check and known-flake check (scripts/merge-check.sh). Skipped and renamed on a draft, so a
  # draft head carries no check run named Merge check for GitHub to count as passing (ateam #250).
  merge-check:
    name: ${{ github.event.pull_request.draft && 'Merge check (draft, skipped)' || 'Merge check' }}
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      # The base commit, not the pull request: the script and the review policy it reads are not taken from the tree
      # they judge (ateam #140); the pull request itself is read through the API.
      - name: Checkout base commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Install pinned ateam
        env:
          GOTOOLCHAIN: auto
        run: GOBIN="$RUNNER_TEMP" go install github.com/c360studio/ateam/cmd/ateam@v0.3.5

      # Exit 1 is a rule failure, exit 2 means a forge read was unavailable; the gate's log names which.
      - name: Check the up-to-date rule, the review and its strength, and known flakes
        env:
          ATEAM: ${{ runner.temp }}/ateam
          # Every check the main ruleset must require, so dropping one fails here.
          ATEAM_REQUIRED_CHECKS: Required,Merge check
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: scripts/merge-check.sh "$PR_NUMBER"
