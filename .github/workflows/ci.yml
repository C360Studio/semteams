name: Repository CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned Go tools
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.51.1
          go install github.com/mgechev/revive@v1.15.0

      - name: Lint
        run: task lint

      - name: Unit tests
        run: task test:race

      - name: Integration tests
        run: task test:integration

      - name: Build
        run: go build ./...

      - name: Generate schemas and verify no drift
        run: |
          task schema:generate
          task schema:check-changes

  ui:
    name: UI
    runs-on: ubuntu-latest
    env:
      OPENAPI_SPEC_PATH: ../specs/openapi.v3.yaml
      SCHEMAS_DIR: ../schemas
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run check

      - name: Unit tests
        run: npm run test:unit -- --run

      - name: Check generated types
        run: npm run generate-types:check

      - name: Build
        run: npm run build

  governance:
    name: Governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.20.0

      - name: Install pinned governance tools
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.51.1
          npm install --global @fission-ai/openspec@1.7.0

      - name: Validate OpenSpec
        run: task openspec:validate

      - name: Test OpenSpec queue reporter
        run: task openspec:queue-test

  status-check:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs: [go, ui, governance]
    if: ${{ always() }}
    steps:
      - name: Require every CI lane to pass
        run: |
          if [[ "${{ needs.go.result }}" != "success" ]] || \
             [[ "${{ needs.ui.result }}" != "success" ]] || \
             [[ "${{ needs.governance.result }}" != "success" ]]; then
            echo "One or more required CI jobs failed"
            exit 1
          fi
