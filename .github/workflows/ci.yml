name: Repository CI

on:
  push:
    branches: [main]
  # Listing types replaces GitHub's default three, so ready_for_review is listed with them: marking a draft ready
  # starts the run whose Merge check applies the review check, which does not fail a draft.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# As in ateam's ci.yml: superseded PR runs are cancelled, except the run that marking a draft ready starts, so its
# Required lands after the run already in flight on the same head.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'ready_for_review' }}

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned Go tools
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.51.1
          go install github.com/mgechev/revive@v1.15.0
          GOTOOLCHAIN=auto go install github.com/c360studio/ateam/cmd/ateam@v0.3.4

      - name: Lint
        run: task lint

      - name: Unit tests
        run: task test:race

      - name: Browser qualification runner checks
        run: task test:browser-runner

      - name: Integration tests
        run: task test:integration

      - name: Build
        run: go build ./...

      - name: Generate schemas and verify no drift
        run: |
          task schema:generate
          task schema:check-changes

  ui:
    name: UI
    runs-on: ubuntu-latest
    env:
      OPENAPI_SPEC_PATH: ../specs/openapi.v3.yaml
      SCHEMAS_DIR: ../schemas
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.20.0
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run check

      - name: Unit tests
        run: npm run test:unit -- --run

      - name: Check generated types
        run: npm run generate-types:check

      - name: Build
        run: npm run build

  governance:
    name: Governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.20.0

      - name: Install pinned governance tools
        env:
          GOTOOLCHAIN: auto
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.51.1
          go install github.com/c360studio/ateam/cmd/ateam@v0.3.4
          npm install --global @fission-ai/openspec@1.7.0

      - name: Check ATeam multi-agent parity
        run: task ateam:doctor

      - name: Validate OpenSpec
        run: task openspec:validate

      - name: Test OpenSpec queue reporter
        run: task openspec:queue-test

      - name: Test publish verify script
        run: task publish:verify-test

  # Up-to-date rule, review check and known-flake check (scripts/merge-check.sh), as in ateam's own ci.yml (#372).
  merge-check:
    name: Merge check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      # The base commit, not the pull request: the script and the review policy it reads are not taken from the tree
      # they judge (ateam #140); the pull request itself is read through the API. This workflow file is read from the
      # pull request, so a change to it is caught by review only (ateam's Gate files workflow is a non-goal, #372).
      - name: Checkout base commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Install pinned ateam
        env:
          GOTOOLCHAIN: auto
        run: GOBIN="$RUNNER_TEMP" go install github.com/c360studio/ateam/cmd/ateam@v0.3.4

      # Exit 1 is a rule failure, exit 2 means a forge read was unavailable; the gate's log names which.
      - name: Check the up-to-date rule, the review and its strength, and known flakes
        env:
          ATEAM: ${{ runner.temp }}/ateam
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: scripts/merge-check.sh "$PR_NUMBER"

  required:
    name: Required
    runs-on: ubuntu-latest
    needs: [go, ui, governance, merge-check]
    if: ${{ always() }}
    steps:
      - name: Require every CI lane to pass
        run: |
          if [[ "${{ needs.go.result }}" != "success" ]] || \
             [[ "${{ needs.ui.result }}" != "success" ]] || \
             [[ "${{ needs.governance.result }}" != "success" ]] || \
             [[ "${{ needs.merge-check.result }}" != "success" ]]; then
            echo "Required CI check failed: one or more lanes did not succeed"
            exit 1
          fi
